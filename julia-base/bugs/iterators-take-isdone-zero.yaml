id: iterators-take-isdone-zero
title: isempty(Iterators.take(itr, 0)) is false for stateful iterators, and zip then consumes elements
priority: P1
kind: wrong-result
area: Iterators
files:
- base/iterators.jl
functions:
- isdone(::Take)
- isempty(::Take)
- zip
summary: |
  isdone(t::Take) returns isdone(t.xs) without looking at t.n. For a nonempty
  stateful iterator (Iterators.Stateful, eachline) isdone(take(itr, 0)) is
  false, so isempty(take(itr, 0)) returns false although take(itr, 0) yields
  nothing. zip trusts the same answer: zip(a, take(s, 0)) pops an element of
  the stateful a before noticing that the take is empty, breaking zip's
  documented promise.
likelihood: |
  Needs take(itr, 0) of a stateful iterator with a definite isdone (Stateful,
  eachline, readeach, DirEntryIterator). A count of 0 arises naturally from
  computed lengths; the wrong isempty is silent.
maybe_intended: |
  No documented exception permits a zero-count take to be nonempty. Upstream
  issue #64151 reports this exact failure and merged PR #64340 fixes it.
reproducer: |
  s = Iterators.Stateful([1, 2, 3])
  t = Iterators.take(s, 0)
  isempty(t)  # false
  collect(t)  # Int64[]
  a = Iterators.Stateful([10, 20, 30])
  collect(zip(a, Iterators.take(Iterators.Stateful([1]), 0)))
  collect(a)  # [20, 30]; the leading 10 was consumed
output:
  release: |
    isempty(take(Stateful([1,2,3]), 0)) = false, collect = Int64[]
    isempty(take(eachline(io), 0)) = false
    collect(zip(a, take(Stateful([1]), 0))) = Tuple{Int64, Int64}[], then collect(a) = [20, 30]
    REPRODUCED iterators-take-isdone-zero
  nightly: |
    isempty(take(Stateful([1,2,3]), 0)) = false, collect = Int64[]
    isempty(take(eachline(io), 0)) = false
    collect(zip(a, take(Stateful([1]), 0))) = Tuple{Int64, Int64}[], then collect(a) = [20, 30]
    REPRODUCED iterators-take-isdone-zero
reproduced:
  release: true
  nightly: true
expected: |
  isempty(take(itr, 0)) == true for every itr, and zip(a, take(s, 0)) leaves a
  untouched (collect(a) == [10, 20, 30]).
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  base/essentials.jl:1216: "Determine whether a collection is empty (has no elements)."
  base/iterators.jl:347-348: "`zip` orders the calls to its subiterators in such a way that stateful iterators will
  not advance when another iterator finishes in the current iteration."
cause: |
  base/iterators.jl:824, isdone(t::Take) = isdone(t.xs), ignores t.n. The
  stateful version, line 825, does check state[1] <= 0. isempty
  (base/essentials.jl:1235-1238) and _zip_isdone (base/iterators.jl:496-501)
  take the false at face value.
possible_fix: |
  isdone(t::Take) = (t.n <= 0) | isdone(t.xs).
