reproduced: {release: true, nightly: true, master: true}
expected: |
  false, the undef half of the renaming for a slot with no value, as
  rename_uses! gives for UNDEF_TOKEN => false.
promised_by: |
  The @isdefined case of fixemup! (Compiler/src/ssair/slot2ssa.jl:119-126)
  answers with the second half of the renaming, which is meant to say whether
  the slot is defined; construct_ssa! pairs UNDEF_TOKEN with false
  (lines 660-666).
cause: |
  Compiler/src/ssair/slot2ssa.jl:153 passes `::SlotNumber->Pair{Any,Any}(ssa,
  true)` whatever ssa is. Lean:
  JuliaLean.Proofs.Compiler.src.ssair.slot2ssa.fixupIsdefinedUndef_refuted.
possible_fix: |
  Pass `ssa === UNDEF_TOKEN ? false : true` as the second half, or delete
  fixup_uses! together with the disabled branch.
