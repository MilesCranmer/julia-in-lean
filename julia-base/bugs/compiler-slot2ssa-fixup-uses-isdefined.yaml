id: compiler-slot2ssa-fixup-uses-isdefined
title: "fixup_uses! with UNDEF_TOKEN turns @isdefined(x) into true"
priority: P3
kind: wrong-result
area: Compiler
files: [Compiler/src/ssair/slot2ssa.jl]
functions: ["fixup_uses!(ir::IRCode, ci::CodeInfo, code::Vector{Any}, uses::Vector{Int}, slot::Int, @nospecialize(ssa))"]
summary: |
  fixup_uses! renames every use of a slot with the pair `ssa => true`, that
  is, it says the slot is defined whatever ssa is. With ssa === UNDEF_TOKEN,
  every read of the slot gets a throw_undef_if_not(:x, false), but a use
  @isdefined(x) becomes `true`.
likelihood: |
  None today. The only caller is the disabled `if false` branch of
  construct_ssa! (Compiler/src/ssair/slot2ssa.jl:578-599). It matters only if
  that branch is enabled again or the function gets a new caller.
  Triage 2026-11-10. Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  Withdrawn as a bug report: the only caller is the `if false` branch at
  Compiler/src/ssair/slot2ssa.jl:579 on master, so no compiled code can reach it. Kept as a
  cleanup note: delete fixup_uses! together with the dead branch (as 5fdc91d4e3 and e3030f372d
  did for other unused Compiler functions), or fix the pair if the branch is enabled again.
maybe_intended: |
  The disabled branch may never pass UNDEF_TOKEN; nothing says so.
reproducer: |
  # code = Any[nothing, Expr(:isdefined, SlotNumber(2))] in a one-block IRCode
  Compiler.fixup_uses!(ir, ci, ir.stmts.stmt, [2], 2, Compiler.UNDEF_TOKEN)
  ir.stmts.stmt[2]   # true
