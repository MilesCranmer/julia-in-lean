id: bitarrays-bitset-symdiff-duplicates
title: "symdiff!(::BitSet, itr) cancels repeated iterable elements instead of ignoring duplicates"
priority: P1
kind: wrong-result
area: BitArrays
files:
  - base/bitset.jl
  - base/abstractset.jl
functions:
  - "symdiff!(::BitSet, itr)"
  - "symdiff(::BitSet, itr)"
  - "int_symdiff!"
summary: |
  symdiff!(BitSet(), [1, 1]) produces an empty set, while the same operation
  on Set{Int} produces the singleton containing 1. The BitSet specialization
  toggles membership for every occurrence, so two copies of an initially
  absent element cancel. The generic AbstractSet method first removes
  duplicate input elements. The nonmutating BitSet wrapper uses the same
  affected specialization.
likelihood: |
  An ordinary duplicate-containing vector or other iterable triggers the
  disagreement. No large values, allocation failure, or unusual callbacks
  are required. Membership changes silently.
maybe_intended: |
  Toggling every occurrence implements parity semantics. The symdiff!
  documentation restricts its multiplicity warning to array destinations,
  and the generic AbstractSet method deduplicates the iterable. Historical
  PR #46397 changed the generic behavior but retained this BitSet method.
  Open issue #64145 and open repair PR #64442 identify this exact omission.
reproducer: |
  function reproduced()
      items = [1, 1]
      actual = symdiff!(BitSet(), items)
      reference = symdiff!(Set{Int}(), items)
      return isempty(actual) && (1 in reference) && length(reference) == 1
  end
  ok = try
      reproduced()
  catch
      false
  end
  println(ok ? "REPRODUCED bitarrays-bitset-symdiff-duplicates" :
               "NOT_REPRODUCED bitarrays-bitset-symdiff-duplicates")
output:
  release: |
    REPRODUCED bitarrays-bitset-symdiff-duplicates
  nightly: |
    REPRODUCED bitarrays-bitset-symdiff-duplicates
reproduced:
  release: true
  nightly: true
expected: |
  symdiff!(BitSet(), [1, 1]) contains exactly 1, matching
  symdiff!(Set{Int}(), [1, 1]). Repeated elements of the iterable count once
  when the destination is a set.
promised_by: |
  At Julia commit f755f49a9e41380d7da126b3c1db9fe7f83dd027,
  base/abstractset.jl:284 states: "Construct the symmetric difference of the
  passed in sets, and overwrite `s` with the result."
  base/abstractset.jl:285-286 states: "When `s` is an array, the order is
  maintained. Note that in this case the multiplicity of elements matters."
  base/abstractset.jl:297 implements the set case explicitly:
  `symdiff!(s::AbstractSet, itr) = symdiff!(s::AbstractSet, Set(itr))`.
cause: |
  At the pinned commit, base/bitset.jl:305-310 specializes symdiff! for a
  BitSet destination and an unrestricted iterable. It calls int_symdiff!
  once for each occurrence. base/bitset.jl:319-323 converts the integer,
  negates its current membership, and writes that bit. Two occurrences
  therefore toggle the same bit twice. The AbstractSet specialization at
  base/bitset.jl:312-317 does not intercept a Vector input.
possible_fix: |
  Remove the unrestricted iterable BitSet specialization so the generic
  AbstractSet method deduplicates the input. Retain appropriate specialized
  methods for already distinct set inputs. Open PR #64442 proposes this
  repair; no source repair is applied by this report.
