id: iocov-secretbuffer-peek
title: "peek(::SecretBuffer, Char) throws FieldError: SecretBuffer has no mark field"
priority: P3
kind: wrong-exception
area: IOCov
files: [base/secretbuffer.jl, base/io.jl]
functions: ["peek(::IO, ::Type{T})", "Base.SecretBuffer"]
summary: |
  SecretBuffer is documented as an IOBuffer-like IO, but it has no mark field. The
  generic peek(s::IO, T), and mark/reset/unmark, assign io.mark, so peek(s, Char) (or
  any T other than UInt8) throws FieldError instead of returning the next character.
likelihood: |
  Only for code that parses the contents of a SecretBuffer with generic IO functions
  that peek at characters.
maybe_intended: |
  base/io.jl:1564-1566 notes that the marking functions "expect that io.mark exists for
  the concrete IO type. This may not be true for IO types not in base." SecretBuffer is
  in Base.
reproducer: |
  s = Base.SecretBuffer("héllo")
  println("peek(s, UInt8) = ", peek(s, UInt8))
  try
      println("peek(s, Char) = ", repr(peek(s, Char)))
  catch e
      println("peek(s, Char) threw ", typeof(e), ": ", first(sprint(showerror, e), 80))
      e isa FieldError && println("REPRODUCED iocov-secretbuffer-peek")
  end
  Base.shred!(s)
output:
  release: |
    peek(s, UInt8) = 104
    peek(s, Char) threw FieldError: FieldError: type Base.SecretBuffer has no field `mark`, available fields: `data`
    REPRODUCED iocov-secretbuffer-peek
  nightly: |
    peek(s, UInt8) = 104
    peek(s, Char) threw FieldError: FieldError: type Base.SecretBuffer has no field `mark`, available fields: `data`
    REPRODUCED iocov-secretbuffer-peek
reproduced: {release: true, nightly: true}
expected: |
  peek(s, Char) = 'h', leaving the buffer position unchanged.
promised_by: |
  SecretBuffer docstring (base/secretbuffer.jl:6): "An [`IOBuffer`](@ref)-like object";
  peek docstring: "Read and return a value of type `type` from a stream without
  advancing the current position in the stream."
cause: |
  base/secretbuffer.jl:31-41 declares only data, size and ptr; base/io.jl:382-388 and
  1575-1606 read and write io.mark.
possible_fix: |
  Add a mark::Int field (initialised to -1) to SecretBuffer, or define
  peek(::SecretBuffer, T) with a saved ptr.
duplicates:
  issues: []
  queries: ["SecretBuffer peek", "SecretBuffer mark"]
lean:
  property: JuliaLean.IOCov.Secret.PeekChar
  theorem: JuliaLean.IOCov.Secret.peekChar_refuted
