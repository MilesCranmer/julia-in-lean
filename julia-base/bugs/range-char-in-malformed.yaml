id: range-char-in-malformed
title: "in reports a malformed Char as present in a range when no element equals it"
priority: P2
kind: wrong-result
area: Ranges
files: [base/range.jl]
functions: ["in(x::AbstractChar, r::AbstractRange{<:AbstractChar})"]
summary: |
  Membership testing for a character range compares the candidate's integer codepoint
  with the range bounds and step, but does not verify equality with a range element.
  A malformed Char whose codepoint matches a valid element is therefore reported as
  present even though it is not equal to any value in the range.
likelihood: |
  Very low: this requires a malformed Char whose codepoint matches a valid character
  in the range but whose stored representation differs.
maybe_intended: ""
reproducer: |
  x = reinterpret(Char, 0x41000041)
  r = 'A':'B'
  x in r  # true although any(==(x), r) is false
output:
  release: |
    JULIA 1.13.2 COMMIT 45b6d15e34bbd2003a31acce0b1847b63dad029c
    x = '\x41\x00\x00\x41', Int(x) = 65, collect(r) = ['A', 'B']
    x in r = true, any(==(x), r) = false
    REPRODUCED range-char-in-malformed
  nightly: |
    JULIA 1.15.0-DEV.unknown COMMIT f755f49a9e41380d7da126b3c1db9fe7f83dd027
    x = '\x41\x00\x00\x41', Int(x) = 65, collect(r) = ['A', 'B']
    x in r = true, any(==(x), r) = false
    REPRODUCED range-char-in-malformed
reproduced: {release: true, nightly: true}
expected: |
  x in r should be false because x is not == to either element 'A' or 'B'.
promised_by: |
  The in docstring, base/operators.jl:1502-1507, defines membership as being == to
  one of the values generated by the collection. Char equality, base/char.jl:263,
  compares the stored 32-bit representations, not only the integer codepoint.
cause: |
  base/range.jl:1495-1498 checks x against the minimum and maximum characters and
  tests whether Int(x) lies on the step, but never checks x == r[i]. The malformed
  Char has Int(x) == 65, so the codepoint test succeeds for 'A':'B' even though its
  stored representation differs from 'A'.
possible_fix: |
  After the bounds and step checks identify a candidate index, verify that x is ==
  to the corresponding range element.
duplicates:
  issues: []
  queries: ["issues: Char range malformed membership", "issues: malformed Char in range Julia", "issues: AbstractChar range codepoint equality", "prs: Char range malformed membership", "prs: malformed Char in range Julia", "prs: AbstractChar range codepoint equality"]
lean:
  property: JuliaLean.Proofs.base.range.CharRangeInEq
  theorem: JuliaLean.Proofs.base.range.charRangeInEq_refuted
