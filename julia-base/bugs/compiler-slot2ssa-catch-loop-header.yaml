id: compiler-slot2ssa-catch-loop-header
title: "A while loop at the start of a catch block reads a stale local (wrong result, segfault)"
priority: P0
kind: wrong-result
area: Compiler
files: [Compiler/src/ssair/slot2ssa.jl]
functions: ["construct_ssa!(ci::CodeInfo, ir::IRCode, sv::OptimizationState, domtree::DomTree, defuses::Vector{SlotInfo}, 𝕃ₒ::AbstractLattice)"]
summary: |
  When a catch block starts with a while loop, the catch block is also the loop
  header. For a local that is assigned in the try and changed in the loop,
  construct_ssa! puts both a PhiC node and a phi node in that block. On the
  first visit of the block the renaming sets the local to the new phi and then
  overwrites it with the PhiC node, so every read in the loop gets the value
  the local had when the exception was thrown. The phi that carries the loop
  value is dead. The function below returns 1 instead of 4; with a Ref
  argument in the same shape, calling the function segfaults.
likelihood: |
  Likely to be hit by real code: a retry or polling loop written directly at
  the top of a catch block, with a counter or accumulator that is also set in
  the try, is ordinary Julia. No @goto or unusual syntax is needed. The shape
  exists since 1.11, where lowering stopped putting a :leave at the start of
  the catch block; Julia 1.10.12 returns 4 because its catch block starts with
  that :leave and the loop header is a separate block. In the difftest's
  generated functions, every verify_ir failure we inspected (4 of about 25 per
  20000 cases) had a catch or finally body that starts with a while loop. The
  messages were "φ node N is not at the beginning of the basic block N" (the
  phi comes after the PhiC node) and "Basic Block N does not dominate block
  N", and code_ircode's final IR fails verify_ir on them too.
  Triage 2026-11-10. Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  Also on master 4c0e39dde6, the Ref variant h(Ref(0)) segfaults ("signal 11"), and Julia
  1.10.12 returns 4 for it. Master Compiler/src/ssair/slot2ssa.jl is unchanged since the pinned
  commit, and no lowering change since then touches how a catch block starts. Not a model
  artifact: the reproducer is plain source code, with no @goto or generated code. Not intended:
  the PhiC overwrite assumes a catch block has no ordinary predecessors, which lowering has not
  guaranteed since 1.11. Duplicate search: #63994 (open) is a different stale-local bug in
  `finally` (cfg_simplify! drops an upsilon after inlining); #57393 (open) is an LLVM-side
  try/catch issue; #62519 (merged) changed codegen for PhiC slots of unreachable catch blocks.
  None covers this one. P0: wrong result and a segfault from ordinary code, a regression since
  1.11.
maybe_intended: ""
reproducer: |
  const C = Ref(0)
  function loopcatch()
      x = 0
      try
          x = 1
          error("e")
      catch
          while C[] < 3
              C[] += 1
              x += 1
          end
      end
      return x
  end
  loopcatch()   # 1; 4 with --compile=min
