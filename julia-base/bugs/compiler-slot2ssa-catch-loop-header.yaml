reproduced: {release: true, nightly: true, master: true}
expected: |
  loopcatch() == 4, as with --compile=min and on Julia 1.10.12. With
  `function h(r)` in the same shape (`while r[] < 3; r[] += 1; x += 1; end`
  in the catch block), h(Ref(0)) should return 4; it segfaults ("signal 11:
  Segmentation fault" in getproperty) on the pinned Julia, nightly
  290d5bb5f5 and 1.13.3. Julia 1.11.9 and 1.12.7 also return 1 for
  loopcatch().
promised_by: |
  The semantics of local variables: x += 1 in the loop must be seen by the
  next iteration. The comment of compute_live_ins (Compiler/src/ssair/
  slot2ssa.jl:495-497) says the pruning "prevents insertion of dead phi
  nodes"; here a phi that pruned SSA places is dead because the renaming
  drops it.
cause: |
  Compiler/src/ssair/slot2ssa.jl:602-636 makes a PhiC node for each slot that
  is live into a catch block, and adds the catch block to the def blocks, so
  the iterated dominance frontier (lines 637-657) also gives the catch block a
  phi when a loop back edge enters it. In the renaming walk, lines 691-706 set
  incoming_vals[slot] to the new phi, and then lines 709-715 ("Record phi_C
  nodes if necessary") overwrite it with the PhiC node on the first visit. The
  PhiC node only collects upsilons from stores inside the try region, so the
  value arriving on the back edge is lost. The code assumes a catch block has
  no ordinary predecessors, which lowering no longer guarantees since 1.11.
  Master eb844b8ebd999935a31829e19823db70c711d05f (2026-11-10) has the same
  lines: Compiler/src/ssair/slot2ssa.jl is unchanged since the pinned
  f755f49a9e. Lean:
  JuliaLean.Proofs.Compiler.src.ssair.slot2ssa.phisUsed_refuted, on the input
  of a function `h3` of this shape.
possible_fix: |
  Keep the catch block's exceptional entry separate from its loop entries, for
  example by having lowering (or convert_to_ircode!) start the catch block
  with a statement of its own so that the loop header is a separate block, as
  in 1.10. Alternatively, in construct_ssa!, when a block has both, make the
  phi take the PhiC value as its operand on the exceptional edge instead of
  letting the PhiC replace it.
