    - "issues: show_sym"
    - "issues: Symbol carriage return show"
    - "issues: var\"\" printing"
    - "prs: var string symbol show"
    - "prs: show_sym"
    - "prs: Symbol carriage return show"
    - "prs: var\"\" printing"
lean:
