reproduced: {release: true, nightly: true, master: true}
expected: |
  A body cost at or below the threshold yields an inlineable cost: the clamp saturates at
  the largest finite encoded value (3968) instead of the never-inline marker, or the encoding
  grows.
promised_by: |
  is_inlineable(src) = inlining_cost(src) != MAX_INLINE_COST (Compiler/src/optimize.jl:127)
  and inline_cost_model returns MAX_INLINE_COST only when bodycost > cost_threshold
  (optimize.jl:1938-1942); MAX_INLINE_COST is the "not inlineable" marker.
cause: |
  Compiler/src/optimize.jl:131-137: `x > MAX_INLINE_COST && return MAX_INLINE_COST` lets 3969:65535
  through to `jl_encode_inlining_cost`, which saturates at 0xff (src/ircode.c:1250-1251), and
  `jl_decode_inlining_cost(0xff)` is 0xffff (ircode.c:1258-1259). Unchanged on master eb844b8ebd
  (2026-11-10).
possible_fix: |
  Clamp finite costs above 3968 to 3968 (the decoded value of byte 254) before encoding, so
  only MAX_INLINE_COST itself means "never inline".
