id: hashops-annotated-non8-hash
title: "hash(::AnnotatedString) throws for non-UInt8 AbstractString storage"
priority: P2
kind: wrong-exception
area: HashOps
files:
  - base/hashing.jl
  - base/strings/annotated.jl
functions:
  - "hash(::AbstractString, ::UInt)"
  - "iterate(::UTF8Units)"
summary: |
  An annotation-free AnnotatedString over a one-character UInt32-codeunit
  AbstractString is isequal to its parent, but hashing the wrapper raises
  ArgumentError while hashing the parent succeeds. Both release and pinned
  nightly reproduce the failure with Base's inherited index arithmetic.
likelihood: |
  Requires a custom non-UInt8-codeunit AbstractString wrapped in AnnotatedString.
  UInt32 code units are explicitly supported by the AbstractString interface.
  The one-character input needs no invalid encoding or oversized allocation.
maybe_intended: |
  Annotations may affect equality, but this wrapper has no annotations and Base
  explicitly makes it equal to its parent. The custom string inherits Base's
  index arithmetic and uses ordinary Char iteration with UInt32 code units.
reproducer: |
  using Base: AnnotatedString
  struct UTF32TestString <: AbstractString
      chars::Vector{Char}
  end
  Base.ncodeunits(s::UTF32TestString) = length(s.chars)
  Base.codeunit(::UTF32TestString) = UInt32
  Base.codeunit(s::UTF32TestString, i::Integer) = UInt32(s.chars[i])
  Base.isvalid(s::UTF32TestString, i::Integer) = 1 <= i <= length(s.chars)
  Base.getindex(s::UTF32TestString, i::Integer) = s.chars[i]
  Base.iterate(s::UTF32TestString, i::Integer=1) =
      i > length(s.chars) ? nothing : (s.chars[i], i + 1)
  s = UTF32TestString(['a'])
  a = AnnotatedString(s)
  @assert isequal(a, s)
  @assert hash(s, UInt(0)) isa UInt
  try
      hash(a, UInt(0))
      error("wrapper hash unexpectedly succeeded")
  catch err
      err isa ArgumentError || rethrow()
      println("REPRODUCED hashops-annotated-non8-hash")
  end
output:
  release: |
    Julia 1.13.2, commit 45b6d15e34bbd2003a31acce0b1847b63dad029c:
    isequal(a, s) = true
    hash(s, 0) = 6457959414642172395
    hash(a, 0) error = ArgumentError: Source type for `reinterpret` must be isbits
    REPRODUCED hashops-annotated-non8-hash
  nightly: |
    Julia 1.15.0-DEV.unknown, commit f755f49a9e41380d7da126b3c1db9fe7f83dd027:
    isequal(a, s) = true
    hash(s, 0) = 6457959414642172395
    hash(a, 0) error = ArgumentError: Source type for `reinterpret` must be isbits
    REPRODUCED hashops-annotated-non8-hash
reproduced:
  release: true
  nightly: true
expected: |
  Hashing the annotation-free wrapper should succeed and equal the parent's
  hash at the same seed. The failure breaks the documented equality/hash
  contract through an exception; two successful unequal hashes are not claimed.
promised_by: |
  At Julia commit f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  base/hashing.jl:14-15: "Compute an integer hash code such that
  `isequal(x,y)` implies `isequal(hash(x), hash(y))`. The
  optional second argument `h` is another hash code to be mixed with the result."
  base/strings/basic.jl:73-75: "Return the code unit type of the given string
  object. For ASCII, Latin-1, or UTF-8 encoded strings, this would be `UInt8`;
  for UCS-2 and UTF-16 it would be `UInt16`; for UTF-32 it would be `UInt32`."
  base/strings/annotated.jl:11-13: "More specifically, this is a simple wrapper
  around any other [`AbstractString`](@ref) that allows for regions of the
  wrapped string to be annotated with labeled values."
  base/strings/annotated.jl:232:
  `==(a::AnnotatedString, b::AbstractString) = isempty(a.annotations) && a.string == b`
cause: |
  At the pinned commit, base/hashing.jl:649-650 sends AbstractString hashing
  through utf8units. Line 106 selects UTF8Units for UInt32 code units, and lines
  115 and 138 reinterpret the iterated character as UInt32.
  base/strings/annotated.jl:150-157 preserves the parent's code-unit type but
  iterates AnnotatedChar values. Lines 192-195 construct AnnotatedChar even for
  empty annotations. Its Vector field at lines 95-98 makes it non-isbits,
  explaining the observed ArgumentError. This source-based explanation has not
  been checked against every step of the code path.
possible_fix: |
  Decode AbstractChar through an appropriate character conversion before
  accessing its representation in UTF8Units. Any AnnotatedString-specific hash
  method must also respect annotation-sensitive equality. No fix is applied.
