reproduced: {release: true, nightly: true}
expected: |
  accumulate! should write the sole output element and return. It must not read any
  index other than typemax(Int).
promised_by: |
  The cumsum! docstring at base/accumulate.jl:44-49 says it stores the cumulative sum
  of A in B. accumulate! at lines 337-355 checks that B and A have the same axes.
  Invariant: an in-bounds AbstractArray operation must not access outside its axes.
cause: |
  base/accumulate.jl:391 constructs first(ind1)+1:last(ind1) with wrapping Int
  arithmetic. When both endpoints are typemax(Int), the lower endpoint wraps to
  typemin(Int), and line 392 reads A[i_1, I] under @inbounds. The higher-dimensional
  loops at lines 412-415 and 428-431 use the same first(ind)+1:last(ind) arithmetic.
possible_fix: |
  Iterate the axis after its first element without forming first(axis) + 1, or return
  before the loop when first(ind1) == last(ind1).
