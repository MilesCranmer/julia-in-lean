id: memsafety-accumulate-offset-axis-overflow
title: "accumulate! reads out of bounds for a one-element axis ending at typemax(Int)"
priority: P1
kind: crash
area: MemSafety
files: [base/accumulate.jl]
functions: ["accumulate!", "_accumulate!"]
summary: |
  Dimensional accumulate! initializes the first element, then constructs its remaining
  loop as first(axis) + 1:last(axis). For a legal one-element AbstractVector whose sole
  index is typemax(Int), the addition wraps to typemin(Int). The loop becomes nonempty
  and reads the wrapped index under @inbounds.
likelihood: |
  The failure requires a custom array with a one-element extreme offset axis. Offset
  arrays are common, but an axis at typemax(Int) is contrived. The public accumulate!
  method accepts the array and confirms that the input and output axes match.
maybe_intended: |
  AbstractArrays may use non-one-based axes, and accumulate! explicitly checks matching
  axes. A legal singleton axis should make the remaining-element loop empty.
reproducer: |
  input = ExtremeVector([1])
  output = ExtremeVector([0])
  accumulate!(+, output, input; dims=1)
output:
