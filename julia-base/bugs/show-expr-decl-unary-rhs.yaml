id: show-expr-decl-unary-rhs
title: "Expr printing of x::(-T) produces x::-T, which is a ParseError"
priority: P3
kind: wrong-result
area: Show
files: [base/show.jl]
functions: ["show_unquoted(::IO, ::Expr, ::Int, ::Int)", "Base.show_list"]
summary: |
  string(Meta.parse("x::(-T)")) == "x::-T", which Meta.parse rejects; similarly
  "x::(<:A)" prints "x::<:A". The infix :: branch relies on show_list, whose parentheses
  rule for unary-operator calls applies only to the first item.
likelihood: |
  Rare; type annotations with prefix-operator expressions on the right.
maybe_intended: ""
reproducer: |
  ex = Meta.parse("x::(-T)")          # Expr(:(::), :x, Expr(:call, :-, :T))
  s = string(ex)
  println("string(ex) = ", repr(s))
  back = try Meta.parse(s) catch err; err end
  println("Meta.parse(string(ex)) = ", back isa Exception ? typeof(back) : repr(back))
  back != ex && println("REPRODUCED show-expr-decl-unary-rhs")
output:
  release: |
    string(ex) = "x::-T"
    Meta.parse(string(ex)) = Base.Meta.ParseError
    REPRODUCED show-expr-decl-unary-rhs
  nightly: |
    string(ex) = "x::-T"
    Meta.parse(string(ex)) = Base.Meta.ParseError
    REPRODUCED show-expr-decl-unary-rhs
reproduced: {release: true, nightly: true}
expected: |
  "x::(-T)".
promised_by: |
  base/show.jl:1636-1640: "AST printing should follow two rules: 1. Meta.parse(string(ex))
  == ex ...".
cause: |
  base/show.jl:2088-2097 prints both operands through show_list with prec_decl; show_list
  (base/show.jl:1808-1812) parenthesizes unary-operator calls only when `first`. The
  parser reads the right side of :: with parse_call, which does not accept a prefix
  operator (JuliaSyntax/src/julia/parser.jl:1430-1437).
possible_fix: |
  Parenthesize unary-operator calls in every position when prec >= prec_power.
duplicates:
  issues:
    - {number: 49494, state: open, relation: related}
  queries:
    - "issues: show type annotation unary"
    - "issues: print :: expression parse"
    - "issues: show_unquoted ::"
    - "prs: show type annotation unary"
    - "issues: show_unquoted"
    - "issues: deparse"
    - "issues: printing Expr precedence"
    - "issues: string Meta.parse roundtrip"
    - "issues: Expr printing"
lean:
  property: JuliaLean.Show.DeclReparses
  theorem: JuliaLean.Show.declReparses_refuted
