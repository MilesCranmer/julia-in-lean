id: memsafety-ryu-lookup-index
title: "Ryu pow5 lookup helpers read outside their tables for unchecked indices"
priority: P2
kind: crash
area: MemSafety
files: [base/ryu/utils.jl]
functions: ["Base.Ryu.pow5invsplit_lookup(T, i)", "Base.Ryu.pow5split_lookup(T, i)"]
summary: |
  Both documented Ryu lookup helpers index their generated tuples at i+1 under
  @inbounds without checking i. Passing i=-1 reaches tuple index 0; forced bounds
  checks report the out-of-bounds access in both functions.
likelihood: |
  Low. These are internal Ryu helpers and the float-formatting callers compute
  nonnegative indices within the generated table ranges. Direct callers can pass
  any value because the method signatures and docstrings state no index restriction.
maybe_intended: |
  The helpers are not exported and were written for internal formatting paths.
  Their docstrings describe them as lookup-table implementations of the corresponding
  arithmetic functions without documenting a caller precondition.
reproducer: |
  Base.Ryu.pow5invsplit_lookup(Float64, -1)
  Base.Ryu.pow5split_lookup(Float64, -1)
  # Each call runs in a child Julia process with --check-bounds=yes.
