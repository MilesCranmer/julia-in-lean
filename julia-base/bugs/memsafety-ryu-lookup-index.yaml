reproduced: {release: true, nightly: true}
expected: |
  Each helper should reject indices outside its generated table before the access,
  or document and enforce a caller contract that keeps i+1 within the tuple.
promised_by: |
  base/ryu/utils.jl:286-291 and 301-319 describe the helpers as lookup-table
  implementations of pow5invsplit and pow5split and state no index precondition.
  An in-bounds Julia operation must not read outside its tuple.
cause: |
  base/ryu/utils.jl:292-297 and 320-325 generate a table for 0:i_max, then define
  the lookup as @inbounds table[i+1] for an unconstrained i.
possible_fix: |
  Add an explicit range check before indexing, or make the accepted index interval
  part of a checked internal API.
