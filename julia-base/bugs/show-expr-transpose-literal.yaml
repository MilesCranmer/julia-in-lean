id: show-expr-transpose-literal
title: "Expr printing of (-1)' produces -1', which is a ParseError"
priority: P3
kind: wrong-result
area: Show
files: [base/show.jl]
functions: ["show_unquoted(::IO, ::Expr, ::Int, ::Int)"]
summary: |
  string(Meta.parse("(-1)'")) == "-1'", which Meta.parse rejects; the same holds for
  (-1.5)' and for suffixed postfix operators ((-1)'ᵀ). The transpose branch parenthesizes
  only Expr and operator-symbol operands, not negative numeric literals.
likelihood: |
  Rare: adjoint of a negative literal in an Expr.
maybe_intended: ""
reproducer: |
  ex = Meta.parse("(-1)'")            # Expr(Symbol("'"), -1)
  s = string(ex)
  println("string(ex) = ", repr(s))
  back = try Meta.parse(s) catch err; err end
  println("Meta.parse(string(ex)) = ", back isa Exception ? typeof(back) : repr(back))
  back != ex && println("REPRODUCED show-expr-transpose-literal")
output:
  release: |
    string(ex) = "-1'"
    Meta.parse(string(ex)) = Base.Meta.ParseError
    REPRODUCED show-expr-transpose-literal
  nightly: |
    string(ex) = "-1'"
    Meta.parse(string(ex)) = Base.Meta.ParseError
    REPRODUCED show-expr-transpose-literal
reproduced: {release: true, nightly: true}
expected: |
  "(-1)'".
promised_by: |
  base/show.jl:1636-1640: "AST printing should follow two rules: 1. Meta.parse(string(ex))
  == ex ...".
cause: |
  base/show.jl:2158-2163 prints a non-Expr operand directly before the postfix operator;
  the parser glues -1 into a signed literal and then cannot continue with ' (JuliaSyntax
  parse_unary, JuliaSyntax/src/julia/parser.jl:1235-1259).
possible_fix: |
  Also parenthesize operands that are negative Real literals (or that print with a leading sign).
duplicates:
  issues: []
  queries:
    - "issues: show Expr transpose negative"
    - "issues: show adjoint expression"
    - "issues: print transpose expression"
    - "issues: adjoint printing Expr"
    - "issues: -1' parse"
    - "prs: show adjoint expression"
    - "issues: show_unquoted"
    - "issues: deparse"
    - "issues: printing Expr precedence"
    - "issues: string Meta.parse roundtrip"
    - "issues: Expr printing"
lean:
  property: JuliaLean.Show.TransposeReparses
  theorem: JuliaLean.Show.transposeReparses_refuted
