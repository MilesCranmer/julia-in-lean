id: misccov-shell-empty-word-redirect
title: "An empty quoted word directly before a redirect is dropped: `echo ''>x` runs `echo` with no argument"
priority: P3
kind: wrong-result
area: MiscCov
files: [base/shell.jl]
functions: ["backtick command literal syntax"]
summary: |
  On Julia 1.15, the public backtick command literal `echo ''>x` is parsed as
  `echo` with no arguments, while `echo '' >x` keeps the empty string argument.
  Both redirect stdout to x, so spacing changes the command's arguments.
likelihood: |
  Low: needs an empty quoted argument glued to a redirect in a command literal.
maybe_intended: ""
reproducer: |
  direct = `echo ''>x`
  spaced = `echo '' >x`
  println("direct redirect: ", direct)
  println("spaced redirect: ", spaced)
  if direct != spaced
      println("REPRODUCED misccov-shell-empty-word-redirect")
  end
output:
  release: |
    Command literal parsing rejects the redirect form as unsupported:
    ErrorException: special characters "#{}()[]<>|&*?~;" must be quoted in commands
  nightly: |
    direct redirect: pipeline(`echo`, stdout>Base.FileRedirect("x", false))
    spaced redirect: pipeline(`echo ''`, stdout>Base.FileRedirect("x", false))
    REPRODUCED misccov-shell-empty-word-redirect
reproduced: {release: false, nightly: true}
expected: |
  Both command literals retain the empty string argument and redirect stdout to
  x, so each parses to the same command.
promised_by: |
  The Julia manual's Running External Programs section says backticks create a
  Cmd and parse words while "respecting shell quoting syntax" (lines 17-28).
  The quoted empty word must remain an argument before a redirect.
cause: |
  base/shell.jl's redirect branch finalizes the current word without checking
  word_has_special, unlike the whitespace path. The empty quoted word is therefore
  omitted when `>` directly follows it.
possible_fix: |
  Before handling a redirect operator, push the current word when it is nonempty or `word_has_special` is set, as the whitespace branch does.
duplicates:
  issues: []
  queries:
    - "issues: shell_parse redirect"
    - "issues: cmd redirection pipe"
    - "prs: shell redirect"
lean:
  property: JuliaLean.MiscCov.Shell.EmptyWordBeforeRedirect
  theorem: JuliaLean.MiscCov.Shell.emptyWordBeforeRedirect_refuted
