    REPRODUCED compiler-escape-sqsub-respects-eq
  nightly: |                          # 1.15.0-DEV.304 290d5bb5f52e815284ce14493f6964147d2f2dc7
    x == ⊥: true; x === ⊥: false; x ⊑ₑ ⊥: false; ⊥ ⊑ₑ x: true
    REPRODUCED compiler-escape-sqsub-respects-eq
  master: |                          # 1.15.0-DEV.627 4c0e39dde69c0922daffc45fa63fe4ffd7438124 (upstream master 2026-11-09, desktop build; 6 commits behind eb844b8ebd, none in these files)
    x == ⊥: true; x === ⊥: false; x ⊑ₑ ⊥: false; ⊥ ⊑ₑ x: true
    REPRODUCED compiler-escape-sqsub-respects-eq
reproduced: {release: true, nightly: true, master: true}
expected: |
  x ⊑ₑ ⊥ is true for every x == ⊥.
promised_by: |
  == is the lattice equality and ⊑ₑ the lattice order (Compiler/src/ssair/EscapeAnalysis.jl:186-187, 241-245).
cause: |
  Compiler/src/ssair/EscapeAnalysis.jl:254-255 `elseif y === ⊥; return false` decides by
  identity. Unchanged on current master (eb844b8ebd99, lines 252-253).
possible_fix: |
  Drop the y === ⊥ fast path, or make ignore_argescape keep BOT_LIVENESS when Liveness is
  already the constant without 0.
