id: compiler-escape-sqsub-respects-eq
title: "EscapeAnalysis ⊑ₑ returns false for x ⊑ₑ ⊥ when x == ⊥ but x !== ⊥"
priority: P3
kind: wrong-result
area: Compiler
files: [Compiler/src/ssair/EscapeAnalysis.jl]
functions: ["x::EscapeInfo ⊑ₑ y::EscapeInfo", "ignore_argescape(x::EscapeInfo)"]
summary: |
  x ⊑ₑ y returns false as soon as y === ⊥, before comparing fields. ignore_argescape(⊥) copies
  the Liveness set, so it is == ⊥ but not === ⊥, and ⊑ₑ says it is not below ⊥, although ⊥ ⊑ₑ
  it holds. So ⊑ₑ does not respect the lattice equality ==.
likelihood: |
  None at this commit: ⊑ₑ is reached only through has_all_escape, and ignore_argescape results
  are only queried (Compiler/src/optimize.jl:827-828), never compared with ⊑ₑ.
  Triage 2026-11-10. Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  Master line 252 keeps the `y === ⊥` fast path. The only value that is == ⊥ but not === ⊥
  comes from ignore_argescape(⊥), whose results are only queried, never compared. No effect in
  the compiler. P3, and best fixed in the same change as compiler-escape-sqsub-transitive.
maybe_intended: |
  The comment "return x === ⊥" shows the fast path assumes the only EscapeInfo equal to ⊥ is ⊥
  itself; that holds for values the analysis stores, but not for ignore_argescape(⊥).
reproducer: |
  const EA = Base.Compiler.EscapeAnalysis
  x = EA.ignore_argescape(EA.NotAnalyzed())
  x == EA.NotAnalyzed(), EA.:⊑ₑ(x, EA.NotAnalyzed())   # (true, false)
