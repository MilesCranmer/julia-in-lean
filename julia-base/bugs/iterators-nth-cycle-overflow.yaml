id: iterators-nth-cycle-overflow
title: Iterators.nth rejects valid indices when a repeated cycle length overflows
priority: P2
kind: wrong-exception
area: Iterators
files:
  - base/iterators.jl
functions:
  - nth(::Flatten{Take{Repeated}}, n)
  - cycle(xs, n)
summary: |
  nth(cycle([1, 2, 3], 2^62), 1) throws BoundsError even though first of the
  same iterator returns 1. Its bounds check multiplies the factor length by
  the repetition count in Int arithmetic. The product wraps to a negative
  number, making a valid positive index appear out of bounds.
likelihood: |
  Requires a repetition count whose total element count exceeds typemax(Int).
  Using a huge cycle count as a practically unlimited iterator can trigger it
  without allocating the repeated collection.
maybe_intended: |
  length cannot represent this iterator's mathematical size in Int, but nth
  does not need that total size to retrieve element 1. Its documented bounds
  check concerns whether the requested element exists.
reproducer: |
  c = Iterators.cycle([1, 2, 3], 2^62)
  first(c)             # 1
  Iterators.nth(c, 1)   # throws BoundsError
output:
  release: |
    nth(cycle([1,2,3], 2^62), 1) = BoundsError: attempt to access Base.Iterators.Flatten{Base.Iterators.Take{Base.Iterators.Repeated{Vector{Int64}}}} at index [1]
    first(cycle([1,2,3], 2^62)) = 1
    REPRODUCED iterators-nth-cycle-overflow
  nightly: |
    nth(cycle([1,2,3], 2^62), 1) = BoundsError: attempt to access Base.Iterators.Flatten{Base.Iterators.Take{Base.Iterators.Repeated{Vector{Int64}}}} at index [1]
    first(cycle([1,2,3], 2^62)) = 1
    REPRODUCED iterators-nth-cycle-overflow
reproduced:
  release: true
  nightly: true
expected: |
  nth(c, 1) should return 1. Other valid indices should return the corresponding
  element of [1, 2, 3] modulo its length, without requiring a representable total.
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  base/iterators.jl:1730: "Get the `n`th element of an iterable collection. Throw a [`BoundsError`](@ref) if not existing."
  base/iterators.jl:1031: "If `n` is specified, then it cycles through `iter` that many times."
cause: |
  base/iterators.jl:1771 checks n > k*cycles before selecting an element by
  mod1. Both factors are Int, so k*cycles wraps before the comparison.
possible_fix: |
  Check k == 0 first, then compare cld(n, k) against cycles for positive n,
  or use widened multiplication. Preserve bounds errors for nonpositive n.
duplicates:
  issues: []
  prs:
    - number: 64311
      state: open
      relation: duplicate
      note: "proposed fix for this exact overflow counterexample"
    - number: 56580
