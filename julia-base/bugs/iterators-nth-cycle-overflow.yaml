  search_notes: |
    PR #64311 contains the same [1, 2, 3], 2^62, index-1 example and replaces
    the overflowing multiplication with a quotient comparison. No matching
    issue is known.
  queries:
    - nth cycle overflow
    - Iterators.nth BoundsError
    - nth cycle
