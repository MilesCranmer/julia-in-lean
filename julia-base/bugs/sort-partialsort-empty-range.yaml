id: sort-partialsort-empty-range
title: "partialsort! rejects an empty index range on a 260-element input"
priority: P2
kind: wrong-exception
area: Sort
files:
  - base/sort.jl
functions:
  - "partialsort!(v, k::OrdinalRange)"
  - "partialsort(v, k::OrdinalRange)"
summary: |
  partialsort!(fill(1, 260), 1:1:0) throws ArgumentError for an empty
  selection. BracketedSort computes extrema of the empty range. Its
  short-input branch bypasses those extrema, so the behavior depends on
  an internal input-length threshold.
likelihood: |
  Generic code that computes an empty selection can fail only after the
  input reaches the internal threshold, despite smaller examples succeeding.
maybe_intended: |
  An explicit rejection of empty selections could be a contract choice,
  but the docstring gives no such restriction and the length dependence
  is inconsistent.
reproducer: |
  # A 260-element input reaches BracketedSort's minimum/maximum of the empty target.
  let
      id = "sort-partialsort-empty-range"
      reproduced = try
          partialsort!(fill(1, 260), 1:1:0)
          false
      catch error
          error isa ArgumentError
      end
      println((reproduced ? "REPRODUCED " : "NOT_REPRODUCED ") * id)
  end
output:
  release: |
    REPRODUCED sort-partialsort-empty-range
  nightly: |
    Julia 1.15.0-DEV.unknown, commit f755f49a9e41380d7da126b3c1db9fe7f83dd027:
    REPRODUCED sort-partialsort-empty-range
reproduced:
  release: true
  nightly: true
expected: |
  Return an empty array for the empty requested range, consistently across
  input lengths.
promised_by: |
  Pinned Julia commit f755f49a9e41380d7da126b3c1db9fe7f83dd027.
  base/sort.jl:116-120: "Mutate the vector `v` so that the value at index `k` (or
  range of adjacent values if `k` is a range) occurs
  at the position where it would appear if the array were fully sorted. If `k` is a single
  index, that value is returned; if `k` is a range, an array of values at those indices is
  returned. Note that `partialsort!` may not fully sort the input array."
cause: |
  base/sort.jl:1277 forwards lengths below 260 without evaluating the extrema of
  the requested range. At length 260 the path reaches the minimum and maximum of
  that range at base/sort.jl:1284-1286, where the empty range throws.
possible_fix: |
  Handle the empty range before BracketedSort evaluates its extrema.
