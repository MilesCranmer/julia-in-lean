id: memsafety-sort-send-to-end-window
title: "send_to_end! reads out of bounds when lo or hi is outside the vector"
priority: P2
kind: crash
area: MemSafety
files: [base/sort.jl]
functions: ["Base.Sort.send_to_end!(f, v; lo, hi)"]
summary: |
  Base.Sort.send_to_end! accepts caller-supplied lo and hi keywords and reads v[lo]
  under @inbounds without checking the window. With lo=0 and a two-element vector,
  forced bounds checks report an access at index 0 from the first loop.
likelihood: |
  Low. send_to_end! is an internal Base.Sort helper, and its normal sorting callers
  pass checked windows. Direct callers can compute an empty or shifted window, however,
  and the function has a docstring that exposes the lo and hi keywords.
maybe_intended: |
  The helper is not exported and its sorting callers establish valid bounds. Its
  docstring does not assign bounds checking to the caller, and instead says that the
  keyword form is equivalent to applying send_to_end! to view(v, lo:hi), which checks.
reproducer: |
  code = "Base.Sort.send_to_end!(iszero, [1, 2]; lo=0, hi=2)"
  cmd = `$(Base.julia_cmd()) --startup-file=no --check-bounds=yes -e $code`
  run(cmd)
