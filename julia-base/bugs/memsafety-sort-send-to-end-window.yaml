    REPRODUCED memsafety-sort-send-to-end-window
reproduced: {release: true, nightly: true}
expected: |
  The function should reject a window outside axes(v), as view(v, lo:hi) does,
  before disabling bounds checks.
promised_by: |
  base/sort.jl:610-618 documents the lo and hi keywords and says
  send_to_end!(f, v, lo, hi) is equivalent to send_to_end!(f, view(v, lo:hi))+lo-1.
  An in-bounds Julia array operation must not access storage outside the array.
cause: |
  base/sort.jl:620-626 assigns i=lo and reads v[i] in an @inbounds loop, then
  assigns j=i+1 and reads v[j] in another @inbounds loop. No checkbounds call
  precedes either loop.
possible_fix: |
  Check view bounds for lo:hi before entering the two @inbounds loops.
