id: iterators-rest-isdone-state
title: isempty on Iterators.rest ignores its stored iteration state
priority: P2
kind: wrong-result
area: Iterators
files:
  - base/iterators.jl
functions:
  - isdone(::Rest)
  - isempty(::Rest)
  - Iterators.peel
summary: |
  After peel(take(Stateful([1, 2, 3]), 1)), the remainder yields nothing,
  yet isempty returns false. Rest forwards isdone without the stored state,
  while iterate uses that state. The same mismatch occurs with eachline.
likelihood: |
  Parsing code can peel a bounded stateful iterator and then check whether
  the remainder is empty. The incorrect answer is silent.
maybe_intended: |
  The stored state defines where Rest starts, so ignoring it has no documented
  justification. Issue #64152 reports this exact failure; merged PR #64314
  fixes it. The pinned source still contains the faulty method.
reproducer: |
  itr = Iterators.take(Iterators.Stateful([1, 2, 3]), 1)
  x, r = Iterators.peel(itr)
  isempty(r)  # false
  collect(r)  # Int64[]
output:
  release: |
    peel(take(Stateful([1,2,3]), 1)) = (1, r); isempty(r) = false, collect(r) = Int64[]
    peel(take(eachline(io), 1)): isempty(rest) = false, collect(rest) = String[]
    REPRODUCED iterators-rest-isdone-state
  nightly: |
    peel(take(Stateful([1,2,3]), 1)) = (1, r); isempty(r) = false, collect(r) = Int64[]
    peel(take(eachline(io), 1)): isempty(rest) = false, collect(rest) = String[]
    REPRODUCED iterators-rest-isdone-state
reproduced:
  release: true
  nightly: true
expected: |
  isempty(r) should return true because r yields no elements.
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  base/iterators.jl:703: "Returns the first element and an iterator over the remaining elements."
  base/essentials.jl:1216: "Determine whether a collection is empty (has no elements)."
cause: |
  base/iterators.jl:733 defines isdone(i::Rest, st...) = isdone(i.itr, st...).
  With no explicit state, this discards i.st. The iterate method at line 732
  defaults to i.st, so isempty and iteration disagree.
possible_fix: |
  Give isdone the same st=i.st default as iterate, while continuing to forward
  explicitly supplied states.
duplicates:
  issues:
    - number: 64152
      state: closed
      relation: duplicate
  prs:
    - number: 64314
      state: merged
      relation: duplicate
      note: "fixes duplicate issue 64152"
  queries:
    - isdone Rest
    - peel isempty
    - Iterators.rest state
lean:
  property: JuliaLean.Proofs.base.iterators.PeelRestIsempty
  theorem: JuliaLean.ChatGPT.Batch4.Group5.IteratorsRestIsdoneState_refuted
