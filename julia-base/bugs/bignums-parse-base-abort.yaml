id: bignums-parse-base-abort
title: "tryparse(BigFloat, s; base=1) aborts the Julia process with an MPFR assertion failure"
priority: P1
kind: crash
area: BigNums
files: [base/mpfr.jl]
functions: ["tryparse(::Type{BigFloat}, ::AbstractString; base)", "parse(::Type{BigFloat}, ::AbstractString; base)", "BigFloat(::AbstractString)"]
summary: |
  tryparse(BigFloat, s; base) passes `base` unchecked to mpfr_set_str. MPFR accepts
  only base 0 or 2..62 and otherwise fails an assertion (strtofr.c:950), which calls
  abort(): the whole Julia process dies with SIGABRT. Any base outside that range
  (1, 63, 100, -2, ...) triggers it, for tryparse as well as parse.
likelihood: |
  Needs a caller-supplied base outside 2..62, e.g. from user input or a typo; the
  integer parsers reject such bases with ArgumentError, so code that validates nothing
  itself and relies on parse/tryparse to report bad input will crash the process.
maybe_intended: ""
reproducer: |
  code = "println(repr(tryparse(BigFloat, \"1\"; base=1)))"
  cmd = `$(Base.julia_cmd()) --startup-file=no -e $code`
  err = IOBuffer()
  p = run(pipeline(ignorestatus(cmd); stdout=devnull, stderr=err))
  msg = String(take!(err))
  line = something(findfirst(l -> occursin("assertion", l), split(msg, '\n')), 0)
  println("child exit code ", p.exitcode, ", signal ", p.termsignal)
  line > 0 && println(split(msg, '\n')[line])
  println("tryparse(Float64, \"1\") with no base: ", tryparse(Float64, "1"))
  println("tryparse(Int, \"1\"; base=1) throws ", try tryparse(Int, "1"; base=1); "nothing" catch e; typeof(e) end)
  if p.termsignal == 6 && occursin("MPFR assertion failed", msg)
      println("REPRODUCED bignums-parse-base-abort")
  end
output:
  release: |
    child exit code 0, signal 6
    strtofr.c:950: MPFR assertion failed: base == 0 || (base >= 2 && base <= 62)
    tryparse(Float64, "1") with no base: 1.0
    tryparse(Int, "1"; base=1) throws ArgumentError
    REPRODUCED bignums-parse-base-abort
  nightly: |
    child exit code 0, signal 6
    strtofr.c:950: MPFR assertion failed: base == 0 || (base >= 2 && base <= 62)
    tryparse(Float64, "1") with no base: 1.0
    tryparse(Int, "1"; base=1) throws ArgumentError
    REPRODUCED bignums-parse-base-abort
reproduced: {release: true, nightly: true}
expected: |
  An ArgumentError for the invalid base (as tryparse(Int, "1"; base=1) and
  parse(BigInt, "1"; base=1) throw), or nothing from tryparse; never a process abort.
promised_by: |
  base/parse.jl:241-246 (tryparse docstring): "returns either a value of the requested
  type, or nothing if the string does not contain a valid number." A library call must
  not abort the process on a bad argument.
cause: |
  base/mpfr.jl:407-412: tryparse(::Type{BigFloat}, s; base) calls
  ccall(:mpfr_set_str, ..., z, s, base, rounding) with no range check on `base`.
  MPFR's mpfr_strtofr asserts base == 0 || 2 <= base <= 62 (MPFR_ASSERTN, active in
  release builds). Same code at base/mpfr.jl:408-413 on 1.13.2.
possible_fix: |
  Check `base == 0 || 2 <= base <= 62` before the ccall and throw ArgumentError
  (as tryparse_internal(::Type{BigInt}, ...) does at base/gmp.jl:312-315).
duplicates:
  issues: []
  queries: ["BigFloat base abort", "MPFR assertion failed", "parse BigFloat base", "tryparse BigFloat", "BigFloat parse", "parse BigFloat"]
lean:
  property: JuliaLean.BigNums.TryparseBigFloatTotal
  theorem: JuliaLean.BigNums.tryparseBigFloatTotal_refuted
