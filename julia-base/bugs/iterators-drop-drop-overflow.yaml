id: iterators-drop-drop-overflow
title: "drop(drop(itr, a), b) throws ArgumentError when the combined count overflows"
priority: P3
kind: wrong-exception
area: Iterators
files: [base/iterators.jl]
functions: ["drop(::Drop, n)", "drop(::Take, n)"]
summary: |
  drop(::Drop, n) adds the two valid counts using Int arithmetic. If the sum
  exceeds typemax(Int), it wraps negative and the Drop constructor throws
  ArgumentError instead of returning an iterator that has dropped those values.
  On a finite vector, dropping past its length should produce an empty iterator.
likelihood: |
  Requires a drop count near typemax(Int), followed by another positive drop.
  The reproduced call uses ordinary vector data and two nonnegative Int counts.
maybe_intended: |
  Nested drop should retain its documented suffix behavior without throwing
  when the combined nonnegative count exceeds typemax(Int).
reproducer: |
  Stored at repro/iterators-drop-drop-overflow.jl. It evaluates
  collect(Iterators.drop(Iterators.drop([1, 2, 3], typemax(Int)), 1)) and prints
  REPRODUCED iterators-drop-drop-overflow when the nested call throws ArgumentError.
output:
  release: |
    REPRODUCED iterators-drop-drop-overflow
  nightly: |
    REPRODUCED iterators-drop-drop-overflow
reproduced: {release: true, nightly: true}
expected: |
  Int[]. The first drop already removes all three vector elements, so another
  drop leaves the empty iterator unchanged.
promised_by: |
  base/iterators.jl:847-850 documents `drop(iter, n)` as "An iterator that
  generates all but the first `n` elements of `iter`." Both calls use
  nonnegative Int counts accepted by drop.
cause: |
  base/iterators.jl:872-873 computes `Int(n) + xs.n` for drop(::Drop, n).
  The sum wraps to typemin(Int), then the Drop constructor at base/iterators.jl:839-842
  rejects the negative count with ArgumentError.
possible_fix: |
  Avoid combining the counts with unchecked Int arithmetic. Preserve nested Drop
  wrappers or use a representation that can hold the combined count.
duplicates:
  issues:
    - {number: 39079, state: open, relation: related}
    - {number: 50486, state: open, relation: related}
  prs: []
  queries:
    - "issues: Iterators.drop nested overflow typemax"
    - "PRs: Iterators.drop nested overflow typemax"
lean:
  property: JuliaLean.Proofs.base.iterators.Round4.DropDropCorrect
  theorem: JuliaLean.Proofs.base.iterators.dropDropCorrect_refuted
