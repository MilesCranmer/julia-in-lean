id: compiler-inlining-llvmcall-cost
title: "statement_cost charges every llvmcall UNKNOWN_CALL_COST because maxarg + 1 wraps"
priority: P3
kind: wrong-result
area: Compiler
files: [Compiler/src/optimize.jl, Compiler/src/tfuncs.jl]
functions: ["statement_cost(ex::Expr, line::Int, src::Union{CodeInfo, IRCode}, sptypes::Vector{VarState}, params::OptimizationParams)"]
summary: |
  statement_cost checks an intrinsic call's argument count with
  `minarg + 1 <= nargs <= maxarg + 1`. llvmcall's arity is 3:INT_INF with INT_INF = typemax(Int),
  so maxarg + 1 wraps to typemin(Int), the check always fails, and every llvmcall is charged
  UNKNOWN_CALL_COST (20) instead of its table cost 10. The `f === Intrinsics.llvmcall` branch written
  for it is dead.
likelihood: |
  Every llvmcall. The effect is a cost of 20 instead of 10 per llvmcall in the inlining
  heuristic, which changes decisions only near the threshold.
  Triage 2026-11-10. Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  Master optimize.jl:1836 still has `nargs <= maxarg + 1`. Each llvmcall is charged 20 instead of
  10; that changes an inlining decision only within 10 of the threshold. P3.
maybe_intended: ""
reproducer: |
  fl(x::Int32) = Base.llvmcall("%r = add i32 %0, 1\nret i32 %r", Int32, Tuple{Int32}, x)
  ir, = only(Base.code_ircode(fl, (Int32,)))
  CC.statement_cost(ir.stmts.stmt[1], 1, ir, ir.sptypes, CC.OptimizationParams())   # 20
