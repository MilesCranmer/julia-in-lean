    1.15.0-DEV.627 4c0e39dde69c0922daffc45fa63fe4ffd7438124
    T_IFUNC arity: 3:9223372036854775807, maxarg + 1 = -9223372036854775808, T_IFUNC_COST = 10
    statement 1 (5 args): statement_cost = 20
    REPRODUCED compiler-inlining-llvmcall-cost
reproduced: {release: true, nightly: true, master: true}
expected: |
  10, the T_IFUNC_COST entry that add_tfunc(Core.Intrinsics.llvmcall, 3, INT_INF,
  llvmcall_tfunc, 10) gives it.
promised_by: |
  The llvmcall branch and its comment at Compiler/src/optimize.jl:1821-1823 ("llvmcall holds
  malformed IR, so argextype will crash on it", return cost) and the cost 10 at tfuncs.jl:329.
cause: |
  Compiler/src/optimize.jl:1816 `if minarg + 1 <= nargs <= maxarg + 1` with maxarg = INT_INF
  (tfuncs.jl:52, 329). No other intrinsic has INT_INF arity. Unchanged on master eb844b8ebd
  (2026-11-10).
possible_fix: |
  Compare `nargs - 1 <= maxarg` (or test minarg/maxarg without adding 1).
