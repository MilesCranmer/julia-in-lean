id: compiler-cacheresult-va-tail-miss
title: "Const-prop results whose argument types end in Vararg are never found in the local inference cache"
priority: P3
kind: wrong-result
area: Compiler
files: [Compiler/src/abstractinterpretation.jl, Compiler/src/inferenceresult.jl]
functions: ["const_prop_call(interp, mi, result, arginfo, sv, concrete_eval_result)", "constprop_cache_lookup(𝕃, mi, given_argtypes, cache, world)", "is_argtype_match(𝕃, given_argtype, cache_argtype, overridden_by_const)"]
summary: |
  When a call's argument types end in a Vararg (a splat of unknown length), the const-prop key
  ends in Vararg{T}. const_prop_call compares that last element with
  argtype_by_index(cache_argtypes, n), which unwraps the cache's Vararg to T, so the tail is
  always flagged in overridden_by_const. constprop_cache_lookup then checks the query's tail with
  is_argtype_match(..., overridden_by_const = true); a Vararg is not forwardable, so the match is
  false and the cached result is never returned. Each call site with the same constant arguments
  runs constant propagation again, and the local cache fills with identical entries.
likelihood: |
  Any method that splats a collection of unknown length into a varargs callee with constant
  leading arguments (g(1, v...), string or tuple helpers) hits it at every such call site. The
  cost is one extra const-prop inference per call site within one inference session; inferred
  types are not affected.
  Triage 2026-11-10 (was P2). Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  Master abstractinterpretation.jl:1521-1522 and inferenceresult.jl are unchanged. Measured how
  often it happens: typeinf_frame with a fresh NativeInterpreter on 40000 Base method instances
  (dispatch-tuple specializations of Base functions, pinned Julia) made 39775 const-prop entries.
  66 of them had a Vararg tail, and 16 were copies of an earlier Vararg-tail key: 0.04% extra
  const-prop work. The mechanism is real and the fix is small, but on Base it costs almost
  nothing, and inferred types are unchanged. P3 until a package workload shows more.
maybe_intended: |
  A miss is never unsound, so the code is correct. But the lookup's own loop is meant to reuse
  a result whose key matches the query, and the flag at the tail does not say that a constant
  overrode anything.
reproducer: |
  const CC = Base.Compiler
  g(a, b...) = (a == 1 ? length(b) : "s")
  callg(v::Vector{Int}) = (g(1, v...), g(1, v...), g(1, v...))
  interp = CC.NativeInterpreter()
  CC.typeinf_frame(interp, Base.method_instance(callg, (Vector{Int},)), false)
  # interp.inf_cache now holds three const-prop results for g, all keyed
  # [Const(g), Const(1), Vararg{Int64}] with overridden_by_const = [0, 1, 1].
  # A fixed-arity h(a, b, c) called three times as h(1, v, v) leaves one.
