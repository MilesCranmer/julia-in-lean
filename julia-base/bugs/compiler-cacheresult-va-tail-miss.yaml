reproduced: {release: true, nightly: true, master: true}
expected: |
  The second and third calls find the first result in the local cache, leaving one entry, as
  for the fixed-arity callee.
promised_by: |
  Invariant: constprop_cache_lookup (Compiler/src/inferenceresult.jl:217-261) exists to return a
  cached const-prop result for a query whose argument types match its key, and const_prop_call
  (Compiler/src/abstractinterpretation.jl:1499-1511) consults it before inferring again.
cause: |
  Compiler/src/abstractinterpretation.jl:1517-1522 sets overridden_by_const[i] when
  argtypes[i] !== argtype_by_index(cache_argtypes, i). For the last position of a key ending in
  Vararg{T}, argtype_by_index (abstractinterpretation.jl:2166-2174) returns unwrapva of the
  cache's Vararg, which is never === the Vararg itself. The lookup's loop
  (Compiler/src/inferenceresult.jl:245-248) then calls is_argtype_match with
  overridden_by_const = true on a non-forwardable Vararg, which returns false
  (inferenceresult.jl:100-109). Upstream master eb844b8ebd99 (2026-11-10) has the same lines
  (abstractinterpretation.jl:1519-1522; inferenceresult.jl is unchanged since f755f49a9e).
possible_fix: |
  Compute the flag for a Vararg tail against the cache's own last element (cache_argtypes[end])
  instead of argtype_by_index, so an unchanged tail is not flagged; the lookup then compares the
  tail as a non-forwardable, non-overridden position.
