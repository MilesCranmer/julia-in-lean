id: dicts-persistentdict-eq-asymmetric
title: "PersistentDict and Dict equality depends on argument order"
priority: "P3"
kind: "wrong-result"
area: "Dicts"
files:
  - "base/abstractdict.jl"
  - "base/dict.jl"
functions:
  - "==(::AbstractDict, ::AbstractDict)"
summary: |
  Two separately allocated [1] vectors compare equal by value and differ by identity. A PersistentDict keyed by the first vector compares equal to a Dict keyed by the second; reversing the arguments returns false. The reproducer checks == symmetry only.
likelihood: |
  Comparison of the internal PersistentDict type against a normal Dict with equal but separately allocated mutable keys.
maybe_intended: |
  PersistentDict deliberately behaves like IdDict. Generic dictionary equality already rejects IdDict/non-IdDict comparisons, but does not classify PersistentDict with IdDict.
reproducer: |
  a = [1]
  b = [1]
  p = Base.PersistentDict(a => 1)
  d = Dict(b => 1)
  @show a === b isequal(a, b)
  @show p == d d == p
output:
  release: |
    REPRODUCED dicts-persistentdict-eq-asymmetric
  nightly: |
    REPRODUCED dicts-persistentdict-eq-asymmetric
reproduced:
  release: true
  nightly: true
expected: |
  Equality should return the same result in both argument orders. A symmetric false result, as for IdDict versus Dict, would respect the different key relations.
promised_by: |
  base/operators.jl:118-124 @ f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  "Generic equality operator. Falls back to [`===`](@ref)."
  "Should be implemented for all types with a notion of equality, based on the abstract value"
  "that an instance represents."
  base/dict.jl:945-946 states "It behaves like an IdDict."
  The == docstring does not separately spell out symmetry; symmetry is the property under review. The explicit isequal symmetry contract at base/operators.jl:152-154 concerns a different property.
cause: |
  base/abstractdict.jl:518-533 only guards mismatched IdDict instances and then looks up every left-hand pair in the right-hand dictionary. PersistentDict identity lookup and Dict value lookup give different answers.
possible_fix: |
  Treat identity-keyed PersistentDict comparisons consistently in both argument orders, as is already done for IdDict.
duplicates:
  issues:
    - number: 54740
      state: open
      relation: related
    - number: 53982
      state: open
      relation: related
  prs:
    - number: 52193
      state: merged
      relation: related
  queries:
    - "PersistentDict equality"
    - "PersistentDict asymmetric"
    - "PersistentDict Dict =="
  search_evidence: |
    Merged PR 52193 deliberately changes PersistentDict to identity key semantics but does not report this comparison asymmetry. No exact duplicate is known.
lean:
