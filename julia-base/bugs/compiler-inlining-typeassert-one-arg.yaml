    statement 2: (typeassert)(_2)
    statement_or_branch_cost: BoundsError: attempt to access 2-element Vector{Any} at index [3]
    code_typed(g, (Int, Bool)): BoundsError: attempt to access 2-element Vector{Any} at index [3]
    REPRODUCED compiler-inlining-typeassert-one-arg
  nightly: |                          # 1.15.0-DEV.304 290d5bb5f52e815284ce14493f6964147d2f2dc7
    1.15.0-DEV.304 290d5bb5f52e815284ce14493f6964147d2f2dc7
    statement 2: (typeassert)(_2)
    statement_or_branch_cost: BoundsError: attempt to access 2-element Vector{Any} at index [3]
    code_typed(g, (Int, Bool)): BoundsError: attempt to access 2-element Vector{Any} at index [3]
    REPRODUCED compiler-inlining-typeassert-one-arg
  master: |                          # 1.15.0-DEV.627 4c0e39dde69c0922daffc45fa63fe4ffd7438124 (upstream master 2026-11-09, desktop build; 6 commits behind eb844b8ebd, none in these files)
    1.15.0-DEV.627 4c0e39dde69c0922daffc45fa63fe4ffd7438124
    statement 2: (typeassert)(_2)
    statement_or_branch_cost: BoundsError: attempt to access 2-element Vector{Any} at index [3]
    code_typed(g, (Int, Bool)): BoundsError: attempt to access 2-element Vector{Any} at index [3]
    REPRODUCED compiler-inlining-typeassert-one-arg
reproduced: {release: true, nightly: true, master: true}
expected: |
  code_typed returns the optimized code. The call gets some cost (for example the
  find_tfunc cost of typeassert) and inference finishes.
promised_by: |
  Invariant: the cost model runs on every IR inference produces, and an inference-time
  exception is an internal error.
cause: |
  Compiler/src/optimize.jl:1861, `elseif f === typeassert && isconstType(argextype_widened(ex.args[3], src, sptypes))`,
  reads ex.args[3] without checking the argument count.
possible_fix: |
  Add `length(ex.args) == 3 &&` to the condition, as the memoryref branches do.
