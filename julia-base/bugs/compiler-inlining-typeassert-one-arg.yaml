id: compiler-inlining-typeassert-one-arg
title: "statement_cost throws a BoundsError on a one-argument Core.typeassert call"
priority: P3
kind: crash
area: Compiler
files: [Compiler/src/optimize.jl]
functions: ["statement_cost(ex::Expr, line::Int, src::Union{CodeInfo, IRCode}, sptypes::Vector{VarState}, params::OptimizationParams)"]
summary: |
  statement_cost reads ex.args[3] of every call to typeassert to test isconstType, without the
  length(ex.args) >= 3 check the memoryref cases above it have. A call Core.typeassert(x) with
  one argument is kept in the IR (inferred Union{}), so the inlining cost of any function that
  contains it throws a BoundsError: code_typed fails, and calling the function prints
  "Internal error: during type inference" and runs it without inferred code.
likelihood: |
  Low. One-argument typeassert is a user error that always throws at run time, so it only
  appears in dead or error paths. `x::T` lowers to the two-argument form.
  Triage 2026-11-10 (was P2). Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  Master optimize.jl:1881 has the same unguarded ex.args[3]. The #64765 change (c95c86857c) added
  an `_apply_iterate` branch right after it with a length check, but left this line alone. Only
  erroneous code has a one-argument Core.typeassert (it always throws), and the function still
  runs; the visible effect is the "Internal error" message, a code_typed failure and code
  without inference. P3.
maybe_intended: ""
reproducer: |
  g(x, c) = c ? Core.typeassert(x) : 1
  code_typed(g, (Int, Bool))   # BoundsError from statement_cost
output:
