id: iterators-nth-zip-empty
title: Iterators.nth(zip(), n) returns () for n <= 0 instead of throwing BoundsError
priority: P3
kind: missing-error
area: Iterators
files:
- base/iterators.jl
functions:
- nth(::Zip, n)
summary: |
  nth on a Zip maps nth(n) over the zipped iterators and never checks n itself.
  With no iterators, nth(zip(), 0) and nth(zip(), -3) return () instead of
  throwing BoundsError. With at least one iterator the component throws.
likelihood: |
  Needs zip() with no arguments (e.g. zip(xs...) of an empty splat) and a
  nonpositive index. Very rare.
maybe_intended: |
  zip() is documented as an infinite iterator of empty tuples, so any positive
  n is valid; only n <= 0 is wrong.
reproducer: |
  # nth(zip(), n) returns () for n <= 0 instead of throwing BoundsError
  r0 = try Iterators.nth(zip(), 0) catch e; e end
  rm = try Iterators.nth(zip(), -3) catch e; e end
  println("nth(zip(), 0) = ", repr(r0), ", nth(zip(), -3) = ", repr(rm))
  println("nth(zip([1]), 0) throws: ", try Iterators.nth(zip([1]), 0); false catch e; e isa BoundsError end)
  r0 === () && rm === () && println("REPRODUCED iterators-nth-zip-empty")
output:
  release: |
    nth(zip(), 0) = (), nth(zip(), -3) = ()
    nth(zip([1]), 0) throws: true
    REPRODUCED iterators-nth-zip-empty
  nightly: |
    nth(zip(), 0) = (), nth(zip(), -3) = ()
    nth(zip([1]), 0) throws: true
    REPRODUCED iterators-nth-zip-empty
reproduced:
  release: true
  nightly: true
expected: |
  BoundsError for n <= 0, as for every other iterator.
promised_by: |
  nth docstring, base/iterators.jl:1728-1731: "Throw a BoundsError if not
  existing."
cause: |
  base/iterators.jl:1789, _nth(::IteratorSize, z::Zip, n) = map(nth(n), z.is).
possible_fix: |
  Check n > 0 (throw BoundsError(z, n)) before mapping.
duplicates:
  issues: []
  queries:
  - nth zip
  - Iterators.nth
  - nth BoundsError
lean:
  property: JuliaLean.Iterators.NthZipNonpositive
  theorem: JuliaLean.Iterators.nthZipNonpositive_refuted
