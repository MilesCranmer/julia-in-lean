id: iterators-nth-zip-empty
title: "Iterators.nth(zip(), 0) returns () instead of throwing BoundsError"
priority: P2
kind: missing-error
area: Iterators
files: [base/iterators.jl]
functions: ["nth(::Zip, n)"]
summary: |
  With zero-argument zip(), Iterators.nth(zip(), 0) returns () instead of
  throwing BoundsError. The specialized Zip method maps nth over its component
  iterators; with no components, nothing rejects the invalid index.
likelihood: |
  Requires zero-argument zip() and a nonpositive index. Positive positions on
  zip() remain valid because zip() yields empty tuples indefinitely.
maybe_intended: |
  Iterators.nth should throw BoundsError when n <= 0, including for zip() with no
  components.
reproducer: |
  Stored at repro/iterators-nth-zip-empty.jl. It calls
  Iterators.nth(zip(), 0) and prints REPRODUCED iterators-nth-zip-empty when the
  call returns () instead of BoundsError.
output:
  release: |
    REPRODUCED iterators-nth-zip-empty
  nightly: |
    REPRODUCED iterators-nth-zip-empty
reproduced: {release: true, nightly: true}
expected: |
  Throw BoundsError because n = 0 does not identify an element. The documented
  method throws BoundsError when the requested element does not exist.
promised_by: |
  base/iterators.jl:1728-1730 documents `nth(itr, n::Integer)` and says: "Get the
  `n`th element of an iterable collection. Throw a [`BoundsError`](@ref) if not
  existing."
cause: |
  base/iterators.jl:1789 defines `_nth(::IteratorSize, z::Zip, n) =
  Base.map(nth(n), z.is)`. Mapping over the empty component tuple returns ()
  without validating n.
possible_fix: |
  Reject nonpositive n with BoundsError before mapping nth over Zip components.
