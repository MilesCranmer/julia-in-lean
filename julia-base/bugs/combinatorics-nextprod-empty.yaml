id: combinatorics-nextprod-empty
title: "nextprod((), 1) throws BoundsError instead of returning the empty product"
priority: P2
kind: wrong-exception
area: Combinatorics
files: [base/combinatorics.jl]
functions: ["nextprod(::Tuple, ::Real)"]
summary: |
  The documented tuple method accepts an empty tuple of factors, but nextprod((), 1)
  throws BoundsError. The only product generated by an empty factor set is the empty
  product 1, so 1 is the least such product greater than or equal to 1.
likelihood: |
  Empty factor collections arise naturally in generic code, but nextprod is usually
  called with a short explicit nonempty factor list.
maybe_intended: |
  The implementation assumes at least one factor, and nextpow requires each factor to be
  greater than one. The nextprod docstring states neither a nonempty requirement nor a
  factor-domain restriction.
reproducer: |
  nextprod((), 1)
output:
  release: |
    nextprod((), 1): BoundsError
    empty product:    1
    REPRODUCED combinatorics-nextprod-empty
  nightly: |
    nextprod((), 1): BoundsError
    empty product:    1
    REPRODUCED combinatorics-nextprod-empty
reproduced: {release: true, nightly: true}
expected: |
  Return 1, the empty product and the least available product greater than or equal to 1.
promised_by: |
  base/combinatorics.jl:320-323 documents a Tuple method returning the least product of
  powers of the supplied factors that is at least n. Tuple{Vararg{Integer}} includes ().
cause: |
  base/combinatorics.jl:344 and 345 unconditionally index mx[1] after constructing an
  empty mx vector.
possible_fix: |
  Handle an empty factor collection before indexing mx, returning 1 when x <= 1 and an
  ArgumentError when no empty product can meet x > 1.
duplicates:
  issues: []
  queries: ["nextprod BoundsError", "nextprod empty tuple", "nextprod factors empty"]
lean:
  property: JuliaLean.Combinatorics.NextprodLeast
  theorem: JuliaLean.Combinatorics.nextprodLeast_refuted
