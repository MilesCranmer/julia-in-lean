id: iterators-partition-generic-alloc
title: Iterators.partition rejects a three-element tuple with a huge chunk limit
priority: P2
kind: wrong-exception
area: Iterators
files:
  - base/iterators.jl
functions:
  - iterate(::PartitionIterator)
summary: |
  iterate(partition((1, 2, 3), Int(1) << 62)) throws ArgumentError before
  yielding a chunk. The generic implementation allocates a vector of the
  requested chunk limit before reading any input, even though this tuple
  has only three elements. It shrinks the vector only after filling it.
likelihood: |
  A large limit can mean one chunk for a short input. For tuples, generators,
  or I/O iterators, allocating the entire limit wastes memory or throws.
  The safe reproducer uses an invalid internal buffer size that Julia rejects
  before attempting a large allocation.
maybe_intended: |
  A full-size buffer simplifies the generic implementation, but the final
  chunk is explicitly allowed to be shorter. The docstring's example includes
  a one-element final chunk. The requested limit need not equal the amount
  of storage needed for a short finite input.
reproducer: |
  p = Iterators.partition((1, 2, 3), Int(1) << 62)
  err = try
      iterate(p)
  catch e
      e
  end
  @assert err isa ArgumentError
  @assert occursin("invalid", sprint(showerror, err))
  println("REPRODUCED iterators-partition-generic-alloc")
output:
  release: |
    REPRODUCED iterators-partition-generic-alloc
  nightly: |
    REPRODUCED iterators-partition-generic-alloc
reproduced:
  release: true
  nightly: true
expected: |
  The first chunk should be [1, 2, 3], followed by completion. Storage should
  scale with the finite input's actual chunk size rather than the huge limit.
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  base/iterators.jl:1426: "Iterate over a collection `n` elements at a time."
  base/iterators.jl:1430-1434: "julia> collect(Iterators.partition([1,2,3,4,5], 2))
  3-element Vector{SubArray{Int64, 1, Vector{Int64}, Tuple{UnitRange{Int64}}, true}}:
   [1, 2]
   [3, 4]
   [5]"
  The example demonstrates a partial final chunk, not a memory-use guarantee.
cause: |
  base/iterators.jl:1489 constructs Vector{eltype(itr.c)}(undef, itr.n) before
  the first iterate call at line 1491. Only line 1501 shrinks that allocation
  to the number of elements actually read.
possible_fix: |
  For finite inputs with a known length, allocate min(itr.n, length(input))
  slots. For unknown-length iterators, grow a vector while reading up to
  itr.n elements rather than allocating the whole limit in advance.
duplicates:
  issues:
    - number: 45768
      state: closed
      relation: related
  search_notes: |
    No direct duplicate is known. Issue #45768 concerns unnecessary
    materialization of string partitions and requests SubString results; it
    does not report allocating a huge chunk limit before reading a short
    input.
  queries:
    - partition allocates
    - partition memory
    - partition typemax
    - Iterators.partition allocation
    - PartitionIterator memory
