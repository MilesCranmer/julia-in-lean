reproduced: {release: false, nightly: true}
expected: |
  The comprehension should return a one-element array indexed at typemax(Int), without
  reading any other index. The widening scan should treat firstindex == lastindex as
  having no remaining elements.
promised_by: |
  base/threadingconstructs.jl:391-421 says the fast path uses AbstractArrays directly
  to preserve their index space and allocates the result with axes(items). The @threads
  docstring at lines 567-575 says that the iteration space is distributed to tasks.
cause: |
  _comprehension_result at base/threadingconstructs.jl:356-364 calls the widening helper
  with firstindex(result) + 1. Machine-Int addition wraps at typemax(Int). The helper at
  lines 368-373 then treats typemin(Int):typemax(Int) as nonempty and reads result[j]
  under @inbounds at line 370.
possible_fix: |
  Return typeof(first(result)) immediately when firstindex(result) == lastindex(result),
  or advance the index without overflowing before entering the unchecked scan.
