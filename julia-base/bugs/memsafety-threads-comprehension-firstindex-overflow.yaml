id: memsafety-threads-comprehension-firstindex-overflow
title: "Threaded comprehension reads out of bounds when firstindex is typemax(Int)"
priority: P0
kind: crash
area: MemSafety
files: [base/threadingconstructs.jl]
functions: ["Threads.@threads comprehension", "_comprehension_result", "_comprehension_widened_eltype"]
summary: |
  A threaded comprehension over a one-element AbstractVector whose only index is
  typemax(Int) completes its parallel write, then widens the inferred element type.
  The widening scan wraps firstindex(result) + 1 to typemin(Int) and reads that index
  under @inbounds. With normal bounds settings, the read is outside the allocation.
likelihood: |
  The failure requires a custom array with an extreme offset axis and a comprehension
  whose inferred element type is non-concrete. Offset arrays are common, but an axis at
  typemax(Int) is contrived. Threaded comprehensions are new on master.
maybe_intended: |
  Custom AbstractArrays may use non-one-based axes, and the fast comprehension path
  explicitly preserves their index space. A legal one-element axis should not make
  type widening access a different index.
reproducer: |
  items = ExtremeVector([typemax(Int)])
  Threads.@threads [i == typemax(Int) ? i : string(i) for i in items]
