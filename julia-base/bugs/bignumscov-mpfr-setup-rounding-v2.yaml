      query: setrounding
    - tool: gh search issues --repo JuliaLang/julia
      query: setrounding modes
    - tool: gh search issues --repo JuliaLang/julia
      query: setrounding scoped
    - tool: gh search prs --repo JuliaLang/julia
      query: setrounding ScopedValue
    - tool: gh search prs --repo JuliaLang/julia
      query: setrounding modes
