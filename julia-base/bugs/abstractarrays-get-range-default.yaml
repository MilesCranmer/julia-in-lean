id: abstractarrays-get-range-default
title: "get(v::AbstractVector, r::AbstractRange, default) always throws ArgumentError (scalar assigned to a range)"
priority: P2
kind: wrong-exception
area: AbstractArrays
files: [base/abstractarray.jl]
functions: ["get(::AbstractArray, ::AbstractRange, default)", "get!(::AbstractVector, ::AbstractVector, ::Union{AbstractRange,AbstractVector{Int}}, default)"]
summary: |
  get(A, I::AbstractRange, default) should return A[I] with default in the
  positions where I is out of bounds. For a vector A it always throws
  "ArgumentError: indexed assignment with a single value to possibly many
  locations is not supported": get([10, 20], 0:3, 99) throws instead of
  returning [99, 10, 20, 99]. A fully in-bounds range such as 1:2 and a fully
  out-of-bounds range such as 3:4 throw the same error. The matrix (linear
  indexing) method works: get([10 30; 20 40], 0:5, 99) == [99, 10, 20, 30, 40, 99].
likelihood: |
  The method is not separately documented and seems rarely used. Any call with
  a vector and a range fails at once, so no code can depend on it; ordinary
  inputs hit the error.
maybe_intended: ""
reproducer: |
  get([10, 20], 0:3, 99)   # expected [99, 10, 20, 99]
  get([10, 20], 1:2, 99)   # expected [10, 20]; also throws
output:
  release: |
    JULIA 1.13.2 COMMIT 45b6d15e34bbd2003a31acce0b1847b63dad029c
    A = [10, 20], I = 0:3, default = 99
    expected = [99, 10, 20, 99]
    ArgumentError: indexed assignment with a single value to possibly many locations is not supported; perhaps use broadcasting `.=` instead?
    REPRODUCED abstractarrays-get-range-default
    A = [10, 20], I = 1:2, default = 99
    expected = [10, 20]
    ArgumentError: indexed assignment with a single value to possibly many locations is not supported; perhaps use broadcasting `.=` instead?
    REPRODUCED abstractarrays-get-range-default-ordinary
  nightly: |
    JULIA 1.15.0-DEV.unknown COMMIT f755f49a9e41380d7da126b3c1db9fe7f83dd027
    A = [10, 20], I = 0:3, default = 99
    expected = [99, 10, 20, 99]
    ArgumentError: indexed assignment with a single value to possibly many locations is not supported; perhaps use broadcasting `.=` instead?
    REPRODUCED abstractarrays-get-range-default
    A = [10, 20], I = 1:2, default = 99
    expected = [10, 20]
    ArgumentError: indexed assignment with a single value to possibly many locations is not supported; perhaps use broadcasting `.=` instead?
    REPRODUCED abstractarrays-get-range-default-ordinary
reproduced: {release: true, nightly: true}
expected: |
  get([10, 20], 0:3, 99) == [99, 10, 20, 99] and get([10, 20], 1:2, 99) == [10, 20],
  as the linear-indexing method already returns for matrices.
promised_by: |
  get docstring, base/dict.jl:486-489: "Return the value stored for the given key,
  or the given default value if no mapping for the key is present." The range
  method at base/abstractarray.jl:1662 and its helper get! (1644-1652) exist to
  return A[I] with default in the out-of-bounds positions.
cause: |
  base/abstractarray.jl:1649-1650 in the vector get! write the scalar default
  into ranges, X[first(Xind):first(ind)-1] = default and
  X[last(ind)+1:last(Xind)] = default. setindex! with a scalar value and a range
  index throws this ArgumentError, even when the range is empty, so every call
  fails. The linear-indexing get! (base/abstractarray.jl:1653-1660) uses
  fill!(view(...), default) instead and works. When no index is in bounds,
  first(ind) on the empty ind would also throw.
possible_fix: |
  Fill the out-of-bounds parts with fill!(view(X, ...), default) or `.= default`,
  as the linear-indexing method does, and handle an empty ind.
duplicates:
  issues: []
  queries: ["get AbstractArray range default", "get! default range ArgumentError", "get(A, range, default)", "indexed assignment with a single value get", "get array default out of bounds range"]
lean:
  property: JuliaLean.Proofs.base.abstractarray.RangeDefaultValues
  theorem: JuliaLean.Proofs.base.abstractarray.rangeDefaultValues_refuted
covers: [abstractarrays-get-range-default-ordinary]
