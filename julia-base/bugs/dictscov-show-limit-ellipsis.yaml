id: dictscov-show-limit-ellipsis
title: Limited dictionary display adds an ellipsis without omitting any pair
priority: P3
kind: wrong-result
area: DictsCov
files:
  - base/dict.jl
  - base/show.jl
functions:
  - show(io::IO, t::AbstractDict)
summary: |
  Limited compact display prints all ten entries of a ten-entry dictionary,
  then appends an ellipsis. The ellipsis suggests omitted data although the
  displayed pair count already equals the dictionary length.
likelihood: |
  Any ten-entry dictionary displayed with :limit => true reaches the boundary.
  The result affects display and logging, rather than dictionary contents.
maybe_intended: |
  A fixed ten-entry display budget is reasonable. The extra ellipsis follows
  the implementation's unconditional boundary check. The IOContext docstring
  describes an ellipsis in place of elements, but does not explicitly promise
  that an ellipsis appears exactly when pairs are omitted.
reproducer: |
  d = Dict(i => i for i in 1:10)
  s = repr(d; context = :limit => true)
  @assert count("=>", s) == length(d)
  @assert endswith(s, "…)")
output:
  release: |
    Dict(3 => 3, 2 => 2, 1 => 1, 4 => 4, 5 => 5, 6 => 6, 8 => 8, 7 => 7, 9 => 9, 10 => 10…)
    pairs shown: 10 of 10; ends with an ellipsis: true
    Dict(3 => 3, 2 => 2, 1 => 1, 4 => 4, 5 => 5, 6 => 6, 8 => 8, 7 => 7, 9 => 9)
    REPRODUCED dictscov-show-limit-ellipsis
  nightly: |
    Dict(3 => 3, 2 => 2, 1 => 1, 4 => 4, 5 => 5, 6 => 6, 8 => 8, 7 => 7, 9 => 9, 10 => 10…)
    pairs shown: 10 of 10; ends with an ellipsis: true
    Dict(3 => 3, 2 => 2, 1 => 1, 4 => 4, 5 => 5, 6 => 6, 8 => 8, 7 => 7, 9 => 9)
    REPRODUCED dictscov-show-limit-ellipsis
reproduced:
  release: true
  nightly: true
expected: |
  Display all ten pairs without an ellipsis when no pair is omitted. The
  output also includes a nine-entry control case.
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027.
  base/show.jl:397-398: "- `:limit`: Boolean specifying that containers should be truncated, e.g. showing `…` in
  place of most elements."
  This motivates the display convention; the stronger "exactly when" claim is not stated in the docs.
cause: |
  base/dict.jl:17-19 prints the current pair, increments n, and checks
  limit && n >= 10. It does not check whether iteration has another pair
  before printing the ellipsis and breaking.
possible_fix: |
  Emit the ellipsis only after discovering an eleventh pair, before displaying
  that pair. This distinguishes an exhausted ten-entry iterator from a
  truncated iterator.
duplicates:
  issues: []
  prs: []
  queries:
    - 'gh search issues --repo JuliaLang/julia "Dict show ellipsis"'
    - 'gh search issues --repo JuliaLang/julia "Dict limit 10"'
    - 'gh search issues --repo JuliaLang/julia "dictionary truncation"'
    - 'gh search prs --repo JuliaLang/julia "Dict show ellipsis"'
    - 'gh search prs --repo JuliaLang/julia "Dict limit 10"'
    - 'gh search prs --repo JuliaLang/julia "dictionary truncation"'
lean:
  property: JuliaLean.Proofs.base.dict.DictShowLimitEllipsis
  theorem: JuliaLean.ChatGPT.Batch4.Group1.DictscovShowLimitEllipsis_refuted
