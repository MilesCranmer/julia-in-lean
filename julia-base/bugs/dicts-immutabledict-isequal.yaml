id: dicts-immutabledict-isequal
title: "Repeated ImmutableDict keys make == and isequal asymmetric"
priority: "P2"
kind: "wrong-result"
area: "Dicts"
files:
  - "base/abstractdict.jl"
  - "base/dict.jl"
functions:
  - "==(::AbstractDict, ::AbstractDict)"
  - "isequal(::AbstractDict, ::AbstractDict)"
summary: |
  ImmutableDict(:a => 1, :a => 1) and Dict(:a => 1, :b => 1) both have length two. Forward equality and isequal return true because both repeated left-hand pairs match :a; reverse comparisons return false because :b is missing. The reproducer checks only the isequal half of this symmetry.
likelihood: |
  An ImmutableDict with repeated keys is compared to a dictionary with the same pair count and a different visible key set. Repeated keys naturally occur when layering immutable properties.
maybe_intended: |
  Iteration over shadowed ImmutableDict pairs is intentional. The resulting asymmetric isequal violates its explicit equivalence-relation contract. Open issue #64137 reports the same repeated-key comparison defect.
reproducer: |
  a = Base.ImmutableDict(:a => 1, :a => 1)
  b = Dict(:a => 1, :b => 1)
  @show a == b b == a
  @show isequal(a, b) isequal(b, a)
output:
  release: |
    REPRODUCED dicts-immutabledict-isequal
  nightly: |
    REPRODUCED dicts-immutabledict-isequal
reproduced:
  release: true
  nightly: true
expected: |
  Both comparison directions should agree. These visible key sets differ, so a symmetric false result is appropriate.
promised_by: |
  base/operators.jl:152-154 @ f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  "`isequal` is an equivalence relation - it is reflexive (`===` implies `isequal`), symmetric"
  "(`isequal(a, b)` implies `isequal(b, a)`) and transitive (`isequal(a, b)` and"
  "`isequal(b, c)` implies `isequal(a, c)`)."
cause: |
  base/abstractdict.jl:504-533 compares lengths and checks each left-hand pair against the right dictionary without a reverse key-set check. base/dict.jl:860-864 iterates and counts shadowed repeated pairs, allowing duplicate matches to conceal the missing :b key.
possible_fix: |
  Define equality for ImmutableDict in terms of visible bindings, or ensure the generic algorithm handles repeated iteration keys symmetrically.
duplicates:
  issues:
    - number: 64137
      state: open
      relation: duplicate
  prs: []
  queries:
    - "ImmutableDict isequal"
    - "ImmutableDict equality"
    - "ImmutableDict duplicate keys"
  search_evidence: |
    Open issue 64137 is a duplicate. Merged PR 64432 fixes related allunique/allequal assumptions, not dictionary equality.
lean:
  property: JuliaLean.Proofs.base.abstractdict.DictBothEqualitySymmetricSpec
  theorem: JuliaLean.ChatGPT.Batch4.Group15.DictsImmutabledictIsequal_refuted
