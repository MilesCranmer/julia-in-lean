id: stringutil-split-limit-type
title: "split, rsplit, eachsplit and eachrsplit throw MethodError for non-Int limit::Integer values"
priority: P2
kind: wrong-exception
area: StringUtil
files: [base/strings/util.jl]
functions: ["split(::AbstractString, ::Any)", "rsplit(::AbstractString, ::Any)", "eachsplit(::AbstractString, ::Any)", "eachrsplit(::AbstractString, ::Any)"]
summary: |
  The API signatures advertise `limit::Integer`, but eachsplit and eachrsplit pass
  it directly to iterators whose `limit` field is `Int`. A representable non-Int
  value such as `Int8(2)` or `BigInt(2)` therefore throws `MethodError`; split and
  rsplit inherit the failure through their iterator wrappers.
likelihood: |
  This affects callers that pass limits computed or stored as non-Int integer types.
  Default limits and ordinary Int literals work.
maybe_intended: ""
reproducer: |
  Stored at repro/stringutil-split-limit-type.jl. It calls public `split` with the
  representable non-Int limit `Int8(2)` and checks for the constructor's MethodError.
  Run with `julia repro/stringutil-split-limit-type.jl`.
output:
  release: |
    JULIA 1.13.2 COMMIT 45b6d15e34bbd2003a31acce0b1847b63dad029c
    REPRODUCED stringutil-split-limit-type
  nightly: |
    JULIA 1.15.0-DEV.unknown COMMIT f755f49a9e41380d7da126b3c1db9fe7f83dd027
    REPRODUCED stringutil-split-limit-type
reproduced: {release: true, nightly: true}
expected: |
  For every Integer `limit` representable as Int, these APIs should behave as they
  do with `Int(limit)`. Here `split("a,b,c", ','; limit=Int8(2))` should return
  `["a", "b,c"]`, as the `Int(2)` call does.
promised_by: |
  The public signatures use `limit::Integer` and document its result-size limit:
  `eachsplit` at base/strings/util.jl:738-751, `eachrsplit` at 835-836,
  `split` at 930-945 and `rsplit` at 969-976.
cause: |
  eachsplit and eachrsplit pass `limit` unchanged to SplitIterator and
  RSplitIterator (base/strings/util.jl:820-821, 884-885). Both structs declare
  `limit::Int` (lines 776-781 and 872-877), so their generated constructors throw
  MethodError for a non-Int argument. split and rsplit collect these iterators.
possible_fix: |
  Convert `limit` with `Int(limit)` in eachsplit and eachrsplit. split and rsplit
  then inherit the behavior through their iterator wrappers.
