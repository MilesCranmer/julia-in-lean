id: permuteddimsarray-copy-linear-length
title: "copyto! to a PermutedDimsArray copies a Cartesian rectangle instead of the linear prefix"
priority: P2
kind: wrong-result
area: PermutedDimsArray
files: [base/permuteddimsarray.jl, base/abstractarray.jl]
functions: ["copyto!(::PermutedDimsArray, ::AbstractArray)", "_copy!(::PermutedDimsArray, src)"]
summary: |
  copyto!(destination, source) accepts a source whose length does not exceed the
  destination's length and documents copying into the destination's linear prefix.
  The same-rank PermutedDimsArray specialization instead copies source Cartesian
  coordinates. Copying a separate 2×2 source to a 3×3 destination writes the wrong
  positions; copying a separate 4×1 source to a 2×2 destination throws BoundsError.
  All arrays are fully initialized, ordinary one-based arrays. They do not alias.
likelihood: |
  This affects generic array-copying code that copies between differently shaped
  arrays and receives a PermutedDimsArray destination. The values and dimensions
  are small, but differing shapes are required.
maybe_intended: |
  The tiled implementation appears designed for shape-compatible permutation
  operations. Its method also specializes the public two-argument copyto! API,
  whose docstring imposes a length requirement and specifies linear-prefix
  copying rather than requiring matching shapes. There is no aliasing in either
  example, so the documented aliasing warning does not apply.
  Issue #34025 and PR #34049 establish that the intended two-argument copyto!
  behavior is linear-order copying even for Cartesian-indexed arrays. PR #34049
  repaired another implementation of this same inconsistency.
reproducer: |
  source = reshape([1, 2, 3, 4], 2, 2)
  ordinary = zeros(Int, 3, 3)
  permuted = PermutedDimsArray(zeros(Int, 3, 3), (2, 1))
  copyto!(ordinary, source)
  copyto!(permuted, source)
  println(ordinary)
  println(collect(permuted))
output:
  release: |
    JULIA 1.13.2 COMMIT 45b6d15e34bbd2003a31acce0b1847b63dad029c
    ordinary destination = [1 3; 2 4]
    source size = (4, 1); destination size = (2, 2)
    source length = 4; destination length = 4
    permuted result = BoundsError
    parent after copy = [0 0; 0 0]
    ordinary larger destination = [1 4 0; 2 0 0; 3 0 0]
    permuted larger destination = [1 3 0; 2 4 0; 0 0 0]
    REPRODUCED permuteddimsarray-copy-linear-length
  nightly: |
    JULIA 1.15.0-DEV.unknown COMMIT f755f49a9e41380d7da126b3c1db9fe7f83dd027
    ordinary destination = [1 3; 2 4]
    source size = (4, 1); destination size = (2, 2)
    source length = 4; destination length = 4
    permuted result = BoundsError
    parent after copy = [0 0; 0 0]
    ordinary larger destination = [1 4 0; 2 0 0; 3 0 0]
    permuted larger destination = [1 3 0; 2 4 0; 0 0 0]
    REPRODUCED permuteddimsarray-copy-linear-length
reproduced: {release: true, nightly: true}
expected: |
  For the 2×2 source and 3×3 destination, the first four linear destination
  elements become 1, 2, 3, 4 and the remaining five elements stay zero:
  [1 4 0; 2 0 0; 3 0 0]. For the 4×1 source and 2×2 destination, copying
  succeeds and the destination becomes [1 3; 2 4].
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027.
  base/abstractarray.jl:1043-1048 documents copyto!(dest::AbstractArray, src):
  "Copy all elements from collection src to array dest, whose length must be
  greater than or equal to the length n of src. The first n elements of dest
  are overwritten, the other elements are left untouched."
cause: |
  base/permuteddimsarray.jl:293-298 checks the source's Cartesian axes against
  the destination and then calls _copy!. Lines 300-347 traverse source Cartesian
  coordinates and assign those same coordinates in the permuted destination.
  These checks and writes differ from the documented linear-prefix operation
  when source and destination shapes differ. Generic copyto_unaliased! at
  base/abstractarray.jl:1088-1123 copies in linear iteration order instead.
possible_fix: |
  Keep the tiled path when the shapes match. For different shapes, use the generic
  linear-order copy implementation after checking capacity and removing any alias.
duplicates:
  issues:
    - {number: 33589, state: closed, relation: related}
    - {number: 34025, state: closed, relation: related}
    - {number: 34031, state: closed, relation: related}
    - {number: 34049, state: closed, relation: related}
  queries:
    - 'site:github.com/JuliaLang/julia "copyto!" "PermutedDimsArray" "BoundsError"'
    - 'site:github.com/JuliaLang/julia "PermutedDimsArray" "copyto!" "shape"'
lean:
  property: JuliaLean.Proofs.base.permuteddimsarray.CopyLinearLength.CopyFitsLinearLength
  theorem: JuliaLean.Proofs.base.permuteddimsarray.CopyLinearLength.copyFitsLinearLength_refuted
  notes: |
    CopyFitsLinearLength quantifies over distinct initialized ordinary matrices
    represented by existing heap-array metadata and allocated element storage.
    For a nonempty source, sufficient linear capacity must prevent the public
    bounds precheck from rejecting different shapes. The formal witness has a
    2×2 destination and a 4×1 source, both with four initialized elements.
    It uses the installed axes, tuple/range bounds and exception models.
    The wrong-write example has runtime evidence; the formal refutation covers
    the necessary exception-free precheck promise. The separate whole-operation
    witness remains universal over the later unalias/copy methods. A closed
    whole-operation statement still needs concrete bindings of those methods
    and is not registered.
    The registered refutation passes the full Lean build and registry audit.
covers: []
