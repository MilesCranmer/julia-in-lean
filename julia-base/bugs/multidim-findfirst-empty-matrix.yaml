id: multidim-findfirst-empty-matrix
title: findfirst and findlast throw BoundsError on empty matrices with zero rows
priority: P1
kind: wrong-exception
area: Multidim
files:
  - base/array.jl
  - base/multidimensional.jl
functions:
  - findfirst(A::AbstractArray)
  - findfirst(testf::Function, A::AbstractArray)
  - findlast(A::AbstractArray)
  - findlast(testf::Function, A::AbstractArray)
  - findnext(testf::Function, A, start)
  - findprev(testf::Function, A, start)
summary: |
  Searching a 0-by-3 Boolean matrix with findfirst or findlast throws
  BoundsError instead of returning nothing. Predicate searches on zero-row
  numeric matrices also fail. The reproducer includes a BitMatrix. A
  3-by-0 matrix returns nothing, so the behavior depends on which dimension is
  empty.
likelihood: |
  Filtering data can leave a matrix with zero rows. Searching such a matrix for
  a matching entry should be an ordinary empty search; instead it throws.
maybe_intended: |
  There is no element to inspect, and both search docstrings explicitly return
  nothing when no match exists. Open issue #36938 describes the underlying
  findnext failure on the same kind of empty Cartesian index space.
reproducer: |
  findfirst(zeros(Bool, 0, 3))
  findlast(zeros(Bool, 0, 3))
  findfirst(iszero, zeros(0, 2))
  findfirst(zeros(Bool, 3, 0))
output:
  release: |
    BoundsError(Matrix{Bool}(undef, 0, 3), (1, 1))
    BoundsError(Matrix{Bool}(undef, 0, 3), (0, 3))
    BoundsError(Matrix{Float64}(undef, 0, 2), (1, 1))
    BoundsError(Matrix{Int64}(undef, 0, 2), (0, 2))
    nothing
    BoundsError(0×3 BitMatrix, (1, 1))
    REPRODUCED multidim-findfirst-empty-matrix
  nightly: |
    BoundsError(Matrix{Bool}(undef, 0, 3), (1, 1))
    BoundsError(Matrix{Bool}(undef, 0, 3), (0, 3))
    BoundsError(Matrix{Float64}(undef, 0, 2), (1, 1))
    BoundsError(Matrix{Int64}(undef, 0, 2), (0, 2))
    nothing
    BoundsError(0×3 BitMatrix, (1, 1))
    REPRODUCED multidim-findfirst-empty-matrix
reproduced:
  release: true
  nightly: true
expected: |
  Each search of an empty array returns nothing. Run the short calls individually
  to observe the exceptions; the full reproducer catches and prints them so it
  can exercise both directions, the predicate variants and BitMatrix in one run.
promised_by: |
  base/array.jl:2486-2487 at f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  "Return the index or key of the first element of `A` for which `predicate` returns `true`.
  Return `nothing` if there is no such element."
  base/array.jl:2682-2683:
  "Return the index or key of the last element of `A` for which `predicate` returns `true`.
  Return `nothing` if there is no such element."
cause: |
  findfirst starts findnext at first(keys(A)) (base/array.jl:2439,2526-2527).
  The generic findnext checks i > last(keys(A)) at lines 2470-2475 before
  reading A[i]. For a 0-by-3 matrix, first and last are CartesianIndex(1,1)
  and CartesianIndex(0,3); their ordering does not identify the index space as
  empty. findprev mirrors this with i < first(keys(A)) at lines 2666-2671.
possible_fix: |
  Check whether the Cartesian index space is empty before the first array read
  in the generic forward and backward searches. Preserve the existing handling
  of nonempty searches and their start indices.
duplicates:
