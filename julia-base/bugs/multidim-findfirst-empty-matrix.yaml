  queries:
    - 'gh search issues --repo JuliaLang/julia findfirst empty matrix'
    - 'gh search issues --repo JuliaLang/julia findnext empty'
    - 'gh search issues --repo JuliaLang/julia findlast CartesianIndex'
    - 'gh search prs --repo JuliaLang/julia findfirst empty matrix'
    - 'gh search prs --repo JuliaLang/julia findnext empty'
    - 'gh search prs --repo JuliaLang/julia findlast CartesianIndex'
  notes: |
    Inspected #36938, which demonstrates the same BoundsError for a zero-row
    matrix and explains the CartesianIndex comparison. Inspected PR #40120;
    its stated fixes concern empty-string searches, bounds checking and index
    alignment, so it is related search work rather than a verified fix here.
