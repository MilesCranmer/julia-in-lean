  theorem: ""
  notes: "Found by the soundness smoke test of difftest/compiler/tfuncs.jl. The property is stated as SubtypeTfuncSound (JuliaLean/Proofs/Compiler/src/tfuncs/Refuted.lean, registry entry compiler-tfuncs-subtype-bottom-lhs, status todo) but not refuted in Lean: every counterexample needs jl_isa or jl_subtype on a Union or UnionAll (Union{} isa Type{<:Integer}, Int64 <: String), and those paths of the subtyping model run `while` loops, which are partial and opaque to the kernel. #eval of the model gives the pinned results."
