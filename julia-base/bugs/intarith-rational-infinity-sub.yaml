id: intarith-rational-infinity-sub
title: "Subtracting a finite unsigned rational from infinity throws OverflowError"
priority: P2
kind: wrong-exception
area: IntArith
files: [base/rational.jl]
functions: ["-(::Rational,::Rational)", "-(::Rational{<:Unsigned})"]
summary: |
  The pinned source negates a finite unsigned rational while subtracting it from
  positive infinity. The resulting OverflowError prevents a representable
  result. Exact duplicate PR #64305 is merged; this report concerns the source
  at the pinned commit.
likelihood: |
  Requires unsigned rational positive infinity and a nonzero finite rational.
maybe_intended: |
  Unary negation of nonzero unsigned rationals intentionally throws. The binary
  subtraction shortcut needlessly invokes that operation on its finite operand.
reproducer: |
  x = UInt8(1) // UInt8(0)
  y = UInt8(1) // UInt8(1)
  @assert x - 1 == x
  observed = try x - y catch err; err end
  @assert observed isa OverflowError
  println("REPRODUCED intarith-rational-infinity-sub")
output:
  release: |
    REPRODUCED intarith-rational-infinity-sub
  nightly: |
    REPRODUCED intarith-rational-infinity-sub
reproduced: {release: true, nightly: true}
expected: |
  Return positive infinity UInt8(1)//UInt8(0), as rational-minus-integer does.
promised_by: |
  Arithmetic invariant: positive infinity minus a finite value remains infinity.
  Pinned base/rational.jl:433-440 explicitly handles rational infinities.
  PR #64305 confirms the exact input should return positive infinity.
  https://github.com/JuliaLang/julia/pull/64305
cause: |
  At f755f49a9e41380d7da126b3c1db9fe7f83dd027, the subtraction shortcut tests
  isinf(x) && x == -y. Unsigned unary negation at lines 408-411 throws for y.num != 0.
possible_fix: |
  Check isinf(y) and opposite signs without negating y, as merged PR #64305 does.
duplicates:
  issues:
    - {number: 64305, state: merged, relation: duplicate}
    - {number: 16111, state: closed, relation: related}
  queries:
    - 'gh search issues --repo JuliaLang/julia "rational unsigned infinity" --limit 30'
    - 'gh search prs --repo JuliaLang/julia "rational unsigned infinity" --limit 30'
    - 'gh search issues --repo JuliaLang/julia rational infinity --limit 40'
    - 'gh search prs --repo JuliaLang/julia rational unsigned infinity --limit 30'
lean:
  property: JuliaLean.Proofs.base.rational.Round4.infinity_sub
  theorem: JuliaLean.ChatGPT.Batch4.Group19.IntarithRationalInfinitySub_refuted
