id: compiler-escape-sqsub-transitive
title: "EscapeAnalysis ⊑ₑ checks only the last field when comparing IndexableFields with Unindexable"
priority: P3
kind: wrong-result
area: Compiler
files: [Compiler/src/ssair/EscapeAnalysis.jl]
functions: ["x::EscapeInfo ⊑ₑ y::EscapeInfo", "x::EscapeInfo ⊔ₑ y::EscapeInfo"]
summary: |
  When x has IndexableFields alias information and y has Unindexable, x ⊑ₑ y loops
  `for i = length(xinfos)`, which visits only the last field. So ⊑ₑ is not transitive
  (x ⊑ₑ y and y ⊑ₑ z but not x ⊑ₑ z), it disagrees with ⊔ₑ (x ⊑ₑ y but x ⊔ₑ y != y), and
  for an object with no fields it reads xinfos[0] and throws a BoundsError, so
  x ⊑ₑ x ⊔ₑ y fails.
likelihood: |
  None in the optimizer at this commit. ⊑ₑ is reached during analysis only through
  has_all_escape(x) = ⊤ ⊑ₑ x, which returns at the fast path before this loop; the optimizer
  (finalizer inlining, the effect_free refinement) uses has_no_escape and getaliases, not ⊑ₑ.
  External tools that call ⊑ₑ (the EAUtils test harness, Cthulhu-style viewers) could see it.
  Triage 2026-11-10. Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  Master Compiler/src/ssair/EscapeAnalysis.jl:276 still reads `for i = length(xinfos)`. Not a
  model artifact: the reproducer builds EscapeInfo values with the public constructors and calls
  the real ⊑ₑ. No caller in Compiler/src reaches the slow path (has_all_escape returns at the fast
  path), so there is no effect on optimized code; only tools that call ⊑ₑ directly can see it.
  A one-character fix. P3.
maybe_intended: |
  The loop is probably meant to be `for i = 1:length(xinfos)`, like the IndexableFields case
  above it; nothing suggests a deliberate last-field check.
reproducer: |
  const EA = Base.Compiler.EscapeAnalysis
  use(i) = (s = EA.AInfo(); push!(s, EA.LocalUse(i)); s)
  info(a) = EA.EscapeInfo(EA.NoEscape(), a)
  x = info(EA.IndexableFields([use(2)])); y = info(EA.IndexableFields([use(2), EA.AInfo()]))
  z = info(EA.Unindexable(EA.AInfo()))
  EA.:⊑ₑ(x, y), EA.:⊑ₑ(y, z), EA.:⊑ₑ(x, z)   # (true, true, false)
  e = info(EA.IndexableFields(EA.AInfo[])); EA.:⊑ₑ(e, EA.:⊔ₑ(e, z))   # BoundsError
