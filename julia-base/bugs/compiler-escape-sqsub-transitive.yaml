reproduced: {release: true, nightly: true, master: true}
expected: |
  y = IndexableFields([{LocalUse(2)}, {}]) is not ⊑ₑ Unindexable({}), because its first field
  is not contained in that set; then ⊑ₑ is transitive and agrees with ⊔ₑ, and e ⊑ₑ e ⊔ₑ z is
  true for the object with no fields.
promised_by: |
  The ⊑ₑ docstring calls it the partial order of the lattice (Compiler/src/ssair/EscapeAnalysis.jl:241-245),
  and ⊔ₑ "computes the join" (lines 318-322).
cause: |
  Compiler/src/ssair/EscapeAnalysis.jl:278 `for i = length(xinfos)` iterates over the single
  number length(xinfos). Unchanged on current master (eb844b8ebd99, line 276; master only
  removed AllReturnEscape and ignore_thrownescapes from this file).
possible_fix: |
  Write `for i = 1:length(xinfos)` at line 278.
