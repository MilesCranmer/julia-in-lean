id: docssyntaxcov-library-files-unrelated-invalid
title: "library_files throws when a directory contains an unrelated library with a four-part version"
priority: P2
kind: wrong-exception
area: DocsSyntaxCov
files: [base/linking.jl]
functions: ["Base.Linking.library_files(::AbstractString)"]
summary: |
  The documented public wrapper scans the Julia installation's library directories.
  When an unrelated `libbar.1.2.3.4.so` is present beside the requested `libjulia`
  library, it throws while parsing that name instead of returning the shipped paths.
likelihood: |
  Moderate for installations whose library directories contain an unrelated
  four-part shared-library version; the checked-in probe adds one beside libjulia.
maybe_intended: ""
reproducer: |
  function reproduce()
      if !isdefined(Base, :Linking) || !isdefined(Base.Linking, :library_files)
          println("Base.Linking.library_files is unavailable in ", VERSION)
          println("NOT REPRODUCED docssyntaxcov-library-files-unrelated-invalid")
          return
      end
      source_root = dirname(Sys.BINDIR)
      name = "libjulia"
      @assert any(path -> basename(path) == "libjulia.so", Base.Linking.library_files(name))
      copy_root = joinpath(mktempdir(), "julia")
      run(`cp -a $source_root $copy_root`)
      copy_dir = joinpath(copy_root, "lib")
      open(joinpath(copy_dir, "libbar.1.2.3.4.so"), "w") do io
          write(io, UInt8[])
      end
      println("copied install: libbar.1.2.3.4.so beside libjulia.so")
      child = """
      name = ARGS[1]
      result = try
          Base.Linking.library_files(name)
      catch err
          err
      end
      println("library_files(", repr(name), ") = ", result isa Exception ? sprint(showerror, result) : repr(result))
      if result isa ArgumentError && occursin("1.2.3.4", sprint(showerror, result))
          println("REPRODUCED docssyntaxcov-library-files-unrelated-invalid")
      else
          error("public library lookup did not reject the unrelated version")
      end
      """
      run(Cmd([joinpath(copy_root, "bin", "julia"), "--startup-file=no", "--history-file=no", "-e", child, name]))
  end
  reproduce()
output:
  release: |
    Base.Linking.library_files is unavailable in 1.13.2
    NOT REPRODUCED docssyntaxcov-library-files-unrelated-invalid
  nightly: |
    copied install: libbar.1.2.3.4.so beside libjulia.so
    library_files("libjulia") = ArgumentError: invalid version string: 1.2.3.4
    REPRODUCED docssyntaxcov-library-files-unrelated-invalid
reproduced: {release: false, nightly: true}
expected: |
  The public wrapper returns the shipped libjulia paths and ignores the unrelated
  four-part filename.
promised_by: |
  Base.Linking.library_files at base/linking.jl:288-295 returns paths for the
  requested names and says names the installation does not ship contribute nothing.
cause: |
  `is_library_file` catches `ArgumentError` only around the first
  `parse_dl_name_version` call at base/linking.jl:256-261. The fallback call at
  line 265 is unguarded and parses four-part versions through `VersionNumber`,
  whose exception aborts the loop in `library_files!` at lines 274-285.
possible_fix: |
  Treat an `ArgumentError` from the fallback parse as a non-matching filename,
  as the first parse already does.
duplicates:
  issues: []
  queries: ["library_files invalid version unrelated file", "is_library_file parse_dl_name_version"]
lean:
  property: JuliaLean.DocsSyntaxCov.Linking.LibraryFilesNoThrow
  theorem: JuliaLean.DocsSyntaxCov.Linking.libraryFilesNoThrow_refuted
