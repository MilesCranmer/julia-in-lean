id: iterators-product-last-empty
title: last of an empty Iterators.product returns a tuple absent from the product
priority: P3
kind: missing-error
area: Iterators
files:
  - base/iterators.jl
  - base/abstractarray.jl
functions:
  - last(::ProductIterator)
summary: |
  last(product(1:2, 1:0)) returns (2, 0), although the product is empty and
  contains no such element. Replacing the empty range with an empty vector
  makes last throw instead. ProductIterator maps last over its factors without
  checking whether the Cartesian product contains any elements.
likelihood: |
  Requires calling last on a product with an empty range factor. Range bounds
  computed from data can produce this situation without an explicit empty input.
maybe_intended: |
  The last docstring explicitly allows empty AbstractRange inputs to return
  their endpoint. ProductIterator inherits that behavior from its factors,
  which may be convenient, but ProductIterator is not an AbstractRange and
  the documentation does not extend the exception to Cartesian products.
  Issue #52195 discusses changing the empty-range behavior itself, rather
  than this product-specific consequence.
reproducer: |
  p = Iterators.product(1:2, 1:0)
  isempty(p)  # true
  last(p)     # (2, 0)
  last(Iterators.product([1, 2], Int[]))  # throws BoundsError
output:
  release: |
    isempty(product(1:2, 1:0)) = true, last = (2, 0)
    last(product([1,2], Int[])) throws: true
    REPRODUCED iterators-product-last-empty
  nightly: |
    isempty(product(1:2, 1:0)) = true, last = (2, 0)
    last(product([1,2], Int[])) throws: true
    REPRODUCED iterators-product-last-empty
reproduced:
  release: true
  nightly: true
expected: |
  last should throw for an empty ProductIterator, or its documentation should
  explicitly extend the empty-range endpoint convention to products.
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  base/abstractarray.jl:515-517: "Get the last element of an ordered collection, if it can be computed in O(1) time. This is
  accomplished by calling [`lastindex`](@ref) to get the last index. Return the end
  point of an [`AbstractRange`](@ref) even if it is empty."
  The explicit exception names AbstractRange, not ProductIterator.
cause: |
  base/iterators.jl:1256 defines last(p::ProductIterator) as
  Base.map(last, p.iterators). Empty range factors supply endpoints even
  though the resulting tuple is not an element of the product.
possible_fix: |
  Check for empty factors before mapping last, and throw if any factor is empty.
  If endpoint propagation is intentional, document that additional exception.
duplicates:
  issues:
    - number: 52195
      state: open
      relation: related
  prs:
    - number: 22989
      state: merged
      relation: related
      note: "related ProductIterator implementation history"
  search_notes: |
    Issue #52195 discusses empty ranges themselves. PR #22989 replaces the
    product implementation; its description does not report this
    empty-product result. No exact duplicate is known.
  queries:
    - product last empty
    - ProductIterator last
    - last empty range
    - last ProductIterator empty
lean:
  property: JuliaLean.Proofs.base.iterators.ProductLastNonempty
  theorem: JuliaLean.ChatGPT.Batch4.Group5.IteratorsProductLastEmpty_refuted
