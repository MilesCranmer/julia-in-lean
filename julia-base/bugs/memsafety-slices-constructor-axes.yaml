reproduced: {release: true, nightly: true}
expected: |
  The constructor should reject axes that do not correspond to the mapped parent axes.
  Every index accepted by checkbounds(s, I...) must map to an in-bounds parent index.
promised_by: |
  Slices docstring, base/slicearray.jl:12-36, says that it is an AbstractArray of
  slices into a parent array and that axes contains the axes of the Slices object.
  Invariant: an in-bounds AbstractArray index must not access outside its storage.
cause: |
  base/slicearray.jl:41-49 checks length(slicemap) but does not verify that ax agrees
  with the mapped parent axes. Lines 240-246 check the user index against s.axes and
  then apply the mapped index to s.parent under @inbounds.
possible_fix: |
  Validate each non-Colon slicemap entry and corresponding outer axis against the
  mapped parent axis in the Slices constructor, or make the unchecked constructor
  inaccessible and route public construction through validated helpers.
