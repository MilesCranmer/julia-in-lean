id: memsafety-slices-constructor-axes
title: "Base.Slices accepts axes outside its parent and then reads or writes out of bounds"
priority: P2
kind: missing-error
area: MemSafety
files: [base/slicearray.jl]
functions: ["Slices(A, slicemap, ax)", "getindex(::Slices, I...)", "setindex!(::Slices, val, I...)"]
summary: |
  The public Base.Slices constructor checks only that slicemap has enough entries. It
  accepts outer axes that exceed the corresponding parent axes. getindex and setindex!
  validate against those supplied outer axes, then use @inbounds for the mapped parent
  access. A valid outer index can therefore read or write beyond the parent allocation.
likelihood: |
  Most callers use eachslice, eachrow, or eachcol, which construct matching axes. Code
  that constructs Base.Slices directly can trigger the bug with ordinary small arrays.
maybe_intended: |
  Slices is exported and documented, but its docstring says Slices "should typically be
  constructed by eachslice, eachcol or eachrow", so direct construction with inconsistent
  axes is unusual. An inconsistent constructor input should throw instead of creating an
  array whose in-bounds indices access memory outside its parent.
reproducer: |
  s = Base.Slices(Int[11, 22], (1,), (Base.OneTo(3),))
  s[3]
  s[3] = 99
