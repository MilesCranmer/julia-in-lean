id: tuples-findall-in-isequal
title: findall(in(b), tuple) changes membership equality for signed zero and NaN
priority: P2
kind: wrong-result
area: Tuples
files:
  - base/array.jl
  - base/operators.jl
functions:
  - findall(pred::Fix2{typeof(in)}, x::Tuple)
  - _findin
summary: |
  findall(in([0.0]), (-0.0,)) returns Int64[] although applying the predicate
  directly returns [1]. For NaN the discrepancy reverses: the optimized call
  returns [1] while the equivalent anonymous predicate returns Int64[]. The
  optimization changes membership from == to isequal by building a Set.
likelihood: |
  Signed zero and NaN arise in ordinary floating-point data. A caller can change
  the answer merely by replacing x -> x in b with the documented equivalent in(b).
maybe_intended: |
  Hash-based lookup is a deliberate optimization, but it cannot preserve the
  documented predicate equivalence when == and isequal disagree. Issue #64153
  explicitly covers this tuple example. The report does not require changing
  Set membership itself.
reproducer: |
  findall(in([0.0]), (-0.0,))
  findall(x -> x in [0.0], (-0.0,))
  findall(in([NaN]), (NaN,))
  findall(x -> x in [NaN], (NaN,))
output:
  release: |
    Int64[] [1] [1] Int64[] true false
    REPRODUCED tuples-findall-in-isequal
  nightly: |
    Int64[] [1] [1] Int64[] true false
    REPRODUCED tuples-findall-in-isequal
reproduced:
  release: true
  nightly: true
expected: |
  Both predicate spellings should return [1] for -0.0 in [0.0] and Int64[] for
  NaN in [NaN].
promised_by: |
  base/operators.jl:1446-1448 at f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  "Create a function that checks whether its argument is [`in`](@ref) `collection`, i.e.
  a function equivalent to `y -> y in collection`. See also [`insorted`](@ref) for use
  with sorted collections."
  base/array.jl:2736-2737:
  "Return a vector `I` of the indices or keys of `A` where `f(A[I])` returns `true`.
  If there are no such elements of `A`, return an empty array."
cause: |
  base/array.jl:2962 calls _findin(x, pred.x). The fallback at line 2905 converts
  the collection to Set(b); lines 2898-2904 test membership in that Set rather
  than evaluating the original predicate. Set lookup distinguishes signed zeros
  and equates NaNs, while in(x, itr::Any) at base/operators.jl:1455 uses ==.
possible_fix: |
  Preserve the predicate's membership relation. Restrict the Set optimization to
  cases where that equivalence is guaranteed, and evaluate the original predicate
  otherwise. Documenting a different findall predicate would require changing
  the existing in(collection) equivalence as well.
duplicates:
