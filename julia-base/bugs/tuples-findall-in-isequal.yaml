      state: open
      relation: related
  queries:
    - 'gh search issues --repo JuliaLang/julia findall isequal'
    - 'gh search issues --repo JuliaLang/julia findall NaN'
    - 'gh search issues --repo JuliaLang/julia findall tuple'
    - 'gh search prs --repo JuliaLang/julia findall isequal'
    - 'gh search prs --repo JuliaLang/julia findall NaN'
    - 'gh search prs --repo JuliaLang/julia findall tuple'
  notes: |
    Inspected #64153, which contains the same tuple signed-zero and NaN examples.
    #29124 and #52639 concern the same optimization assuming a finite iterable,
    rather than its equality semantics. PR #46222 changes _sortedfindin dispatch;
    it does not fix the Set-based tuple witness. No fixing PR was identified.
