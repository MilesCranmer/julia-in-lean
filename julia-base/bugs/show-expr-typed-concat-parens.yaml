id: show-expr-typed-concat-parens
title: "typed_hcat/typed_vcat Exprs print without parentheses around an operator type expression"
priority: P2
kind: wrong-result
area: Show
files: [base/show.jl]
functions: ["show_unquoted(::IO, ::Expr, ::Int, ::Int)"]
summary: |
  string(Meta.parse("(a + b)[1 2]")) == "a + b[1 2]", which parses as a + (b[1 2]). The
  same happens for typed_vcat ("(-a)[1;]" prints "-a[1;]") and typed_ncat. The typed
  concatenation branch prints its first argument with the surrounding precedence
  instead of parenthesizing it like the ref branch does.
likelihood: |
  Moderate in generated code: typed concatenation with a computed element type expression.
maybe_intended: ""
reproducer: |
  ex = Meta.parse("(a + b)[1 2]")     # Expr(:typed_hcat, :(a + b), 1, 2)
  s = string(ex)
  println("string(ex) = ", repr(s))
  back = Meta.parse(s)
  println("Meta.parse(string(ex)) = ", repr(back))
  back != ex && println("REPRODUCED show-expr-typed-concat-parens")
output:
  release: |
    string(ex) = "a + b[1 2]"
    Meta.parse(string(ex)) = :(a + b[1 2])
    REPRODUCED show-expr-typed-concat-parens
  nightly: |
    string(ex) = "a + b[1 2]"
    Meta.parse(string(ex)) = :(a + b[1 2])
    REPRODUCED show-expr-typed-concat-parens
reproduced: {release: true, nightly: true}
expected: |
  "(a + b)[1 2]".
promised_by: |
  base/show.jl:1636-1640: "AST printing should follow two rules: 1. Meta.parse(string(ex))
  == ex ...".
cause: |
  base/show.jl:2121-2122 calls show_unquoted(io, args[1], indent, prec, quote_level); unlike
  show_call (base/show.jl:1839-1848) it never wraps a call/operator expression in
  parentheses.
possible_fix: |
  Print args[1] the way show_call prints the callee (parenthesize unless it is a symbol, ., curly or ref).
duplicates:
  issues:
    - {number: 49494, state: open, relation: related}
  queries:
    - "issues: typed_hcat show parentheses"
    - "issues: show typed_vcat"
    - "issues: typed_hcat"
    - "issues: typed_vcat print"
    - "issues: printing typed_vcat"
    - "issues: Expr printing indexing precedence"
    - "prs: typed_hcat show"
    - "prs: show typed concatenation"
    - "issues: show_unquoted"
    - "issues: deparse"
    - "issues: printing Expr precedence"
    - "issues: string Meta.parse roundtrip"
    - "issues: Expr printing"
lean:
  property: JuliaLean.Show.TypedConcatReparses
  theorem: JuliaLean.Show.typedConcatReparses_refuted
