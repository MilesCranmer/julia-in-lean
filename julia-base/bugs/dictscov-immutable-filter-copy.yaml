id: dictscov-immutable-filter-copy
title: "filter and copy of a nonempty ImmutableDict throw MethodError"
priority: "P2"
kind: "wrong-exception"
area: "DictsCov"
files:
  - "base/abstractdict.jl"
  - "base/dict.jl"
functions:
  - "filter(f, d::AbstractDict)"
  - "copy(a::AbstractDict)"
summary: |
  The nonmutating filter and copy methods allocate empty(d) and then assign into it. For Base.ImmutableDict(:a => 1), empty(d) is immutable and the retained pair triggers MethodError. The reproducer uses filter only.
likelihood: |
  Direct use of a nonempty internal ImmutableDict with filter or copy. Immutable dictionaries also occur in IOContext properties.
maybe_intended: |
  ImmutableDict is internal and has no mutating setindex! method. Unsupported mutation is expected; failure of the documented nonmutating operation is the disputed behavior.
reproducer: |
  d = Base.ImmutableDict(:a => 1)
  for op in (d -> filter(_ -> true, d), copy)
      try
          @show op(d)
      catch err
          @show typeof(err)
      end
  end
output:
  release: |
    REPRODUCED dictscov-immutable-filter-copy
  nightly: |
    REPRODUCED dictscov-immutable-filter-copy
reproduced:
  release: true
  nightly: true
expected: |
  filter(_ -> true, d) and copy(d) should return a dictionary containing the source entry, or the documented AbstractDict contract should state this restriction.
promised_by: |
  base/abstractdict.jl:462-465 @ f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  "filter(f, d::AbstractDict)"
  "Return a copy of `d`, removing elements for which `f` is `false`."
  "The function `f` is passed `key=>value` pairs."
  base/abstractdict.jl:197 defines copy(a::AbstractDict) = merge!(empty(a), a).
cause: |
  base/abstractdict.jl:479-488 inserts accepted pairs into empty(d). The generic copy at line 197 calls merge!, whose lines 224-235 assign entries. base/dict.jl:866 returns an empty ImmutableDict, which lacks setindex!.
possible_fix: |
  Provide nonmutating filter and copy methods for ImmutableDict using its persistent constructor, or clarify the accepted dictionary types.
duplicates:
  issues:
    - number: 53982
      state: open
      relation: related
  prs: []
  queries:
    - "ImmutableDict filter"
    - "ImmutableDict copy"
    - "filter AbstractDict MethodError"
  search_evidence: |
    No exact duplicate issue or PR is known.
lean:
  property: JuliaLean.Proofs.base.abstractdict.FilterCopyNothrowSpec
  theorem: JuliaLean.ChatGPT.Batch4.Group15.DictscovImmutableFilterCopy_refuted
