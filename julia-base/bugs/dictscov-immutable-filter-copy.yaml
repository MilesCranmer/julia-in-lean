    The functio
    copy(PersistentDict(:a => 1)) -> MethodError: no method matching setindex!(::Base.PersistentDict{Symbol, Int64}, ::Int64, ::Symbol)
    The functio
    REPRODUCED dictscov-immutable-filter-copy
reproduced: {release: true, nightly: true}
expected: |
  filter returns a dictionary of the pairs satisfying f (for example an
  ImmutableDict / PersistentDict built with ImmutableDict(d, k => v) /
  PersistentDict(d, k => v)), and copy returns d itself or an equal
  dictionary.
promised_by: |
  filter docstring, base/abstractdict.jl:464: "Return a copy of d,
  removing elements for which f is false." copy docstring (base/array.jl):
  "Create a shallow copy of x".
cause: |
  base/abstractdict.jl:479-488 (filter) and base/abstractdict.jl:197 (copy
  via merge!) assign into empty(d); base/dict.jl:866 and base/dict.jl:1067
  make empty return the immutable type, which defines no setindex!.
possible_fix: |
  Define filter and copy for ImmutableDict and PersistentDict by rebuilding
  with their persistent constructors (copy can return d).
duplicates:
  issues: []
  queries: ["ImmutableDict filter", "ImmutableDict copy", "PersistentDict filter", "filter AbstractDict setindex", "ImmutableDict"]
lean:
  property: JuliaLean.DictsCov.FilterCopyNothrow
  theorem: JuliaLean.DictsCov.filterCopyNothrow_refuted
