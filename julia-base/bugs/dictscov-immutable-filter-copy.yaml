id: dictscov-immutable-filter-copy
title: "filter and copy throw MethodError for ImmutableDict and PersistentDict"
priority: P2
kind: wrong-exception
area: DictsCov
files: [base/abstractdict.jl, base/dict.jl]
functions: ["filter(f, d::AbstractDict)", "copy(a::AbstractDict)", "empty(::ImmutableDict, K, V)", "empty(::PersistentDict, K, V)"]
summary: |
  The generic filter(f, d::AbstractDict) and copy(a::AbstractDict) build
  their result with empty(d) and assign `df[k] = v`. For ImmutableDict and
  PersistentDict, empty(d) is again an ImmutableDict / PersistentDict, which
  has no setindex!, so filter(p -> true, d) and copy(d) throw MethodError for
  every non-empty d. map!(f, values(d)) fails the same way, as expected for
  an immutable dictionary.
likelihood: |
  Any filter or copy of a non-empty ImmutableDict (e.g. the dict of an
  IOContext) or PersistentDict. Both types are internal, so direct use is
  uncommon.
maybe_intended: |
  Both types are immutable and not public (#53982 asks whether
  PersistentDict should be); a MethodError may be considered acceptable.
  But filter is documented to return a copy, not to mutate.
reproducer: |
  filter(p -> true, Base.ImmutableDict(:a => 1))   # MethodError: setindex!
  copy(Base.PersistentDict(:a => 1))               # MethodError: setindex!
output:
