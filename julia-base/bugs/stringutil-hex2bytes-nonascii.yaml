id: stringutil-hex2bytes-nonascii
title: "hex2bytes accepts an overlong UTF-8 encoding of an ASCII hex digit"
priority: P3
kind: wrong-result
area: StringUtil
files: [base/char.jl, base/strings/util.jl]
functions: ["hex2bytes(::AbstractString)", "hex2bytes!(::AbstractArray{UInt8}, ::Any)", "number_from_hex(::Char)"]
summary: |
  On Julia nightly, hex2bytes(SubString(String(UInt8[0xc0, 0xb0, 0x30])))
  returns UInt8[0x00]. The first two bytes are the overlong UTF-8 encoding of
  the ASCII digit '0', so the input is not a sequence of ASCII hex digits.
  Julia 1.13.2 rejects the same input with InvalidCharError.
likelihood: |
  This affects SubString and other generic AbstractString inputs containing
  overlong encodings of ASCII hexadecimal digits. Ordinary String inputs still
  take the specialized byte-validation path and reject multibyte input.
maybe_intended: |
  PR #55152 intentionally made codepoint conversion accept overlong encodings,
  but hex2bytes promises ASCII input and should not treat an overlong byte
  sequence as an ASCII digit.
reproducer: |
  Stored at repro/stringutil-hex2bytes-nonascii.jl. It constructs the bytes
  0xc0 0xb0 0x30, checks the first character's conversion, and calls
  hex2bytes on a SubString. Run with
  `julia repro/stringutil-hex2bytes-nonascii.jl`.
output:
  release: |
    JULIA 1.13.2 COMMIT 45b6d15e34bbd2003a31acce0b1847b63dad029c
    VERSION 1.13.2
    INPUT_CODEUNITS UInt8[0xc0, 0xb0, 0x30]
    ISOVERLONG true ISMALFORMED false
    UInt8(Char) ERROR Base.InvalidCharError{Char} Base.InvalidCharError{Char}('\xc0\xb0')
    hex2bytes(SubString) ERROR Base.InvalidCharError{Char} Base.InvalidCharError{Char}('\xc0\xb0')
  nightly: |
    JULIA 1.15.0-DEV.unknown COMMIT f755f49a9e41380d7da126b3c1db9fe7f83dd027
    VERSION 1.15.0-DEV.unknown
    INPUT_CODEUNITS UInt8[0xc0, 0xb0, 0x30]
    ISOVERLONG true ISMALFORMED false
    UInt8(Char) RESULT 48
    hex2bytes(SubString) RESULT UInt8[0x00]
    REPRODUCED stringutil-hex2bytes-nonascii
reproduced: {release: false, nightly: true}
expected: |
  Reject the overlong encoding because the hex2bytes contract requires ASCII
  hexadecimal codes. The conversion must not return UInt8[0x00].
promised_by: |
  The hex2bytes docstring at base/strings/util.jl:1195-1201 requires an iterable
  of ASCII codes. The comment at base/strings/util.jl:1239 says valid bytes are
  checked in the generic implementation.
cause: |
  PR #55152 changed UInt32(::Char) at base/char.jl:164-166 to accept overlong
  encodings. number_from_hex(::Char) at base/strings/util.jl:1277 converts the
  Char through UInt8 before checking the digit. The overlong encoding of '0'
  therefore becomes 0x30 and is accepted as a hex digit.
possible_fix: |
  Make number_from_hex(::Char) reject any character whose stored encoding is
  not one ASCII byte before converting it to UInt8.
