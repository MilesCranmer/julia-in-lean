id: runtimecov-datatype-fielddesc-type-doc
title: "`Base.datatype_fielddesc_type` returns a 0-3 code, not the entry size in bytes its docstring promises"
priority: P3
kind: documentation
area: RuntimeCov
files: [base/runtime_internals.jl]
functions: ["datatype_fielddesc_type(::DataType)", "datatype_fielddesc_type(::DataTypeLayout)"]
summary: |
  The docstring says the function returns "the size in bytes of each
  field-description entry in the layout array". It returns the two-bit
  `fielddesc_type` code: 0, 1, 2 for entries of `(UInt8, UInt8)`, `(UInt16, UInt16)`,
  `(UInt32, UInt32)` (2, 4, 8 bytes) and 3 for foreign layouts. A struct of two
  `Int64` fields gives 0, although its entries are 2 bytes each.
likelihood: |
  Internal layout API; a caller who trusts the docstring computes field-description
  offsets with a stride of 0 bytes.
maybe_intended: ""
reproducer: |
  struct TwoInts; a::Int64; b::Int64; end
  Base.datatype_fielddesc_type(TwoInts)   # 0
output:
  release: |
    Base.datatype_fielddesc_type(dt::DataType)::Int
    Return the size in bytes of each field-description entry in the layout array,
    located at `(dt.layout + sizeof(DataTypeLayout))`.
    Can be called on any `isconcretetype`.
    datatype_fielddesc_type(TwoInts) = 0
    bytes per field-description entry = 2
    REPRODUCED runtimecov-datatype-fielddesc-type-doc
  nightly: |
    Base.datatype_fielddesc_type(dt::DataType)::Int
    Return the size in bytes of each field-description entry in the layout array,
    located at `(dt.layout + sizeof(DataTypeLayout))`.
    Can be called on any `isconcretetype`.
    datatype_fielddesc_type(TwoInts) = 0
    bytes per field-description entry = 2
    REPRODUCED runtimecov-datatype-fielddesc-type-doc
reproduced: {release: true, nightly: true}
expected: |
  Either a docstring describing the code (0 = 8-bit, 1 = 16-bit, 2 = 32-bit
  offsets, 3 = foreign) or a return value of 2, 4 or 8.
promised_by: |
  base/runtime_internals.jl:744-752 (docstring of `datatype_fielddesc_type`).
cause: |
  base/runtime_internals.jl:753-754 return `(dtl.flags >> 1) & 3`, the code that
  `getindex(::DataTypeFieldDesc, ::Int)` (lines 797-813) dispatches on.
possible_fix: |
  Document the return value as the field-description kind code.
duplicates:
  issues: []
  queries: ["datatype_fielddesc_type"]
lean:
  property: JuliaLean.RuntimeCov.Layout.FielddescTypeDoc
  theorem: JuliaLean.RuntimeCov.Layout.fielddescTypeDoc_refuted
