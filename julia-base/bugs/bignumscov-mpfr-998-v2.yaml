      state: open
      relation: related
      note: Rational/float fix, not a fix for these MPFR methods
  queries:
    - tool: gh search issues --repo JuliaLang/julia
      query: cmp BigFloat
    - tool: gh search issues --repo JuliaLang/julia
      query: cmp isless zero
    - tool: gh search prs --repo JuliaLang/julia
      query: cmp zero
    - tool: gh search prs --repo JuliaLang/julia
      query: cmp BigFloat
lean:
