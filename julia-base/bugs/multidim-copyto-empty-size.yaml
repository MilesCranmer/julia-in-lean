id: multidim-copyto-empty-size
title: "copyto!(dest, Rdest, src, Rsrc) does not check sizes when Rdest is empty"
priority: P3
kind: missing-error
area: Multidim
files: [base/multidimensional.jl]
functions: ["copyto!(dest::AbstractArray, Rdest::CartesianIndices, src::AbstractArray, Rsrc::CartesianIndices)"]
summary: |
  The CartesianIndices method of copyto! returns dest before comparing the region
  sizes when Rdest is empty, so copyto!(dest, CartesianIndices((1:0,)), src,
  CartesianIndices((1:3,))) succeeds silently, while a non-empty Rdest of the wrong
  size, or an empty Rsrc with a non-empty Rdest, throws ArgumentError.
likelihood: |
  Code that computes block regions can produce an empty destination block with a
  wrongly sized source block; the inconsistency hides that bug. Harmless otherwise.
maybe_intended: |
  Copying into an empty region is a no-op, so returning early is arguably fine; but
  the docstring says the sizes must match and the check is asymmetric.
reproducer: |
  dest = zeros(Int, 2); src = [1, 2, 3]
  copyto!(dest, CartesianIndices((1:0,)), src, CartesianIndices((1:3,)))   # returns dest
  copyto!(dest, CartesianIndices((1:1,)), src, CartesianIndices((1:3,)))   # ArgumentError
  copyto!(dest, CartesianIndices((1:2,)), src, CartesianIndices((1:0,)))   # ArgumentError
output:
  release: |
    [0, 0] ArgumentError("source and destination must have same size (got (3,) and (1,))") ArgumentError("source and destination must have same size (got (0,) and (2,))")
    REPRODUCED multidim-copyto-empty-size
  nightly: |
    [0, 0] ArgumentError("source and destination must have same size (got (3,) and (1,))") ArgumentError("source and destination must have same size (got (0,) and (2,))")
    REPRODUCED multidim-copyto-empty-size
reproduced: {release: true, nightly: true}
expected: |
  ArgumentError("source and destination must have same size (got (3,) and (0,))").
promised_by: |
  copyto! docstring, base/multidimensional.jl:1218-1222: "Copy the block of src in
  the range of Rsrc to the block of dest in the range of Rdest. The sizes of the two
  regions must match."
cause: |
  base/multidimensional.jl:1192 `isempty(Rdest) && return dest` runs before the size
  comparison at lines 1193-1195.
possible_fix: |
  Swap the two checks: compare size(Rdest) and size(Rsrc) first, then return early
  for an empty Rdest.
duplicates:
  issues:
    - {number: 45430, state: open, relation: related}
  queries: ["issues: CartesianIndices ==", "issues: copyto! CartesianIndices", "issues: copyto! CartesianIndices empty", "issues: copyto CartesianIndices size", "prs: copyto CartesianIndices"]
lean:
  property: JuliaLean.Multidim.CopytoSizeChecked
  theorem: JuliaLean.Multidim.copytoSizeChecked_refuted
