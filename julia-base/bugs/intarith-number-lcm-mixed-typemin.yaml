id: intarith-number-lcm-mixed-typemin
title: "lcm throws for unsigned-first mixed inputs whose result is representable"
priority: P2
kind: wrong-exception
area: IntArith
files: [base/intfuncs.jl]
functions: ["lcm(::Unsigned, ::Signed)"]
summary: |
  lcm(UInt16(1), typemin(Int8)) throws InexactError even though its result,
  UInt16(128), is representable. Reversing the arguments returns 128.
likelihood: |
  Code combining unsigned sizes with a narrower signed value can reach this
  case when the signed value is typemin. The problem requires mixed types
  and a boundary value; ordinary same-type lcm calls are unaffected.
maybe_intended: |
  Issue #59660 tracks broader typemin error-policy inconsistencies. The
  discussion of PR #59628 explicitly deferred some mixed typemin cases.
  However, the wider unsigned result can represent both magnitudes, and
  the current signed-first method already returns the correct value.
reproducer: |
  a, b = UInt16(1), typemin(Int8)
  forward = try
      lcm(a, b)
  catch e
      e
  end
  reverse = lcm(b, a)
  println("lcm(UInt16(1), typemin(Int8)) = ", forward isa Exception ? nameof(typeof(forward)) : forward)
  println("lcm(typemin(Int8), UInt16(1)) = ", Int(reverse))
  if forward isa InexactError && reverse == UInt16(128)
      println("REPRODUCED intarith-number-lcm-mixed-typemin")
  else
      error("mixed lcm counterexample did not reproduce")
  end
output:
  release: |
    lcm(UInt16(1), typemin(Int8)) = InexactError
    lcm(typemin(Int8), UInt16(1)) = 128
    REPRODUCED intarith-number-lcm-mixed-typemin
  nightly: |
    lcm(UInt16(1), typemin(Int8)) = InexactError
    lcm(typemin(Int8), UInt16(1)) = 128
    REPRODUCED intarith-number-lcm-mixed-typemin
reproduced: {release: true, nightly: true}
expected: |
  Both argument orders should return UInt16(128), the positive least common
  multiple of 1 and -128. The methods are unchanged between Julia 1.13.2
  and master bbfa0ce4150.
promised_by: |
  base/intfuncs.jl:100-104: "Least common (positive) multiple (or zero if
  any argument is zero)." Invariant: swapping two integer inputs cannot
  change whether their representable least common multiple exists.
cause: |
  base/intfuncs.jl:157 takes abs(b) in the original Int8 type before
  promotion. abs(Int8(-128)) remains -128, so conversion to UInt16 throws.
  The signed-first method at lines 146-150,158 first reinterprets the signed
  input at the promoted signed width and then takes abs, obtaining 128.
possible_fix: |
  Make the unsigned-first method call the signed-first mixed-sign method
  with swapped arguments, matching gcd's dispatch at line 155.
duplicates:
  issues:
    - {number: 59660, state: open, relation: related}
    - {number: 59628, state: merged, relation: related}
    - {number: 59678, state: merged, relation: related}
  queries:
    - "issues and PRs: lcm typemin unsigned"
    - "issues and PRs: lcm InexactError"
    - "issues and PRs: lcm signed unsigned"
    - "issues: lcm"
    - "PRs: gcdx"
lean:
  property: JuliaLean.IntArith.NumberTheory.MixedLcmRepresentable
  theorem: JuliaLean.IntArith.NumberTheory.mixedLcmRepresentable_refuted
