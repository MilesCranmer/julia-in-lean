    - "issues: isoverlong"
    - "issues: decode_overlong"
    - 'issues: "malformed Char codepoint"'
    - 'issues: "Char arithmetic malformed"'
    - 'issues: "overlong char"'
    - "PRs: ismalformed"
    - "PRs: isoverlong"
    - "PRs: decode_overlong"
    - 'PRs: "malformed Char codepoint"'
    - 'PRs: "Char arithmetic malformed"'
    - 'PRs: "overlong char"'
lean:
  property: JuliaLean.Proofs.base.char.IsoverlongExactlyOverlong
  theorem: JuliaLean.Proofs.base.char.refute_overlong_encoding
