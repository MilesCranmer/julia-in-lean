id: dictscov-merge-iddict
title: "merge of an IdDict collapses identity-distinct true and 1 keys"
priority: "P2"
kind: "wrong-result"
area: "DictsCov"
files:
  - "base/abstractdict.jl"
functions:
  - "merge(d::AbstractDict, others::AbstractDict...)"
  - "_typeddict(d::AbstractDict, others::AbstractDict...)"
summary: |
  A two-entry IdDict containing true and 1 becomes a one-entry ordinary Dict after merge(d). The input keys differ under === and agree under isequal. The merged result does not retain both identity-distinct keys.
likelihood: |
  An IdDict holds keys distinguished by identity that compare equal by value. A single-argument merge already triggers the loss.
maybe_intended: |
  Returning an ordinary Dict is longstanding and is discussed in open issue #22738. The merge documentation does not explicitly promise preservation of the input key relation, so the desired contract needs maintainer judgment.
reproducer: |
  d = IdDict{Any,Int}(true => 1, 1 => 1)
  m = merge(d)
  @show length(d) length(m) typeof(m)
  @show true === 1 isequal(true, 1)
output:
  release: |
    REPRODUCED dictscov-merge-iddict
  nightly: |
    REPRODUCED dictscov-merge-iddict
reproduced:
  release: true
  nightly: true
expected: |
  A merge preserving IdDict identity semantics would keep both entries. If conversion to Dict is intended, document the possible loss of identity-distinct keys.
promised_by: |
  base/abstractdict.jl:328-334 @ f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  "Construct a merged collection from the given collections. If necessary, the"
  "types of the resulting collection will be promoted to accommodate the types of"
  "the merged collections. If the same key is present in another collection, the"
  "value for that key will be the value it has in the last collection listed."
  This wording does not explicitly guarantee preservation of identity key semantics.
cause: |
  base/abstractdict.jl:361-362 calls _typeddict. Lines 413-417 always construct Dict{K,V}(d), changing the key relation from identity to isequal before merging.
possible_fix: |
  Preserve the first dictionary key relation when constructing the result, or explicitly document conversion and possible key collapse.
duplicates:
  issues:
    - number: 22738
      state: open
      relation: related
  prs: []
  queries:
    - "merge IdDict"
    - "merge identity dictionary"
    - "_typeddict IdDict"
  search_evidence: |
    Issue 22738 discusses the same result-container design without this key-loss case. Merged PR 40893 improves mutating mergewith! performance and is related, not a fix for nonmutating merge.
lean:
  property: JuliaLean.Proofs.base.abstractdict.MergeKeepsIdKeysSpec
  theorem: JuliaLean.ChatGPT.Batch4.Group15.DictscovMergeIddict_refuted
