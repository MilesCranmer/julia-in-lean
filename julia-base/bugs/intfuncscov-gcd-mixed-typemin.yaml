id: intfuncscov-gcd-mixed-typemin
title: "gcd, lcm and gcdx of typemin(Signed) and a same-width Unsigned throw InexactError"
priority: P2
kind: wrong-exception
area: IntFuncsCov
files: [base/intfuncs.jl]
functions: ["_promote_mixed_signs", "gcd(::Signed, ::Unsigned)", "gcd(::Unsigned, ::Signed)", "lcm(::Signed, ::Unsigned)", "gcdx(::Signed, ::Unsigned)", "gcdx(::Unsigned, ::Signed)"]
summary: |
  gcd(typemin(Int), UInt(2)), gcd(UInt(2), typemin(Int)), lcm(typemin(Int), UInt(1)) and
  gcdx(typemin(Int), UInt(2)) all throw InexactError, although the results 2, 2,
  2^63 and 2 are representable in the promoted type UInt64. The same happens for every
  signed width paired with the unsigned type of the same width (Int8/UInt8, ...). With a
  wider unsigned argument (gcd(typemin(Int64), UInt128(2))) or a narrower one the call
  succeeds.
likelihood: |
  Requires mixing a signed typemin with an unsigned value of the same width. Uncommon but
  reachable, for example when combining hashes or bit patterns stored as UInt with
  signed offsets.
maybe_intended: |
  Issue #59660 (open) collects typemin inconsistencies across gcd, gcdx and lcm after
  PRs #59628 and #59678, and says the rule "cannot be typemin signed" should be
  documented. The comment in _promote_mixed_signs says it handles the typemin case, and
  the promoted unsigned type can hold |typemin|, so the error is not the documented
  result.
reproducer: |
  res(f) = try f() catch e; nameof(typeof(e)) end
  a, b = typemin(Int), UInt(2)
  g1 = res(() -> gcd(a, b))
  g2 = res(() -> gcd(b, a))
  l1 = res(() -> lcm(a, UInt(1)))
  x1 = res(() -> gcdx(a, b))
  println("gcd(typemin(Int), UInt(2)) = ", g1)
  println("gcd(UInt(2), typemin(Int)) = ", g2)
  println("lcm(typemin(Int), UInt(1)) = ", l1)
  println("gcdx(typemin(Int), UInt(2)) = ", x1)
  println("gcd(typemin(Int), 2) = ", gcd(typemin(Int), 2))
  println("gcd(typemin(Int64), UInt32(2)) = ", gcd(typemin(Int64), UInt32(2)))
  if g1 === :InexactError && g2 === :InexactError && l1 === :InexactError && x1 === :InexactError
      println("REPRODUCED intfuncscov-gcd-mixed-typemin")
  else
      println("not reproduced")
  end
output:
  release: |
    gcd(typemin(Int), UInt(2)) = InexactError
    gcd(UInt(2), typemin(Int)) = InexactError
    lcm(typemin(Int), UInt(1)) = InexactError
    gcdx(typemin(Int), UInt(2)) = InexactError
    gcd(typemin(Int), 2) = 2
    gcd(typemin(Int64), UInt32(2)) = 2
    REPRODUCED intfuncscov-gcd-mixed-typemin
  nightly: |
    gcd(typemin(Int), UInt(2)) = InexactError
    gcd(UInt(2), typemin(Int)) = InexactError
    lcm(typemin(Int), UInt(1)) = InexactError
    gcdx(typemin(Int), UInt(2)) = InexactError
    gcd(typemin(Int), 2) = 2
    gcd(typemin(Int64), UInt32(2)) = 2
    REPRODUCED intfuncscov-gcd-mixed-typemin
reproduced: {release: true, nightly: true}
expected: |
  UInt(2), UInt(2), UInt(2)^63 and (UInt(2), u, v) with a valid Bezout pair, all
  representable in UInt64.
promised_by: |
  base/intfuncs.jl:8 and :100: "Greatest common (positive) divisor" and "Least common
  (positive) multiple"; gcdx (base/intfuncs.jl:192-198) returns gcd(a, b). The comment at
  base/intfuncs.jl:147 says the helper handles a == typemin.
cause: |
  base/intfuncs.jl:149 (and :278 in gcdx) computes abs(a % signed(R)). When R is the
  unsigned type of the same width as a, signed(R) is typeof(a), so abs(typemin) is still
  typemin, and promote converts that negative value to R, which throws InexactError.
possible_fix: |
  Use unsigned(abs(a % signed(R))) % R (or uabs(a) % R), which maps typemin to 2^(n-1),
  before promoting.
duplicates:
  issues:
    - {number: 59660, state: open, relation: duplicate}
  queries: ["gcd typemin", "gcd InexactError", "gcd unsigned signed", "gcd typemin unsigned", "_promote_mixed_signs"]
lean:
  property: JuliaLean.IntFuncsCov.Gcd.MixedTypeminRepresentable
  theorem: JuliaLean.IntFuncsCov.Gcd.mixedTypeminRepresentable_refuted
