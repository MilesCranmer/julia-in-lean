id: iterators-partition-range-overflow
title: Iterators.partition returns an empty first chunk near typemax(Int)
priority: P2
kind: wrong-result
area: Iterators
files:
  - base/iterators.jl
  - base/array.jl
functions:
  - iterate(::PartitionIterator{<:AbstractRange})
  - iterate(::PartitionIterator{<:AbstractArray})
summary: |
  Partitioning the one-element IdentityUnitRange(typemax(Int):typemax(Int))
  into chunks of size 2 returns an empty first chunk. Its next state wraps to
  typemin(Int)+1 instead of representing completion. The chunk endpoint uses
  wrapping addition before clamping to the input's last index.
likelihood: |
  Requires indices near typemax(Int), which can occur with IdentityUnitRange or
  offset-indexed inputs. The lazy input in the reproducer contains one element.
  Incorrect termination can also invalidate collection code's length
  assumptions.
maybe_intended: |
  Integer arithmetic wraps in Julia, but partition promises chunks of the
  collection's elements. Wrapping internal index arithmetic should not turn
  a valid one-element input into an empty chunk or a continuing iterator.
reproducer: |
  hi = typemax(Int)
  r = Base.IdentityUnitRange(hi:hi)
  chunk, state = iterate(Iterators.partition(r, 2))
  @assert isempty(chunk)
  @assert first(chunk) == hi && last(chunk) == hi - 1
  @assert state == typemin(Int) + 1
  println("REPRODUCED iterators-partition-range-overflow")
output:
  release: |
    REPRODUCED iterators-partition-range-overflow
  nightly: |
    REPRODUCED iterators-partition-range-overflow
reproduced:
  release: true
  nightly: true
expected: |
  The first chunk should contain the sole element typemax(Int), and the next
  iterate call should return nothing. The reproducer deliberately avoids collect
  and checks only the first malformed chunk and wrapped next state.
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  base/iterators.jl:1426: "Iterate over a collection `n` elements at a time."
  base/essentials.jl:1606-1607: "Advance the iterator to obtain the next element. If no elements
  remain, `nothing` should be returned."
cause: |
  base/iterators.jl:1472 computes min(state + itr.n - 1, lastindex(itr.c)).
  With state=typemax(Int) and n=2, the unclamped endpoint wraps. At line 1473,
  the range slice becomes empty and r+1 becomes typemin(Int)+1. The array
  specialization at lines 1478-1479 uses the same arithmetic. Continued
  iteration may yield more chunks than length advertises; collecting this
  malformed iterator is unsafe and is not exercised by the safe reproducer.
possible_fix: |
  Compute the endpoint using the remaining distance without overflowing.
  Represent terminal iteration separately so advancing past typemax(Int)
  does not wrap the next state back into the valid-index test.
duplicates:
  issues: []
  prs:
    - number: 40830
      state: merged
      relation: related
      note: "introduced the non-1-based endpoint arithmetic in the failing path"
  search_notes: |
    No direct duplicate is known. PR #40830 adds IdentityUnitRange support
    using the same endpoint calculation; its tests use ordinary indices, not
    typemax(Int).
  queries:
    - partition overflow
    - partition typemax
    - partition range segfault
    - Iterators.partition overflow
    - partition IdentityUnitRange
lean:
  property: JuliaLean.Proofs.base.iterators.PartitionRangeChunks
  theorem: JuliaLean.ChatGPT.Batch4.Group5.IteratorsPartitionRangeOverflow_refuted
