id: iterators-cycle-empty-length
title: take of an empty cycle reports a positive length while yielding nothing
priority: P1
kind: wrong-result
area: Iterators
files:
  - base/iterators.jl
  - base/array.jl
functions:
  - IteratorSize(::Type{Cycle})
  - length(::Take)
  - first(itr, n)
  - length(::Zip)
summary: |
  length(take(cycle(Int[]), 3)) returns 3, but iterate on the same prefix
  immediately returns nothing. Cycle always advertises IsInfinite, even when
  its input is empty. Take and zip trust that trait when computing lengths.
  Collection code can consequently allocate entries that iteration never fills.
likelihood: |
  Cycling a possibly empty input and taking a finite prefix is ordinary code.
  The incorrect length can affect allocation and leave result entries unfilled.
maybe_intended: |
  The source itself marks the IsInfinite trait as false when the iterator
  becomes empty. Issue #53169 reports the exact trait mismatch; open PR #54187
  proposes changing it. Issue #43235 reports uninitialized collection entries
  for the related stateful-cycle case.
reproducer: |
  prefix = Iterators.take(Iterators.cycle(Int[]), 3)
  @assert length(prefix) == 3
  @assert iterate(prefix) === nothing
  println("REPRODUCED iterators-cycle-empty-length")
output:
  release: |
    REPRODUCED iterators-cycle-empty-length
  nightly: |
    REPRODUCED iterators-cycle-empty-length
reproduced:
  release: true
  nightly: true
expected: |
  The empty prefix should have length 0. Collection should return an empty
  result. The safe reproducer checks the length mismatch without collecting it.
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  base/iterators.jl:1032: "When `iter` is empty, so are `cycle(iter)` and `cycle(iter, n)`."
  base/generator.jl:79: "* `IsInfinite()` if the iterator yields values forever."
  base/abstractarray.jl:285: "Return the number of elements in the collection."
cause: |
  base/iterators.jl:1063 assigns IsInfinite() to every Cycle type. At line 823,
  length(::Take) delegates to _min_length, whose IsInfinite case at line 60
  returns the finite bound without inspecting the cycle's contents.
possible_fix: |
  Correct the Cycle size trait so wrappers do not infer a positive length for
  empty cycles. PR #54187 proposes such a trait change; preserve the documented
  empty-cycle behavior and account for stateful inputs that can become empty.
duplicates:
