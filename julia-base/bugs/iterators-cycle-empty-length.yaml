id: iterators-cycle-empty-length
title: first(Iterators.cycle(Int[]), 3) returns 3 uninitialised elements
priority: P1
kind: wrong-result
area: Iterators
files:
- base/iterators.jl
- base/array.jl
functions:
- IteratorSize(::Type{Cycle})
- length(::Take)
- first(itr, n)
- length(::Zip)
summary: |
  IteratorSize(Cycle) is IsInfinite even for an empty iterator, which the
  cycle docstring says yields nothing. Wrappers then report lengths that are
  never produced: length(take(cycle(Int[]), 3)) == 3 and
  length(zip(cycle(Int[]), 1:3)) == 3, and collect allocates that many slots
  and fills none, so first(cycle(Int[]), 3) returns three garbage Ints and
  first(cycle(String[]), 2) two #undef entries.
likelihood: |
  Cycling a possibly empty collection and taking a prefix is ordinary code;
  the result is silently wrong (uninitialised memory).
maybe_intended: ''
reproducer: |
  # cycle(v) claims IsInfinite even for empty v, so take/zip report lengths that are never produced
  v = Int[]
  t = Iterators.take(Iterators.cycle(v), 3)
  n = 0
  for _ in t
      global n += 1
  end
  println("length(take(cycle(Int[]), 3)) = ", length(t), ", elements yielded = ", n)
  f = first(Iterators.cycle(v), 3)
  println("first(cycle(Int[]), 3) has length ", length(f))
  s = first(Iterators.cycle(String[]), 2)
  println("first(cycle(String[]), 2) = ", repr(s))
  z = collect(zip(Iterators.cycle(v), 1:3))
  println("length(collect(zip(cycle(Int[]), 1:3))) = ", length(z))
  if length(t) == 3 && n == 0 && length(f) == 3 && length(s) == 2 && !isassigned(s, 1) && length(z) == 3
      println("REPRODUCED iterators-cycle-empty-length")
  end
output:
  release: |
    length(take(cycle(Int[]), 3)) = 3, elements yielded = 0
    first(cycle(Int[]), 3) has length 3
    first(cycle(String[]), 2) = [#undef, #undef]
    length(collect(zip(cycle(Int[]), 1:3))) = 3
    REPRODUCED iterators-cycle-empty-length
  nightly: |
    length(take(cycle(Int[]), 3)) = 3, elements yielded = 0
    first(cycle(Int[]), 3) has length 3
    first(cycle(String[]), 2) = [#undef, #undef]
    length(collect(zip(cycle(Int[]), 1:3))) = 3
    REPRODUCED iterators-cycle-empty-length
reproduced:
  release: true
  nightly: true
expected: |
  first(cycle(Int[]), 3) == Int[] and collect(zip(cycle(Int[]), 1:3)) == [].
promised_by: |
  cycle docstring, base/iterators.jl:1028-1032: "When iter is empty, so are
  cycle(iter) and cycle(iter, n)". IteratorSize docstring, base/generator.jl:79:
  IsInfinite() "if the iterator yields values forever".
cause: |
  base/iterators.jl:1063 (with the comment "XXX: this is false if iterator ever
  becomes empty"). length(::Take) (line 823 and 60) then returns n, and
  _collect (base/array.jl:777-778) copies into a vector of that length.
possible_fix: |
  Make IteratorSize(Cycle) depend on the wrapped iterator (as open PR #54187
  does), or have take/zip lengths of a Cycle check isempty.
duplicates:
  issues:
  - number: 53169
    state: open
    relation: duplicate
  - number: 43235
    state: open
    relation: related
  - number: 54187
    state: open
    relation: related
  queries:
  - cycle empty
  - cycle IsInfinite
  - IteratorSize Cycle
  - take cycle empty
  - 'XXX: this is false if iterator ever becomes empty'
lean:
  property: JuliaLean.Iterators.CycleFirstN
  theorem: JuliaLean.Iterators.cycleFirstN_refuted
