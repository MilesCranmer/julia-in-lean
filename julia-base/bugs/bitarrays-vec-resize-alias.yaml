id: bitarrays-vec-resize-alias
title: Resizing vec(M) corrupts BitArray padding and can remove required storage
priority: P0
kind: crash
area: BitArrays
files:
  - base/bitarray.jl
functions:
  - reshape(::BitArray, dims)
  - vec(::BitArray)
  - push!(::BitVector, x)
  - pop!(::BitVector)
summary: |
  Starting with a 2-by-2 all-false BitMatrix, push!(vec(M), true) leaves its
  four logical elements false but sets a bit beyond its logical extent.
  count(M) becomes 1, any(M) becomes true, and equality with a fresh all-false
  matrix becomes false. Converting both matrices to ordinary arrays still
  produces equal arrays.
  Shrinking an alias can also remove a chunk that its parent still needs.
  Issue #64147 documents a 65-element parent left with only one 64-bit chunk
  after pop!(vec(parent)); accessing its final logical element then reads
  beyond that chunk vector unless forced bounds checking catches the access.
likelihood: |
  Requires resizing a vector returned by vec or reshape while retaining its
  parent BitArray. Growth can corrupt packed reductions and equality; shrinkage
  across a chunk boundary can leave subsequent parent accesses without enough
  storage. Both cases use ordinary small arrays and public calls.
maybe_intended: |
  Reshaping shares element storage, so changes to shared logical elements are
  expected. The added vector element is outside the parent's logical extent.
  Setting the parent's padding violates the explicit packed-storage invariant
  on which its reductions and equality depend.
reproducer: |
  M = falses(2, 2)
  push!(vec(M), true)
  expected = falses(2, 2)
  actual = (count(M), M == expected, any(M), Array(M) == Array(expected))
  println(repr(actual))
  @assert actual == (1, false, true, true)
output:
  release: |
    (1, false, true, true)
    REPRODUCED bitarrays-vec-resize-alias
  nightly: |
    (1, false, true, true)
    REPRODUCED bitarrays-vec-resize-alias
reproduced:
  release: true
  nightly: true
expected: |
  Resizing the reshaped vector should preserve the parent's storage invariant,
  including its required chunk count, or reject the resize. Since every logical
  element of the growth example remains false, count(M) should be 0, any(M)
  false, and M equal to the fresh matrix.
  This runtime reproducer tests padding corruption only; it does not execute
  out-of-bounds accesses after shrinking an alias.
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027.
  base/bitarray.jl:8: "BitArray{N} <: AbstractArray{Bool, N}"
  base/bitarray.jl:10: "Space-efficient `N`-dimensional boolean array, using just one bit for each boolean value."
  base/bitarray.jl:5-6: "# notes: bits are stored in contiguous chunks
  #        unused bits must always be set to 0"
  The final quote is an implementation invariant, rather than a public
  guarantee that resizing an alias is independently supported.
cause: |
  _bitreshape assigns Br.chunks = B.chunks at base/bitarray.jl:481, while each
  BitArray retains its own len. push! increments only the vector's length and
  writes its new true bit at lines 750-752. For the parent's shorter length,
  that bit is padding. any scans complete chunks at lines 1736-1744 and sees it.
  pop! at base/bitarray.jl:831-841 calls _deleteend!(B.chunks, 1) when the
  vector's old length is one past a chunk boundary, then decrements only that
  vector's len. The shared parent keeps its longer extent but loses the chunk.
possible_fix: |
  Track shared packed storage and prevent structural mutation from violating
  another header's length or padding invariant. Reject unsupported alias
  resizes, or detach the resized vector's storage before changing its extent.
  Masking only one reduction would leave the storage invariant broken.
