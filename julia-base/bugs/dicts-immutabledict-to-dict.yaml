id: dicts-immutabledict-to-dict
title: Converting an ImmutableDict restores shadowed values
priority: P2
kind: wrong-result
area: Dicts
files:
  - base/dict.jl
  - base/abstractdict.jl
functions:
  - Dict(::ImmutableDict)
  - Dict{K,V}(::ImmutableDict)
  - merge(::ImmutableDict, ::AbstractDict)
  - merge!(::Dict, ::ImmutableDict)
summary: |
  An ImmutableDict containing :a => 1 followed by :a => 2 returns 2 for d[:a].
  Dict(d) and merge(d, Dict(:b => 3)) instead retain 1 for :a. The generic
  constructors consume the reverse insertion-order iterator, including
  shadowed pairs, so the oldest value overwrites the newest one.
likelihood: |
  Requires repeated keys in an ImmutableDict. Nested IOContext properties
  provide a concrete case: io[:compact] can be true while
  Dict(io.dict)[:compact] is false. The conversion silently changes the lookup.
maybe_intended: |
  ImmutableDict explicitly documents reverse iteration with duplicate keys,
  and Dict documents consuming the iterable's pairs. Those individual rules
  explain the result, so preservation of d[key] is stronger than the literal
  constructor contract. However, the source itself warns against using this
  iterator for merge/copy/filter, and issue #64139 reports this exact mismatch.
  Related closed PR #59957 changes ImmutableDict length storage, rather than
  conversion ordering.
reproducer: |
  d = Base.ImmutableDict(:a => 1, :a => 2)
  @assert d[:a] == 2
  @assert Dict(d)[:a] == 1
  @assert Dict{Symbol,Int}(d)[:a] == 1
  @assert merge(d, Dict(:b => 3))[:a] == 1
output:
  release: |
    d[:a] = 2; collect(d) = [:a => 2, :a => 1]
    Dict(d) = Dict(:a => 1); merge(d, Dict(:b => 3)) = Dict(:a => 1, :b => 3)
    io[:compact] = true; Dict(io.dict)[:compact] = false
    REPRODUCED dicts-immutabledict-to-dict
  nightly: |
    d[:a] = 2; collect(d) = [:a => 2, :a => 1]
    Dict(d) = Dict(:a => 1); merge(d, Dict(:b => 3)) = Dict(:a => 1, :b => 3)
    io[:compact] = true; Dict(io.dict)[:compact] = false
    REPRODUCED dicts-immutabledict-to-dict
reproduced:
  release: true
  nightly: true
expected: |
  Dictionary conversion and merging should preserve the source's current
  lookup value, giving :a => 2. At minimum, document the distinction between
  converting its historical pair stream and copying its current mappings.
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027.
  base/dict.jl:791-792: "key may be added. Calling `getindex` will return the most recent value for a
  particular key, but iterating will show all `key => value` pairs."
  base/dict.jl:797-799: "- Iterate over `dict` to see all `key => value` pairs, including duplicate keys.
  Iteration is in reverse order, from most recently added to least recently
  added."
  base/dict.jl:37-38: "Given a single iterable argument, constructs a [`Dict`](@ref) whose key-value pairs
  are taken from 2-tuples `(key,value)` generated by the argument."
  base/dict.jl:859: "# this actually defines reverse iteration (e.g. it should not be used for merge/copy/filter type operations)"
  base/abstractdict.jl:330: "Construct a merged collection from the given collections. If necessary, the"
  Preserving the lookup value is an expectation here, rather than an explicit
  exception to the constructor's iterable semantics in these docstrings.
cause: |
  base/dict.jl:860-863 yields newest pairs first without removing duplicates.
  Dict{K,V}(kv) assigns each pair at lines 94-96, and merge! does the same at
  base/abstractdict.jl:229-231. The final assignment for a repeated key is its
  oldest value.
possible_fix: |
  Specialize conversion and merging for ImmutableDict to retain only the first
  occurrence of each key. Preserve the documented historical iterator unless
  its public contract is deliberately changed.
