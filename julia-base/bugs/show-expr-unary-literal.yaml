id: show-expr-unary-literal
title: "Expr printing turns -(1) into the literal -1 and -(-1) into unparseable --1"
priority: P3
kind: wrong-result
area: Show
files: [base/show.jl]
functions: ["show_unquoted(::IO, ::Expr, ::Int, ::Int)"]
summary: |
  string(Meta.parse("-(1)")) == "-1", which parses to the Int literal -1 instead of
  Expr(:call, :-, 1); string(Meta.parse("-(-1)")) == "--1", which is a ParseError. The
  same loss happens inside larger expressions (f(-(1)), [-(1) 2], x^-(1), -(1)//2).
likelihood: |
  Macro-generated code commonly builds Expr(:call, :-, x) with numeric x; printing it
  (error messages, @show, code generation via string) then reparses differently.
maybe_intended: |
  The evaluated value of -1 and -(1) agree, so only the AST shape changes for -(1);
  -(-1) is a hard failure.
reproducer: |
  ex = Meta.parse("-(1)")             # Expr(:call, :-, 1)
  s = string(ex)
  println("string(Meta.parse(\"-(1)\")) = ", repr(s))
  back = Meta.parse(s)
  println("Meta.parse of that = ", repr(back), " :: ", typeof(back))
  ex2 = Meta.parse("-(-1)")           # Expr(:call, :-, -1)
  s2 = string(ex2)
  println("string(Meta.parse(\"-(-1)\")) = ", repr(s2))
  back2 = try Meta.parse(s2) catch err; err end
  println("Meta.parse of that = ", back2 isa Exception ? typeof(back2) : repr(back2))
  (back != ex || back2 != ex2) && println("REPRODUCED show-expr-unary-literal")
output:
  release: |
    string(Meta.parse("-(1)")) = "-1"
    Meta.parse of that = -1 :: Int64
    string(Meta.parse("-(-1)")) = "--1"
    Meta.parse of that = Base.Meta.ParseError
    REPRODUCED show-expr-unary-literal
  nightly: |
    string(Meta.parse("-(1)")) = "-1"
    Meta.parse of that = -1 :: Int64
    string(Meta.parse("-(-1)")) = "--1"
    Meta.parse of that = Base.Meta.ParseError
    REPRODUCED show-expr-unary-literal
reproduced: {release: true, nightly: true}
expected: |
  "-(1)" and "-(-1)", which reparse to the original Exprs.
promised_by: |
  base/show.jl:1636-1640: "AST printing should follow two rules: 1. Meta.parse(string(ex))
  == ex ...".
cause: |
  base/show.jl:2194-2201: the unary-operator branch prints a non-Expr argument with
  show_unquoted directly after the operator, so a numeric literal is glued to the sign;
  the parser then folds -1 into a signed literal (JuliaSyntax/src/julia/parser.jl:1235-1259)
  or lexes -- as an invalid operator.
possible_fix: |
  Parenthesize the argument when it is a Real literal (or a negative one): print -(1).
duplicates:
  issues:
    - {number: 49494, state: open, relation: related}
  queries:
    - "issues: show unary minus literal"
    - "issues: print Expr negative literal"
    - "issues: unary minus show_unquoted"
    - "issues: show Expr call minus number"
    - "issues: printing negative number expression"
    - "issues: printing Expr"
    - "prs: show unary minus literal"
    - "prs: Expr literal minus print"
    - "issues: show_unquoted"
    - "issues: deparse"
    - "issues: printing Expr precedence"
    - "issues: string Meta.parse roundtrip"
    - "issues: Expr printing"
lean:
  property: JuliaLean.Show.UnaryCallReparses
  theorem: JuliaLean.Show.unaryCallReparses_refuted
