id: missingchar-show-char-roundtrip
title: "show(Char(0x110000)) prints '\\U110000', which the parser rejects"
priority: P3
kind: wrong-result
area: MissingChar
files: [base/char.jl, JuliaSyntax/src/julia/literal_parsing.jl]
functions: ["show(::IO, ::AbstractChar)"]
summary: |
  Well-formed Chars with codepoints 0x110000 to 0x1fffff (for example
  '\U10ffff' + 1) are shown as '\U110000' ... '\U1fffff', but the parser only
  accepts \U escapes up to 0x10ffff, so Meta.parse(repr(c)) throws ParseError.
  The same Char parses fine when written as its bytes, '\xf4\x90\x80\x80'.
  The ismalformed docstring itself writes this unparseable literal.
likelihood: |
  Low to moderate: besides arithmetic or conversion past U+10FFFF, ordinary
  iteration of invalid UTF-8 yields such Chars: first("\xf4\x90\x80\x80") is the
  well-formed Char with codepoint 0x110000 and prints as '\U110000' (checked on
  1.13.2 and nightly). escape_string has the same \U problem for such strings
  (bugs/show-escape-above-unicode.yaml).
maybe_intended: ""
reproducer: |
  c = Char(0x110000)
  s = repr(c)
  println("c = Char(0x110000): ismalformed = ", Base.ismalformed(c), ", codepoint = ", repr(codepoint(c)))
  println("repr(c) = ", s)
  r = try repr(eval(Meta.parse(s))) catch e; "THROWS " * first(split(sprint(showerror, e), '\n')) end
  println("eval(Meta.parse(repr(c))) = ", r)
  println("Meta.parse(\"'\\\\xf4\\\\x90\\\\x80\\\\x80'\") == c: ", eval(Meta.parse("'\\xf4\\x90\\x80\\x80'")) == c)
  startswith(r, "THROWS") && println("REPRODUCED missingchar-show-char-roundtrip")
output:
  release: |
    c = Char(0x110000): ismalformed = false, codepoint = 0x00110000
    repr(c) = '\U110000'
    eval(Meta.parse(repr(c))) = THROWS ParseError:
    Meta.parse("'\\xf4\\x90\\x80\\x80'") == c: true
    REPRODUCED missingchar-show-char-roundtrip
  nightly: |
    c = Char(0x110000): ismalformed = false, codepoint = 0x00110000
    repr(c) = '\U110000'
    eval(Meta.parse(repr(c))) = THROWS ParseError:
    Meta.parse("'\\xf4\\x90\\x80\\x80'") == c: true
    REPRODUCED missingchar-show-char-roundtrip
reproduced: {release: true, nightly: true}
expected: |
  repr(c) is a literal that parses back to c, e.g. '\xf4\x90\x80\x80'.
promised_by: |
  The show docstring (base/show.jl): the representation "should be parseable
  Julia code when possible"; overlong and malformed Chars already use \x byte
  escapes for this reason (base/char.jl:313-323, 354-355).
cause: |
  base/char.jl:360-367 writes \U plus the hex codepoint for every well-formed,
  non-overlong, non-printable Char, including codepoints above 0x10ffff;
  JuliaSyntax/src/julia/literal_parsing.jl:269-273 reports "invalid unicode
  escape sequence" when n > 0x10ffff.
possible_fix: |
  In show, use show_invalid (\x byte escapes) when codepoint(c) > 0x10ffff.
duplicates:
  issues:
    - {number: 54396, state: open, relation: duplicate}
    - {number: 1988, state: closed, relation: related}
  queries:
    - "issues: U110000"
    - "issues: show char invalid escape"
lean:
  property: JuliaLean.MissingChar.ShowCharParses
  theorem: JuliaLean.MissingChar.showCharParses_refuted
