id: broadcastviews-shape-mixed-singleton
title: "Broadcast.broadcast_shape((3,), (Base.OneTo(1),)) throws although OneTo(1) is a singleton"
priority: P3
kind: wrong-exception
area: BroadcastViews
files: [base/broadcast.jl]
functions: ["Base.Broadcast.broadcast_shape", "Base.Broadcast._bcs1(::Integer, ::Any)"]
summary: |
  `_bcs1` accepts a singleton on either side when both shape entries are integers
  (`broadcast_shape((3,), (1,)) == (3,)`) or both are axes
  (`broadcast_shape((OneTo(3),), (OneTo(1),)) == (OneTo(3),)`), and accepts an integer 1
  against an axis. But an integer extent against a singleton axis throws
  DimensionMismatch: `broadcast_shape((3,), (Base.OneTo(1),))` and the swapped order.
  The error message even says "got a dimension with lengths 3 and 1".
likelihood: |
  Only direct calls of the internal (documented but unexported) `Broadcast.broadcast_shape` that mix size
  tuples with axis tuples reach this; ordinary broadcasting combines axes only.
maybe_intended: |
  The broadcast_shape docstring speaks of "axes (size Tuples)" and its examples use
  only integer sizes, so mixing the two forms may not be supported; the mixed method
  exists, though, and handles the integer-1 case.
reproducer: |
  f(a, b) = try Broadcast.broadcast_shape(a, b) catch e; e end
  println("broadcast_shape((3,), (1,)) = ", f((3,), (1,)))
  println("broadcast_shape((Base.OneTo(3),), (Base.OneTo(1),)) = ", f((Base.OneTo(3),), (Base.OneTo(1),)))
  println("broadcast_shape((1,), (Base.OneTo(3),)) = ", f((1,), (Base.OneTo(3),)))
  r = f((3,), (Base.OneTo(1),))
  println("broadcast_shape((3,), (Base.OneTo(1),)) = ", r)
  if r isa DimensionMismatch
      println("REPRODUCED broadcastviews-shape-mixed-singleton")
  end
output:
  release: |
    broadcast_shape((3,), (1,)) = (3,)
    broadcast_shape((Base.OneTo(3),), (Base.OneTo(1),)) = (Base.OneTo(3),)
    broadcast_shape((1,), (Base.OneTo(3),)) = (Base.OneTo(3),)
    broadcast_shape((3,), (Base.OneTo(1),)) = DimensionMismatch("arrays could not be broadcast to a common size; got a dimension with lengths 3 and 1")
    REPRODUCED broadcastviews-shape-mixed-singleton
  nightly: |
    broadcast_shape((3,), (1,)) = (3,)
    broadcast_shape((Base.OneTo(3),), (Base.OneTo(1),)) = (Base.OneTo(3),)
    broadcast_shape((1,), (Base.OneTo(3),)) = (Base.OneTo(3),)
    broadcast_shape((3,), (Base.OneTo(1),)) = DimensionMismatch("arrays could not be broadcast to a common size; got a dimension with lengths 3 and 1")
    REPRODUCED broadcastviews-shape-mixed-singleton
reproduced: {release: true, nightly: true}
expected: |
  (3,) (or an axis of length 3), as for (3,) with (1,).
promised_by: |
  base/broadcast.jl:506-509 (broadcast_shape docstring: determine the result axes for
  broadcasting across all inputs); singleton extents broadcast against any extent
  (_bcs1 for integers, line 531, and for axes via _bcsm, line 536).
cause: |
  base/broadcast.jl:532: `_bcs1(a::Integer, b) = a == 1 ? b : (first(b) == 1 && last(b) == a ? b : throw(...))`
  never checks `length(b) == 1`, unlike `_bcsm` (line 536) used for two axes.
possible_fix: |
  Add the singleton case: `length(b) == 1 ? a : ...` before throwing.
duplicates:
  issues:
    - {number: 45921, state: closed, relation: related}
  queries: ["broadcast_shape OneTo", "broadcast_shape integer axes", "broadcast_shape"]
lean:
  property: JuliaLean.BroadcastViews.ShapeMixedSingleton
  theorem: JuliaLean.BroadcastViews.shapeMixedSingleton_refuted
