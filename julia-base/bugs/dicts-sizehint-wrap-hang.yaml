id: dicts-sizehint-wrap-hang
title: sizehint!(::Dict, n) hangs when capacity arithmetic wraps
priority: P2
kind: hang
area: Dicts
files:
  - base/dict.jl
  - base/abstractdict.jl
  - base/array.jl
functions:
  - sizehint!(::Dict, ::Integer)
  - rehash!(::Dict, newsz)
summary: |
  On a 64-bit runtime, sizehint!(d, 2^62) computes 3 * 2^62 in Int
  arithmetic. The product wraps negative and the requested table size becomes
  16 slots. With 17 existing entries, rehash! fills all slots and then loops
  forever looking for an empty slot for the remaining entry.
likelihood: |
  Requires an extremely large size hint and an existing dictionary with more
  than 16 entries. A forwarded user hint or large sentinel can trigger it
  without a large allocation. Ordinary small hints do not trigger this case.
maybe_intended: |
  A capacity hint may be ignored or rejected when it cannot be satisfied.
  The documented hint does not justify shrinking below the existing entry
  count and entering an unbounded probe loop.
reproducer: |
  d = Dict(i => i for i in 1:17)
  sizehint!(d, 2^62)  # Does not return on the tested 64-bit runtimes.
output:
  release: |
    3n = -4611686018427387904, table size requested = 16
    sizehint!(Dict with 17 entries, 2^62): still running after 30 s
    REPRODUCED dicts-sizehint-wrap-hang
  nightly: |
    3n = -4611686018427387904, table size requested = 16
    sizehint!(Dict with 17 entries, 2^62): still running after 30 s
    REPRODUCED dicts-sizehint-wrap-hang
reproduced:
  release: true
  nightly: true
expected: |
  Return with all pairs preserved, or reject the unsatisfiable hint rather
  than looping. The reproducer above hangs at its final call; the recorded
  output was produced under a timeout.
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027.
  base/array.jl:1577: "sizehint!(s, n; first::Bool=false, shrink::Bool=true) -> s"
  base/array.jl:1579: "Suggest that collection `s` reserve capacity for at least `n` elements. That is, if"
  base/dict.jl:201: "# need at least 1.5n space to hold n elements"
cause: |
  base/dict.jl:200 first bounds the requested element count below by length(d),
  but line 202 then uses unchecked 3 * newsz. The overflow defeats that bound.
  base/abstractdict.jl:584 maps the negative result to 16. The probe loop at
  base/dict.jl:173-175 has no empty slot once 16 old entries have been copied.
possible_fix: |
  Check the capacity arithmetic before multiplication and reject a size that
  cannot be represented. Keep the computed table capacity large enough for
  every existing entry before calling rehash!.
duplicates:
  issues: []
  prs: []
  queries:
    - 'gh search issues --repo JuliaLang/julia "sizehint overflow"'
    - 'gh search issues --repo JuliaLang/julia "sizehint hang"'
    - 'gh search issues --repo JuliaLang/julia "Dict rehash infinite"'
    - 'gh search prs --repo JuliaLang/julia "sizehint overflow"'
    - 'gh search prs --repo JuliaLang/julia "sizehint hang"'
    - 'gh search prs --repo JuliaLang/julia "Dict rehash infinite"'
lean:
  property: JuliaLean.Proofs.base.dict.DictSizehintTotal
  theorem: JuliaLean.ChatGPT.Batch4.Group1.DictsSizehintWrapHang_refuted
