id: dicts-range-allunique-subulp
title: "A nonzero floating range step can give repeated elements and wrong allunique/allequal results"
priority: P2
kind: wrong-result
area: Dicts
files: [base/set.jl]
functions: ["allunique(::AbstractRange)", "allequal(::AbstractRange)"]
summary: |
  range(1.0; step=eps(1.0)/4, length=2) has a nonzero step, but its two
  elements are isequal because both round to 1.0. The range specializations
  report allunique=true and allequal=false. The same predicates applied to
  collect(r) report false and true, matching the documented comparison.
likelihood: |
  A floating-point grid with a step smaller than the spacing of representable
  values near its starting point can repeat values. The example needs only
  two elements and ordinary public range construction.
maybe_intended: |
  A nonzero step implies distinct elements in an exact arithmetic progression.
  Floating-point rounding invalidates that assumption. Earlier issue #36849
  and PR #36850 addressed a zero-step regression; they do not establish
  correctness for this nonzero sub-spacing step.
reproducer: |
  r = range(1.0; step=eps(1.0)/4, length=2)
  observed = collect(r)
  @assert length(r) == 2 && !iszero(step(r))
  @assert isequal(observed[1], observed[2])
  @assert allunique(r) && !allunique(observed)
  @assert !allequal(r) && allequal(observed)
  println("REPRODUCED dicts-range-allunique-subulp")
output:
  release: |
    REPRODUCED dicts-range-allunique-subulp
  nightly: |
    REPRODUCED dicts-range-allunique-subulp
reproduced:
  release: true
  nightly: true
expected: |
  allunique(r) should be false and allequal(r) should be true, agreeing with
  the same predicates on the two iterated values.
promised_by: |
  Julia commit f755f49a9e41380d7da126b3c1db9fe7f83dd027, base/set.jl:484:
  "Return `true` if all values from `itr` are distinct when compared with [`isequal`](@ref)."
  The same pinned file, base/set.jl:613:
  "Return `true` if all values from `itr` are equal when compared with [`isequal`](@ref)."
cause: |
  At the pinned commit, base/set.jl:546 defines allunique(r::AbstractRange)
  as !iszero(step(r)) || length(r) <= 1. Line 660 defines allequal using
  iszero(step(r)) || length(r) <= 1. Neither shortcut observes the rounded
  elements, so both return the wrong answer for this two-element range.
possible_fix: |
  Restrict the step-only shortcuts to range types for which distinctness
  follows from a nonzero step. Use element comparisons for floating ranges
  unless a stronger range-specific argument establishes the result.
