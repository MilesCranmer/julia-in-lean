id: multidimcov-range-getindex-unsigned
title: Valid unsigned indexing of a negative StepRange throws InexactError
priority: P2
kind: wrong-exception
area: MultidimCov
files:
  - base/array.jl
  - base/range.jl
functions:
  - getindex(v::AbstractRange, i::Integer)
  - unsafe_getindex(v::AbstractRange{T}, i::Integer) where T
summary: |
  (-10:2:-1)[UInt(1)] throws InexactError instead of returning the first element,
  -10. The same range indexed by Int(1), and its collected vector indexed by
  UInt(1), both return -10. The valid unsigned index changes the arithmetic type
  used to compute the element.
likelihood: |
  The failure needs a negative range element and an unsigned index. Positions
  produced by unsigned arithmetic can reach this ordinary scalar-indexing API.
maybe_intended: |
  The public method accepts Integer indices and the bounds check succeeds.
  Neither the indexing docstring nor this dispatch rejects unsigned indices.
  Related issue #63679 documents signed/unsigned promotion failures for range
  slices, but its examples exercise a different indexing method.
reproducer: |
  r = -10:2:-1
  collect(r)[UInt(1)]
  r[UInt(1)]
  r[1]
output:
  release: |
    collect(-10:2:-1)[UInt(1)] = -10
    (-10:2:-1)[UInt(1)] = InexactError(:convert, (Int64, 0xfffffffffffffff6))
    (-10:2:-1)[1] = -10
    REPRODUCED multidimcov-range-getindex-unsigned
  nightly: |
    collect(-10:2:-1)[UInt(1)] = -10
    (-10:2:-1)[UInt(1)] = InexactError(:convert, (Int64, 0xfffffffffffffff6))
    (-10:2:-1)[1] = -10
    REPRODUCED multidimcov-range-getindex-unsigned
reproduced:
  release: true
  nightly: true
expected: |
  r[UInt(1)] returns -10, just as r[1] and collect(r)[UInt(1)] do. Run the
  calls individually to observe the thrown exception; the full reproducer
  catches it to print all three comparisons.
promised_by: |
  base/array.jl:954-957 at f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  "    getindex(collection, key...)

  Retrieve the value(s) stored at the given key or index within a collection. The syntax
  `a[i,j,...]` is converted by the compiler to `getindex(a, i, j, ...)`."
  base/array.jl:3219-3224 accepts an Integer index and delegates non-Bool
  indices to _getindex. The tested index is 1, which is in bounds.
cause: |
  base/range.jl:952-955 checks bounds then calls unsafe_getindex. At line 985,
  convert(T, first(v) + (i - oneunit(i))*step_hp(v)) promotes the signed range
  arithmetic with UInt64. The negative first element becomes the unsigned value
  0xfffffffffffffff6, which cannot be converted back to Int64.
possible_fix: |
  Compute the element offset without unsigned promotion of a negative range
  value. Normalize the validated index to an appropriate signed key type or use
  overflow-safe arithmetic that also handles ranges with wider integer keys.
duplicates:
  issues:
    - number: 63679
      state: open
      relation: related
  prs: []
  queries:
    - 'gh search issues --repo JuliaLang/julia range unsigned index'
    - 'gh search issues --repo JuliaLang/julia StepRange UInt'
    - 'gh search issues --repo JuliaLang/julia range indexing InexactError'
    - 'gh search prs --repo JuliaLang/julia range unsigned index'
    - 'gh search prs --repo JuliaLang/julia StepRange UInt'
    - 'gh search prs --repo JuliaLang/julia range indexing InexactError'
  notes: |
    Issue #63679 reports unsigned range slicing, including negative-step
    promotion and offset wraparound, rather than this scalar InexactError.
    Related range overflow work exists, but no exact scalar-indexing
    duplicate or fixing PR is known. A slice-only report is not an exact match.
lean:
  property: JuliaLean.Proofs.base.array.ScalarRangeIndexSpec
  theorem: JuliaLean.ChatGPT.Batch4.Group2.MultidimcovRangeGetindexUnsigned_refuted
