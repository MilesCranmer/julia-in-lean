reproduced: {release: true, nightly: true, master: true}
expected: |
  The cache is fresh: the directory's listing, which is its declared content,
  is unchanged.
promised_by: |
  base/loading.jl:2766-2772 (include_dependency docstring): "if `track_content=true`
  the module will need to be recompiled if the content of `path` changes (if
  `path` is a directory the content equals `join(readdir(path))`)".
cause: |
  base/loading.jl:2700-2702 records UInt64(filesize(path)) for a directory too, and
  base/loading.jl:4838-4843 compares fsize before the content hash and returns
  stale on any difference. Current master (eb844b8ebd99, 2026-11-10) has the same
  lines (2703-2705 and 4842-4847): not changed.
possible_fix: |
  Skip the size comparison for directories (compare only the listing hash), or
  record size 0 for directories in _include_dependency! and ignore it on read.
