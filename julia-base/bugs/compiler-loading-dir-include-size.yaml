id: compiler-loading-dir-include-size
title: "Cache with a directory `include_dependency` goes stale when the directory's st_size changes but its listing does not"
priority: P2
kind: wrong-result
area: Loading
files: [base/loading.jl]
functions: ["any_includes_stale(includes::Vector{CacheHeaderIncludes}, cachefile::String, reasons)", "_include_dependency!(dep_list, track_dependencies, mod, _path, track_content, path_may_be_dir)"]
summary: |
  For a content-tracked include dependency on a directory, the writer records
  `filesize(path)` (the directory's st_size) next to the hash of
  `join(readdir(path))`, and any_includes_stale rejects the cache with
  :fsize_changed when the size differs, before it looks at the hash. A
  directory's st_size is a property of the file system, not of its listing:
  ext4 never shrinks a directory, so adding files and removing them again leaves
  the same listing with a larger size, and copying a relocatable depot to another
  file system (ext4 to tmpfs or APFS) changes every directory size. In both
  cases the package is recompiled although its declared content is unchanged.
likelihood: |
  Needs a package that calls `include_dependency(dir)` (track_content defaults to
  true) and a directory whose st_size changes: a data directory that temporarily
  holds more files on ext4/XFS, or a relocated depot (Docker layers, copied CI
  depots, app bundles) on a different file system. isrelocatable reports such a
  package as relocatable. The cost is a needless recompile on every load until
  the cache is rebuilt in place.
  Triage 2026-11-10. Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  Master base/loading.jl:2703-2705 and 4841-4846 are unchanged. Blame: the size pre-check is
  from cd7250da83 (2024-10-31) and the directory hash from f2df1b41b8 (2023-10-20); neither
  commit says the directory size is meant to be part of the content, and the docstring says
  the content is `join(readdir(path))`. On APFS a directory's size follows its entry count, so
  there it only fires when depots move between file systems; on ext4 and XFS it also fires after
  files are added and removed. How many packages call include_dependency on a directory was not
  counted (plan: a julia-code-search query for include_dependency with a directory argument).
  Stays P2: a needless full recompile per load, no wrong code.
maybe_intended: |
  The size check is a cheap pre-check before hashing, and is right for files.
  For directories the docstring defines the tracked content as
  `join(readdir(path))` only, so the size is not part of it.
reproducer: |
  # package DirDep with include_dependency(joinpath(@__DIR__, "..", "data")),
  # data/ holds one file "a"; precompile in a temporary depot on ext4;
  # add 300 files to data/ and remove them again; readdir and its hash are
  # unchanged, filesize(data) went from 4096 to 20480;
  # stale_cachefile now rejects the cache with :fsize_changed.
  # full script: repro/compiler-loading-dir-include-size.jl
