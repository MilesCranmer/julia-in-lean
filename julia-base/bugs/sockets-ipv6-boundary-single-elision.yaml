id: sockets-ipv6-boundary-single-elision
title: "parse(IPv6, ...) rejects a single zero compressed at either end"
priority: P3
kind: wrong-result
area: Sockets
files: [stdlib/Sockets/src/IPAddr.jl]
functions: ["parse(::Type{IPv6}, ::AbstractString)"]
summary: |
  Valid IPv6 text such as "::1:2:3:4:5:6:7" or "1:2:3:4:5:6:7::" is
  rejected with ArgumentError. Each string compresses exactly one zero group.
  The leading or trailing "::" produces nine split tokens, which the parser
  mistakes for too many address groups. libc inet_pton accepts both strings.
likelihood: |
  These are valid non-canonical spellings, so they can occur in configuration
  files and input generated by software that follows RFC 4291.
maybe_intended: |
  RFC 5952 forbids compressing a single zero when printing. Its input rule
  explicitly requires accepting every legitimate RFC 4291 spelling.
reproducer: |
  using Sockets
  parse(IPv6, "::1:2:3:4:5:6:7")
output:
  release: |
    inet_pton("::1:2:3:4:5:6:7") accepted = true
    parse(IPv6, "::1:2:3:4:5:6:7") = ArgumentError: too many fields in IPv6 address
    inet_pton("1:2:3:4:5:6:7::") accepted = true
    parse(IPv6, "1:2:3:4:5:6:7::") = ArgumentError: too many fields in IPv6 address
    REPRODUCED sockets-ipv6-boundary-single-elision
  nightly: |
    inet_pton("::1:2:3:4:5:6:7") accepted = true
    parse(IPv6, "::1:2:3:4:5:6:7") = ArgumentError: too many fields in IPv6 address
    inet_pton("1:2:3:4:5:6:7::") accepted = true
    parse(IPv6, "1:2:3:4:5:6:7::") = ArgumentError: too many fields in IPv6 address
    REPRODUCED sockets-ipv6-boundary-single-elision
reproduced: {release: true, nightly: true}
expected: |
  ip"0:1:2:3:4:5:6:7" and ip"1:2:3:4:5:6:7:0", respectively.
promised_by: |
  RFC 4291 section 2.2: "The use of '::' indicates one or more groups of
  16 bits of zeros." RFC 5952 section 4: "all implementations MUST accept
  and be able to handle any legitimate RFC 4291 format."
  https://www.rfc-editor.org/rfc/rfc4291#section-2.2
  https://www.rfc-editor.org/rfc/rfc5952#section-4
cause: |
  stdlib/Sockets/src/IPAddr.jl:244-246 checks length(split(str, ':')) > 8.
  A boundary '::' contributes two empty tokens, so seven explicit groups
  become nine tokens even though the address needs only eight groups.
possible_fix: |
  Count explicit address groups separately from the empty tokens representing
  an elision, and validate exactly one elision before assembling the host.
duplicates:
  issues:
    - {number: 40255, state: open, relation: related}
  queries: ["IPv6 single zero", "PR: IPv6 parse"]
lean:
  property: JuliaLean.Sockets.IPv6BoundaryElision
  theorem: JuliaLean.Sockets.ipv6BoundaryElision_refuted
