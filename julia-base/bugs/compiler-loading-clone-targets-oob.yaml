id: compiler-loading-clone-targets-oob
title: "A damaged pkgimage cache file crashes `using` in jl_check_pkgimage_clones instead of being rejected"
priority: P2
kind: crash
area: Loading
files: [base/loading.jl, src/processor.cpp]
functions: ["stale_cachefile(modkey::PkgId, build_id::UInt128, modspec::PkgLoadSpec, cachefile::String)", "check_clone_targets(clone_targets)", "jl_check_pkgimage_clones"]
summary: |
  stale_cachefile reads the clone-target bytes from a cache file's header and
  passes them to check_clone_targets, which hands only a pointer to the C
  function jl_check_pkgimage_clones. The C side deserializes the target list
  with the counts and string lengths stored in those bytes and no bound, so a
  damaged length reads past the buffer. `using` of a package whose .ji file has
  a damaged clone-target field segfaults instead of rejecting the cache and
  recompiling. The file checksum that would reject such a file is checked only
  after this point, and require's first pass skips it (verify_checksums=false).
likelihood: |
  Needs a damaged cache file: a bit flip on disk, a partially written or
  overwritten file in a shared depot, or a file copied incompletely. Cache files
  are written atomically, so ordinary use does not produce one. When it happens,
  every `using` of that package crashes until the file is deleted by hand, and
  so does Pkg.precompile, which checks the same file.
  Found by the loading difftest: 4 of 5 runs of seed 2 crashed the pinned Julia
  in check_clone_targets on a mutated copy of a cache file.
  Triage 2026-11-10 (was P1). Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  Master source (eb844b8ebd) unchanged: check_clone_targets (base/loading.jl:4646-4647) still
  passes only a pointer, and jl_check_pkgimage_clones(char *data) (src/processor.cpp:700) has no
  length. Skeptical points: compilecache writes a temporary file and renames it, so a killed or
  crashed writer cannot leave a partial file under the cache name. The input needs damage inside
  the clone-target bytes of the header (a few dozen bytes), from a bad disk, a manual edit or a
  broken copy of a depot. Not tested: whether a truncated file can reach this path. It is not
  intended: every other damaged-header case is rejected. Deleting the file recovers. A segfault,
  but on a narrow input, so P2 rather than P1. #60108 (closed) reads the same C function but is
  about its match_idx logic, not related.
maybe_intended: |
  The loading code treats a cache file as trusted input in several places; the
  CRC check exists to reject damaged files, but runs after the header has been
  used.
reproducer: |
  # precompile a one-function package into a temporary depot, then grow the
  # length field of the CPU name inside the clone targets of its .ji file
  bytes = read(cachefile)
  name = String(Base.parse_image_targets(clone_targets)[1].name)
  i = findfirst(vcat(reinterpret(UInt8, [Int32(ncodeunits(name))]), codeunits(name)), bytes)
  bytes[first(i):first(i)+3] .= reinterpret(UInt8, [Int32(0x40000000)])
  write(cachefile, bytes)
  # julia -e 'using CloneOOB'  (with that depot first) dies with signal 11
  # full script: repro/compiler-loading-clone-targets-oob.jl
