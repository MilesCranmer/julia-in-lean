reproduced: {release: true, nightly: true, master: true}
expected: |
  stale_cachefile returns true (the cache is rejected, for example with reason
  :cpu_target or :checksum_invalid), and the package is recompiled.
promised_by: |
  base/loading.jl:4923 comment: "this function does nearly all of the file
  validation". The cache-file CRC (checksums_invalid, base/loading.jl:4070-4083)
  exists to reject damaged files instead of loading them.
cause: |
  base/loading.jl:4986 (pinned f755f49a9e41) calls check_clone_targets(clone_targets)
  before any checksum check; base/loading.jl:4642-4647 passes the Vector's
  pointer to jl_check_pkgimage_clones(char *data) (src/processor.cpp:700-708),
  which has no length argument and calls tp::deserialize_targets on it
  (src/processor.cpp:514). The deserializer trusts the embedded string length.
possible_fix: |
  Pass the length of the clone-target bytes to jl_check_pkgimage_clones and
  bound the deserializer by it, rejecting the cache when the data does not fit;
  or check the cache file's CRC before using header fields that reach C.
