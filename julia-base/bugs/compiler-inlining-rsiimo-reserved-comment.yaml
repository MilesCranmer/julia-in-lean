id: compiler-inlining-rsiimo-reserved-comment
title: "Stale comment: IR_FLAG_RSIIMO is bit 20, not the reserved bit 15"
priority: P3
kind: documentation
area: Compiler
files: [Compiler/src/optimize.jl]
functions: ["IR_FLAG_RSIIMO"]
summary: |
  The comment at Compiler/src/optimize.jl:44 says "Reserved: one(UInt32) << 15 used for
  RSIIMO below", but IR_FLAG_RSIIMO is one(UInt32) << 20 (optimize.jl:57) and no IR flag uses
  bit 15. Anyone syncing the flags with julia.h or method.c from the comment gets the wrong bit.
likelihood: |
  Documentation only; the code is consistent.
  Triage 2026-11-10. Rerun 2026-11-10: REPRODUCED on pinned, nightly and master 4c0e39dde6; 1.13.3 has
  no IR_FLAG_RSIIMO. On master the comment is at optimize.jl:38 and the flag at line 51. Both
  lines come from the same commit, 5566b23a42 (#62604, 2026-08-04), so the comment was wrong
  from the start, and no C file names the flag. Documentation only. P3.
maybe_intended: ""
reproducer: |
  trailing_zeros(Base.Compiler.IR_FLAG_RSIIMO)   # 20
