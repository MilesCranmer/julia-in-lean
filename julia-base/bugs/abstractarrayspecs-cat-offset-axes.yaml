expected: |
  [1 0; 2 0; 0 3; 0 4] and [1, 2, 3, 4] (the result of cat on the same data with
  1-based axes), or an ArgumentError for offset arguments.
promised_by: |
  cat docstring, base/abstractarray.jl:2061-2066: "Concatenate the input arrays along
  the dimensions specified in dims. Along a dimension d in dims, the size of the
  output array is sum(size(a,d) for a in A)." The output is a 1-based Array of that
  size, so each argument must occupy size(a,d) consecutive positions after the
  previous ones.
cause: |
  base/abstractarray.jl:1932 in __cat_offset1! builds the destination range as
  `offsets[i] .+ cat_indices(x, i)`, and cat_indices(A, d) = axes(A, d) (line 1848),
  so an axis that starts at f > 1 lands f - 1 positions too far. The offset update
  on line 1936 uses cat_size, so later arguments are placed correctly and overwrite
  the misplaced one. For one cat dimension _cat_t does not fill! the output first
  (line 1911), so the skipped positions are uninitialized.
possible_fix: |
  Use `offsets[i] .+ (1:cat_size(x, i))` (or OneTo) for cat dimensions in
  __cat_offset1!, or reject offset arguments with require_one_based_indexing.
