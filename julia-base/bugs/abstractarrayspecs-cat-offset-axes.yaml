id: abstractarrayspecs-cat-offset-axes
title: "cat silently misplaces arguments with offset axes, returning zeros or uninitialized memory"
priority: P1
kind: wrong-result
area: AbstractArraySpecs
files: [base/abstractarray.jl]
functions: ["cat(A...; dims)", "_cat_t", "__cat_offset1!", "cat_indices(::AbstractArray, d)"]
covers: [abstractarrayspecs-cat-row1905, abstractarrayspecs-cat-row1918, abstractarrayspecs-cat-row1921, abstractarrayspecs-cat-row2003, abstractarrayspecs-cat-row2053, abstractarrayspecs-cat-row2055, abstractarrayspecs-cat-row2056, abstractarrayspecs-cat-row2175, abstractarrayspecs-cat-row2176, abstractarrayspecs-cat-row2177, abstractarrayspecs-cat-row2178, abstractarrayspecs-cat-row2179, abstractarrayspecs-cat-row2180, abstractarrayspecs-cat-row2181, abstractarrayspecs-cat-row2182, abstractarrayspecs-cat-row2184, abstractarrayspecs-cat-row2185, abstractarrayspecs-cat-row2186, abstractarrayspecs-cat-row2187, abstractarrayspecs-cat-row2188, abstractarrayspecs-cat-row2189, abstractarrays-source-cat-public-contents, abstractarrays-source-cat-same-array-contents]
summary: |
  When an argument of cat has an axis along a concatenated dimension that does not
  start at 1, cat writes that argument at its own axis values (shifted by the running
  offset) instead of at the next free position of the 1-based output. If the shifted
  range still fits, the argument overwrites the slot of a later argument and its own
  slot keeps the initial contents: zeros for block-diagonal cat, uninitialized memory
  for a single cat dimension. With an offset vector x with axes 3:4,
  cat(x, [3, 4]; dims=(1, 2)) returns [0 0; 0 0; 1 3; 2 4] on both versions and
  cat(x, [3, 4]; dims=1) returns two garbage values followed by 3, 4 on master.
likelihood: |
  Needs an AbstractArray with offset axes (OffsetArrays.jl, or views and custom types
  with offset axes) passed to cat along a dimension where its axis is offset. Rare,
  but the result is silently wrong and can expose uninitialized memory.
maybe_intended: |
  Upstream issue #37493 (open) reports the same root cause for 3-d hcat/vcat as a
  BoundsError and treats it as a bug. Nothing documents that cat requires 1-based
  arguments, and on 1.13.2 cat(x, [3, 4]; dims=1) throws "offset arrays are not
  supported" instead.
reproducer: |
  struct OV <: AbstractVector{Int}; data::Vector{Int}; end
  Base.size(v::OV) = size(v.data)
  Base.axes(v::OV) = (Base.IdentityUnitRange(3:2+length(v.data)),)
  Base.getindex(v::OV, i::Int) = v.data[i-2]
  x = OV([1, 2])
  cat(x, [3, 4]; dims=(1, 2))   # [0 0; 0 0; 1 3; 2 4]
  cat(x, [3, 4]; dims=1)        # master: [garbage, garbage, 3, 4]
  vcat(x, [3, 4])               # master: [1, 2, 3, 4]
