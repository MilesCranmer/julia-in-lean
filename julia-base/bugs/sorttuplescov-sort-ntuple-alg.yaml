id: sorttuplescov-sort-ntuple-alg
title: "sort((2, 1); alg=InsertionSort) throws an internal MethodError"
priority: P2
kind: wrong-exception
area: Sort
files:
  - base/sort.jl
functions:
  - "sort(::NTuple; alg)"
  - "_sort(::NTuple, ::Algorithm, ::Ordering, kw)"
summary: |
  The tuple sort signature accepts an Algorithm, but the built-in
  InsertionSort has no matching tuple _sort method. Default sorting of the
  same (2, 1) tuple succeeds. The reproducer uses InsertionSort only.
likelihood: |
  Generic code that forwards an explicit algorithm can encounter this when
  its input is a homogeneous tuple.
maybe_intended: |
  Tuple sorting has its own optimized default implementation. Explicit
  algorithms may be intentionally restricted, but that restriction is absent
  from the public signature and docstring.
reproducer: |
  function reproduced()
      x = (2, 1)
      sort(x) == (1, 2) || return false
      try
          sort(x; alg=Base.Sort.InsertionSort)
          false
      catch e
          e isa MethodError
      end
  end
  println(reproduced() ? "REPRODUCED sorttuplescov-sort-ntuple-alg" : "NOT_REPRODUCED sorttuplescov-sort-ntuple-alg")
output:
  release: |
    REPRODUCED sorttuplescov-sort-ntuple-alg
  nightly: |
    Julia 1.15.0-DEV.unknown, commit f755f49a9e41380d7da126b3c1db9fe7f83dd027:
    REPRODUCED sorttuplescov-sort-ntuple-alg
reproduced:
  release: true
  nightly: true
expected: |
  Return (1, 2) for the accepted InsertionSort keyword, or document and
  explicitly reject unsupported tuple algorithms.
promised_by: |
  Pinned Julia commit f755f49a9e41380d7da126b3c1db9fe7f83dd027.
  base/sort.jl:1745: "sort(v::NTuple; kws...)::NTuple"
  base/sort.jl:1747: "Variant of [`sort!`](@ref) that returns a sorted copy of `v` leaving `v` itself unmodified."
  base/sort.jl:1785-1786 accepts "function sort(x::NTuple;" and "alg::Algorithm=defalg(x),".
cause: |
  base/sort.jl:1794 forwards the selected algorithm to _sort. The tuple method
  at base/sort.jl:1798 accepts only Union{DefaultStable, DefaultUnstable},
  so InsertionSort reaches missing-method dispatch.
possible_fix: |
  Support the built-in explicit algorithms through a tuple fallback or
  state and validate the tuple algorithm restriction at the public entry point.
