id: sorttuplescov-sort-ntuple-alg
title: "sort(::NTuple; alg=...) throws an internal MethodError for every explicit algorithm"
priority: P2
kind: wrong-exception
area: Sort
files: [base/sort.jl]
functions: ["sort(x::NTuple; alg, lt, by, rev, order, scratch)", "_sort(x::NTuple, a::Union{DefaultStable, DefaultUnstable}, o, kw)"]
summary: |
  sort on an NTuple accepts an alg keyword, but every algorithm other than
  DEFAULT_STABLE and DEFAULT_UNSTABLE (InsertionSort, QuickSort, MergeSort,
  PartialQuickSort, ScratchQuickSort, ...) throws MethodError: no method matching
  Base.Sort._sort(::NTuple, ::QuickSortAlg, ...). The same call on a Vector sorts.
likelihood: |
  Moderate for code that forwards a sort algorithm to a generic routine that may
  receive tuples; the error names an internal function.
maybe_intended: |
  A comment at base/sort.jl:1796-1797 invites packages to add _sort methods for
  their own algorithms, so leaving the built-in algorithms unhandled may be a
  deliberate restriction; the sort docstring still lists alg for sort(v::NTuple; kws...).
reproducer: |
  sort([3, 1, 2]; alg=QuickSort)   # [1, 2, 3]
  sort((3, 1, 2); alg=QuickSort)   # MethodError: no method matching _sort(::Tuple{Int64, Int64, Int64}, ::QuickSortAlg, ...)
output:
  release: |
    [1, 2, 3]
    MethodError
    REPRODUCED sorttuplescov-sort-ntuple-alg
  nightly: |
    [1, 2, 3]
    MethodError
    REPRODUCED sorttuplescov-sort-ntuple-alg
reproduced: {release: true, nightly: true}
expected: |
  (1, 2, 3), sorted with the requested algorithm (for example through the vector
  path of base/sort.jl:1801-1804), or an ArgumentError that names the unsupported
  algorithm.
promised_by: |
  sort docstring, base/sort.jl:1744-1747: "sort(v; alg::Base.Sort.Algorithm=Base.Sort.defalg(v), ...)
  ... sort(v::NTuple; kws...)::NTuple". The method signature at base/sort.jl:1785-1791
  takes alg::Algorithm.
cause: |
  sort(x::NTuple) calls _sort(x, alg, ord(...), (;scratch)) (base/sort.jl:1794), and
  _sort has only the method for Union{DefaultStable, DefaultUnstable}
  (base/sort.jl:1798-1808).
possible_fix: |
  Add a fallback _sort(x::NTuple, a::Algorithm, o, kw) that sorts copymutable(x)
  with _sort!(v, maybe_apply_initial_optimizations(a), o, kw) and converts back.
duplicates:
  issues:
    - {number: 54494, state: merged, relation: related}
  queries: ["issues: sort tuple alg", "issues: sort NTuple QuickSort", "issues: sort NTuple MethodError", "issues/prs: sort tuple", "issues/prs: sort tuples"]
lean:
  property: JuliaLean.SortTuplesCov.SortNTupleAlgs
  theorem: JuliaLean.SortTuplesCov.sortNTupleAlgs_refuted
