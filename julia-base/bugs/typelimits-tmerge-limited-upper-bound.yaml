id: typelimits-tmerge-limited-upper-bound
title: "inference: `tmerge` of two lattice-equal `LimitedAccuracy` elements is not an upper bound"
priority: P2
kind: wrong-result
area: Compiler
files: [Compiler/src/typelimits.jl]
functions: ["tmerge_limited(::InferenceLattice, typea, typeb)", "merge_causes(causesa, causesb)"]
summary: |
  For `a = LimitedAccuracy(T, {s1})` and `b = LimitedAccuracy(T, {s2})` (same type, different
  causes of the same size), `tmerge(typeinf_lattice, a, b)` returns `LimitedAccuracy(T, {s1, s2})`.
  `⊑(::InferenceLattice)` orders lattice-equal limited elements by reverse inclusion of their causes,
  so the result is `⊑` both arguments and neither argument is `⊑` it. The same happens whenever
  `merge_causes` keeps a set that is not a subset of both inputs' causes (it keeps the smaller one
  when the lengths differ, which need not be a subset of the other).
likelihood: |
  Reached while inference is limiting a recursion cycle and merges two `LimitedAccuracy` results
  of the same type whose cycles differ. No wrong inferred type follows (the type part is exact);
  the effect is on which causes are tracked and on `⊑`-based convergence checks. No user-visible
  effect found.

  Triage 2026-11-09: verdict duplicate, priority P2.

  Known: JuliaLang/julia#48376 "tmerge for LimitedAccuracy is not convergent" (open since
  2023-01, from vtjnash's review of #48045) names exactly this rule: the length heuristic
  falls back to a union, which may make inference non-terminating as it "repeatedly merged
  and dropped causes lists". The TODO at typelimits.jl:438-440 (fe45f010db, Keno Fischer)
  marks it as a placeholder. Our entry adds a concrete law violation and repro to that
  issue; nothing new to file.
  Reachability: the return path (update_bestguess!) cannot hit it, because rt's causes
  are a copy of frame.limitations, which only grows, so bestguess.causes ⊆ rt.causes and
  `⊑` holds before any merge. It is reachable through slot states: a call result with
  pclimitations becomes `LimitedAccuracy(rt, frame.pclimitations)`
  (abstractinterpretation.jl:4423) in ssavaluetypes, and an assignment carries it into a
  VarState. Two such values of equal type from different cycles can meet in smerge.
  No hang or wrong type was built; the type part of the merge is exact.
  Upstream master unchanged (code read).
maybe_intended: |
  The TODO at Compiler/src/typelimits.jl:438-440 says that for lattice-equal elements either cause
  set may be discarded and that the rule is a length heuristic. But the union it falls back to is
  the meet of the two in the `⊑` order, not the join.
reproducer: |
    # tmerge(typeinf_lattice, a, b) of two lattice-equal LimitedAccuracy elements with different
    # causes of the same size returns a result that is ⊑ both arguments, not ⊒ them.
    const CC = Base.Compiler
    println("VERSION = ", VERSION, ", commit ", Base.GIT_VERSION_INFO.commit)
    L = CC.typeinf_lattice(CC.NativeInterpreter())
    IS = CC.InferenceState isa UnionAll ? CC.InferenceState{CC.NativeInterpreter} : CC.InferenceState
    s1 = ccall(:jl_new_struct_uninit, Any, (Any,), IS)
    s2 = ccall(:jl_new_struct_uninit, Any, (Any,), IS)
    S = fieldtype(CC.LimitedAccuracy, :causes)
    c1 = S(); push!(c1, s1)
    c2 = S(); push!(c2, s2)
    a = CC.LimitedAccuracy(Int, c1)
    b = CC.LimitedAccuracy(Int, c2)
    r = CC.tmerge(L, a, b)
    println("r = tmerge(a, b) = ", r, " with ", length(r.causes), " causes")
    println("a ⊑ r: ", CC.:⊑(L, a, r), ";  b ⊑ r: ", CC.:⊑(L, b, r), ";  r ⊑ a: ", CC.:⊑(L, r, a))
    if !CC.:⊑(L, a, r) && !CC.:⊑(L, b, r)
        println("REPRODUCED typelimits-tmerge-limited-upper-bound")
    end
output:
