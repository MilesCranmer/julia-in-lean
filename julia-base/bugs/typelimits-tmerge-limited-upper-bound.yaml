    r = tmerge(a, b) = LimitedAccuracy(Int64, #= 2 cause(s) =#) with 2 causes
    a ⊑ r: false;  b ⊑ r: false;  r ⊑ a: true
    REPRODUCED typelimits-tmerge-limited-upper-bound
reproduced: {release: true, nightly: true}
expected: |
  A result `r` with `a ⊑ r` and `b ⊑ r`, e.g. `LimitedAccuracy(T, causesa ∩ causesb)` (or `T`
  itself when the intersection is empty).
promised_by: |
  Lattice law: `tmerge` returns an upper bound of both arguments (docstring of `tmerge`,
  Compiler/src/abstractlattice.jl:115-122), with `⊑` on limited elements as defined at
  Compiler/src/typelattice.jl:401-418 (`b.causes ⊆ a.causes`).
cause: |
  Compiler/src/typelimits.jl:465-466 returns `LimitedAccuracy(typeb, merge_causes(causesa,
  causesb))` for lattice-equal types; merge_causes (lines 437-448) returns the union for equal
  lengths and the smaller set otherwise.
possible_fix: |
  Use the intersection of the cause sets for lattice-equal types (dropping the wrapper when it is
  empty), or change `⊑` so that it matches the merge rule.
