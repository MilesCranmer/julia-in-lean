reproduced: {release: false, nightly: true}
expected: |
  `tmerge(𝕃, c, c) === c` (or at least `⊑ c`), keeping `isdefined`; `f` inferred `nothrow` with
  exception type `Union{}`, like `g`.
promised_by: |
  Lattice law: `tmerge(a, a) ⊑ a` (a join is idempotent); the docstring of `tmerge` calls it a
  lattice join, Compiler/src/abstractlattice.jl:115-122. On the pinned commit (f755f49a9e) the lattice result
  reproduces; 1.13.3 shows the same `tmerge` result but still infers `f` as nothrow.
cause: |
  Compiler/src/typelimits.jl:525-538: `tmerge(::ConditionalsLattice)` merges two same-slot
  `Conditional`s field by field, returns `Bool` when `thentype === elsetype` (always the case for
  `@isdefined`, Compiler/src/abstractinterpretation.jl:3715), and otherwise calls
  `Conditional(slot, ssadef, thentype, elsetype)` without passing `isdefined`. There is no
  `typea === typeb` shortcut before the merge.
possible_fix: |
  Return `typea` when `typea === typeb`; pass `isdefined = typea.isdefined & typeb.isdefined` to the
  rebuilt `Conditional`, and keep it (instead of `Bool`) when `isdefined` is set even if
  `thentype === elsetype`.
