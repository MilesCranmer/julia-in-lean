    infer_exception_type(f) = UndefVarError;  infer_exception_type(g) = Union{}
    infer_effects(f) = (+c,+e,+re,!n,+t,+s,+m,+u,+o,+r);  infer_effects(g) = (+c,+e,+re,+n,+t,+s,+m,+u,+o,+r)
