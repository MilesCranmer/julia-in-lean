id: typelimits-tmerge-conditional-idempotent
title: "inference: merging two identical `@isdefined(x)` results loses the `isdefined` refinement"
priority: P2
kind: wrong-result
area: Compiler
files: [Compiler/src/typelimits.jl]
functions: ["tmerge(::ConditionalsLattice, typea, typeb)"]
summary: |
  `tmerge(typeinf_lattice, c, c)` is not `⊑ c` when `c` is the `Conditional` that `@isdefined x`
  produces (`Conditional(slot, ssadef, T, T; isdefined=true)`): the then and else types merge to
  the same `T`, so `tmerge` returns `Bool`. With different then and else types it rebuilds the
  `Conditional` with `isdefined=false`. Either way a control-flow merge of two `@isdefined(x)`
  results drops the "x is defined in the then branch" refinement, and inference keeps an
  `UndefVarError` path for `x`: in the reproducer `f` loses `nothrow` and gets exception type
  `UndefVarError`, while the equivalent `g` without the merge is `nothrow`.
likelihood: |
  Needs a slot holding `@isdefined(x)` that is assigned on two paths and later branched on, e.g.
  `c = cond ? @isdefined(x) : @isdefined(x)` or `c = @isdefined(x); if b; c = @isdefined(x); end`.
  Uncommon; the cost is precision (effects, an extra undef check), never a wrong result.

  Triage 2026-11-09: verdict survives, priority P2.

  Survives. The element is the one `@isdefined` produces (abstractinterpretation.jl:3715),
  so inference really builds it. The rule's intent is not written anywhere: the
  `thentype !== elsetype` test dates from a5e275f277 (2022), before `isdefined` existed, and
  the ssadef rewrite e0b1dc2759 (2025-12-08) kept dropping `isdefined`. Effect: precision
  only (an extra UndefVarError path, lost nothrow). It changes effects, so
  it can block concrete eval or DCE of callers. Regressed relative to 1.13.3, where the
  same tmerge result did not cost nothrow. Upstream master unchanged at
  Compiler/src/typelimits.jl:529-533 (code read). Not covered by Compiler/test/lattice.jl
  (its Conditionals have isdefined=false and thentype !== elsetype).

  On the pinned build, with `Base.REFLECTION_COMPILER[] = Base.Compiler` so that reflection
  runs the redefined method, adding a method
  `tmerge(::ConditionalsLattice, a::Conditional, b::Conditional)` that keeps
  `isdefined=true` (and the Conditional) when both inputs are same-slot isdefined
  Conditionals turns `infer_exception_type(f)` from UndefVarError into Union{} and restores
  `+n`. The same setup without the patch still gives UndefVarError. So the lost nothrow
  comes from this tmerge.
maybe_intended: |
  The `isdefined` flag is "only beneficial for local inference" (comment at
  Compiler/src/typelattice.jl:45-47), and merges may lose precision. But merging an element with
  itself should not lose anything (`tmerge(a, a) ⊑ a`), and 1.13.3 infers `f` as nothrow.
reproducer: |
    # tmerge(typeinf_lattice, c, c) is not ⊑ c for the Conditional that `@isdefined x` produces, so
    # merging two copies of the same `@isdefined` result loses the "x is defined" refinement.
    const CC = Base.Compiler
    println("VERSION = ", VERSION, ", commit ", Base.GIT_VERSION_INFO.commit)
    L = CC.typeinf_lattice(CC.NativeInterpreter())
    # Julia 1.13 has no `ssadef` field.
    mkcond(t, e) = hasfield(CC.Conditional, :ssadef) ? CC.Conditional(1, 0, t, e; isdefined=true) :
                                                       CC.Conditional(1, t, e; isdefined=true)
    c = mkcond(Int, Int)     # `@isdefined x` for a slot x::Int
    r = CC.tmerge(L, c, c)
    println("tmerge(c, c) = ", r, ";  ⊑(r, c) = ", CC.:⊑(L, r, c))
    c2 = mkcond(Int, Nothing)
    r2 = CC.tmerge(L, c2, c2)
    println("tmerge(c2, c2) = ", r2, ";  ⊑(r2, c2) = ", CC.:⊑(L, r2, c2))
    
    # User-visible effect: `f` merges two identical `@isdefined(x)` results at the phi of `c`.
    function f(b1::Bool, b2::Bool)
        if b1
            x = 1
        end
        c = b2 ? @isdefined(x) : @isdefined(x)
        c && return x
        return 0
    end
    function g(b1::Bool, b2::Bool)
        if b1
            x = 1
        end
        c = @isdefined(x)
        c && return x
        return 0
    end
    ef = Base.infer_exception_type(f, (Bool, Bool))
    eg = Base.infer_exception_type(g, (Bool, Bool))
    println("infer_exception_type(f) = ", ef, ";  infer_exception_type(g) = ", eg)
    println("infer_effects(f) = ", Base.infer_effects(f, (Bool, Bool)), ";  infer_effects(g) = ",
            Base.infer_effects(g, (Bool, Bool)))
    if !CC.:⊑(L, r, c) && !CC.:⊑(L, r2, c2) && ef === UndefVarError && eg === Union{}
        println("REPRODUCED typelimits-tmerge-conditional-idempotent")
    end
