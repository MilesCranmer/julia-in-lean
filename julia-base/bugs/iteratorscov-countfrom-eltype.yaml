id: iteratorscov-countfrom-eltype
title: "eltype(Iterators.countfrom(true)) is Bool, but it yields 2, 3, ..., so collect throws InexactError"
priority: P3
kind: wrong-result
area: IteratorsCov
files:
- base/iterators.jl
functions:
- countfrom(start::Number, step::Number)
- countfrom(start)
- eltype(::Type{<:Count{T}})
- iterate(::Count, state)
summary: |
  The Number methods of countfrom build Count(promote(start, step)...), whose
  element type is the promoted type of start and step. The elements are
  start, start + step, ..., whose type is typeof(start + step). For Bool the two
  differ: countfrom(true) and countfrom(false, true) report eltype Bool but yield
  true, 2, 3, ..., so collect(take(countfrom(true), 3)) allocates a Vector{Bool}
  and throws InexactError(:Bool, 2).
likelihood: |
  Low: counting from a Bool is unusual. The eltype is still silently wrong for
  any code that trusts it.
maybe_intended: |
  Counting from a Bool is unusual; one could argue Bool start values are not
  meant to be supported, although the docstring places no restriction on start.
reproducer: |
  c = Iterators.countfrom(true)
  eltype(c)                          # Bool
  first(Iterators.drop(c, 1))        # 2 :: Int64
  collect(Iterators.take(c, 3))      # InexactError: Bool(2)
output:
  release: |
    eltype = Bool
    second element = 2 :: Int64
    collect(take(countfrom(true), 3)) = InexactError(:Bool, (Bool, 2))
    REPRODUCED iteratorscov-countfrom-eltype
  nightly: |
    eltype = Bool
    second element = 2 :: Int64
    collect(take(countfrom(true), 3)) = InexactError(:Bool, (Bool, 2))
    REPRODUCED iteratorscov-countfrom-eltype
reproduced:
  release: true
  nightly: true
expected: |
  eltype(countfrom(true)) == Int, matching the elements true + true == 2, ...,
  and collect(take(countfrom(true), 3)) == [1, 2, 3].
promised_by: |
  eltype docstring, base/abstractarray.jl: "Determine the type of the elements
  generated by iterating a collection of the given type"; countfrom docstring,
  base/iterators.jl:748-751: "An iterator that counts forever, starting at start
  and incrementing by step".
cause: |
  base/iterators.jl:765-766: countfrom(start::Number, step::Number) =
  Count(promote(start, step)...) and countfrom(start) = Count(start,
  oneunit(start)) take T = typeof(start), while iterate (line 772) returns
  state + it.step. The generic method on line 764 already uses
  Count{typeof(start+step),S}.
possible_fix: |
  Use Count{typeof(start+step)} (after promotion) in the Number methods too, as
  line 764 does.
duplicates:
  issues:
  - number: 37747
    state: merged
    relation: related
  queries:
  - countfrom
  - countfrom Bool
  - countfrom eltype
  - countfrom true
  - Count eltype
  - Iterators.countfrom InexactError
lean:
  property: JuliaLean.IteratorsCov.CountfromEltype
  theorem: JuliaLean.IteratorsCov.countfromEltype_refuted
