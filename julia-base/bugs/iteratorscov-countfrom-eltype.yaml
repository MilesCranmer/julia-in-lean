id: iteratorscov-countfrom-eltype
title: countfrom(true) declares Bool elements but yields integers outside Bool
priority: P3
kind: wrong-result
area: IteratorsCov
files:
  - base/iterators.jl
  - base/abstractarray.jl
functions:
  - countfrom(start::Number, step::Number)
  - countfrom(start)
  - eltype(::Type{<:Count{T}})
  - iterate(::Count, state)
summary: |
  countfrom(true) declares eltype Bool but yields true, 2, 3, and so on.
  Bool addition returns Int, whereas Count stores the initial Bool type as
  its declared element type. Collecting its first three elements allocates
  Bool storage and throws InexactError when inserting 2.
likelihood: |
  Counting from Bool is unusual, but Bool is a Number and these constructors
  accept it. Generic code that trusts eltype gets a conversion error.
maybe_intended: |
  Bool starts may not have been a motivating use case. No documented
  restriction excludes them, and a declared element type must describe the
  yielded values. The generic two-argument constructor already chooses
  typeof(start+step), unlike the Number and one-argument constructors.
reproducer: |
  c = Iterators.countfrom(true)
  eltype(c)  # Bool
  y = iterate(c)
  y = iterate(c, y[2])
  y[1]       # 2 :: Int64
  collect(Iterators.take(c, 3))  # throws InexactError
output:
  release: |
    eltype = Bool
    second element = 2 :: Int64
    collect(take(countfrom(true), 3)) = InexactError(:Bool, (Bool, 2))
    REPRODUCED iteratorscov-countfrom-eltype
  nightly: |
    eltype = Bool
    second element = 2 :: Int64
    collect(take(countfrom(true), 3)) = InexactError(:Bool, (Bool, 2))
    REPRODUCED iteratorscov-countfrom-eltype
reproduced:
  release: true
  nightly: true
expected: |
  The declared element type should contain every yielded value. For Bool
  starts and steps, using Int would allow collecting the prefix [1, 2, 3].
promised_by: |
  Pinned source f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  base/abstractarray.jl:226: "Determine the type of the elements generated by iterating a collection of the given `type`."
  base/iterators.jl:751: "An iterator that counts forever, starting at `start` and incrementing by `step`."
cause: |
  base/iterators.jl:765 constructs Count(promote(start, step)...) for Number
  arguments, and line 766 constructs Count(start, oneunit(start)). Both infer
  T from the initial value. eltype returns T at line 770, but iterate at
  line 772 advances using state + it.step, which changes Bool to Int.
possible_fix: |
  Make the Number and one-argument constructors choose an element type that
  accounts for addition, consistently with the generic constructor at line
  764. Ensure the stored initial value and subsequent states fit that type.
duplicates:
  issues: []
  prs:
    - number: 37747
      state: merged
      relation: related
      note: "related generic countfrom constructor using typeof(start+step)"
  search_notes: |
    The related PR adds the generic constructor; it does not report this
    Bool failure. No direct duplicate is known.
  queries:
    - countfrom Bool
    - countfrom eltype
    - countfrom true
lean:
  property: JuliaLean.Proofs.base.iterators.CountfromEltype
  theorem: JuliaLean.ChatGPT.Batch4.Group5.IteratorscovCountfromEltype_refuted
