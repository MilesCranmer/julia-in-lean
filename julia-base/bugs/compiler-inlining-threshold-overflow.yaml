reproduced: {release: true, nightly: true, master: true}
expected: |
  A larger inline_cost_threshold never makes a method less inlineable; the threshold
  saturates at typemax(Int) instead of wrapping.
promised_by: |
  The comments at Compiler/src/typeinfer.jl:533 and 537 describe each adjustment as an increase
  ("increase the cost threshold 20x", "a few functions get special treatment"); the threshold is a
  cost limit, so adding non-negative amounts should not lower it.
cause: |
  Compiler/src/typeinfer.jl:531, 535 and 541 (`cost_threshold += params.inline_tupleret_bonus`,
  `cost_threshold += 19*default`, `cost_threshold += 4*default`) use wrapping Int arithmetic.
  typemax(Int) + 250 is negative, typemax(Int) + 19*typemax(Int) is -20 (typemax(Int) + 4*typemax(Int)
  is typemax(Int) - 4, which happens to stay large). A negative threshold makes inline_cost_model(ir,
  ...) return MAX_INLINE_COST after the first statement. The lines are unchanged on master
  eb844b8ebd (2026-11-10).
possible_fix: |
  Use saturating additions (as JeffBezanson and adienes suggested on #60121), for example
  `cost_threshold = plus_saturate(cost_threshold, ...)`, and saturate 19*default and 4*default too.
