id: compiler-inlining-threshold-overflow
title: "inline_cost_model wraps the cost threshold when inline_cost_threshold is typemax(Int)"
priority: P3
kind: wrong-result
area: Compiler
files: [Compiler/src/typeinfer.jl]
functions: ["inline_cost_model(interp::AbstractInterpreter, result::InferenceResult, inline_flag::UInt8, ir::IRCode)"]
summary: |
  inline_cost_model raises cost_threshold with plain Int additions: += inline_tupleret_bonus
  for a non-concrete Tuple return, += 19*default for an @inline method, += 4*default for
  Base.iterate/cconvert/unsafe_convert. With inline_cost_threshold = typemax(Int), which
  GPUCompiler sets to force inlining, the first two wrap to a negative threshold, so every such
  method gets MAX_INLINE_COST and is never inlined, the opposite of what the setting asks for.
  Small methods that are inlined with the default parameters stay calls.
likelihood: |
  Reached by any AbstractInterpreter that sets inline_cost_threshold near typemax(Int);
  GPUCompiler did (JuliaLang/julia#60121, JuliaGPU/AMDGPU.jl#846). Methods returning a Union of
  tuples or an abstract Tuple are common. Default parameters (100) are far from the limit.
  Triage 2026-11-10 (was P2). Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  Known: JuliaLang/julia#60121 is this bug, a PR closed unmerged on 2026-06-26. JeffBezanson and
  adienes agreed there that the additions should saturate, and oscardssmith suggested not using
  typemax(Int). GPUCompiler stopped passing typemax(Int) in JuliaGPU/GPUCompiler.jl#741, so its
  users no longer hit it; they hit compiler-inlining-clamp-finite-to-max instead. Master
  typeinfer.jl:552-562 is unchanged. P3: no known caller still passes typemax(Int), and the fix
  should go with the clamp fix.
maybe_intended: |
  A reviewer on #60121 argued that a threshold so large that its arithmetic wraps is not
  sensible and a few billion should be used instead. Then compiler-inlining-clamp-finite-to-max
  applies: every body costing more than 3968 is still reported non-inlineable.
reproducer: |
  params = OptimizationParams(; inline_cost_threshold = typemax(Int))   # in a custom interpreter
  tuplefn(x::Int) = x > 0 ? (x,) : (x, x)
  calltuple(x) = tuplefn(x)
  code_typed(calltuple, (Int,); interp)   # still calls tuplefn; inlined with default params
