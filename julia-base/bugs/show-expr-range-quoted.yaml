id: show-expr-range-quoted
title: "Expr printing of a : :b gives a::b, a type assertion"
priority: P3
kind: wrong-result
area: Show
files: [base/show.jl]
functions: ["show_unquoted(::IO, ::Expr, ::Int, ::Int)"]
summary: |
  Expr(:call, :(:), :a, QuoteNode(:b)) (from Meta.parse("a : :b")) prints as "a::b",
  which parses as the type assertion Expr(:(::), :a, :b). The range operator is printed
  without surrounding spaces, so an operand that starts with ':' fuses with it into '::'.
  "x : :end" prints "x::end", a ParseError.
likelihood: |
  Rare: ranges whose right operand is a quoted symbol or operator.
maybe_intended: ""
reproducer: |
  ex = Meta.parse("a : :b")           # Expr(:call, :(:), :a, QuoteNode(:b))
  s = string(ex)
  println("string(ex) = ", repr(s))
  back = Meta.parse(s)
  println("Meta.parse(string(ex)) = ", sprint(Meta.show_sexpr, back), "   original = ", sprint(Meta.show_sexpr, ex))
  back != ex && println("REPRODUCED show-expr-range-quoted")
output:
  release: |
    string(ex) = "a::b"
    Meta.parse(string(ex)) = (:(::), :a, :b)   original = (:call, :(:), :a, (:quote, #QuoteNode
        :b
      ))
    REPRODUCED show-expr-range-quoted
  nightly: |
    string(ex) = "a::b"
    Meta.parse(string(ex)) = (:(::), :a, :b)   original = (:call, :(:), :a, (:quote, #QuoteNode
        :b
      ))
    REPRODUCED show-expr-range-quoted
reproduced: {release: true, nightly: true}
expected: |
  "a : :b" (or "a:(:b)").
promised_by: |
  base/show.jl:1636-1640: "AST printing should follow two rules: 1. Meta.parse(string(ex))
  == ex ...".
cause: |
  base/show.jl:2209 uses sep = "$func" (no spaces) for :(:) and then prints the QuoteNode
  operand as ":b" (base/show.jl:1924-1926, 1943-1944).
possible_fix: |
  Use " : " as separator (or parenthesize) when an operand of : prints with a leading colon.
duplicates:
  issues: []
  queries:
    - "issues: range quoted symbol print"
    - "issues: colon operator printing"
    - "prs: range quoted symbol print"
    - "prs: colon operator printing"
    - "issues: show_unquoted"
    - "issues: deparse"
    - "issues: printing Expr precedence"
    - "issues: string Meta.parse roundtrip"
    - "issues: Expr printing"
lean:
  property: JuliaLean.Show.RangeQuotedReparses
  theorem: JuliaLean.Show.rangeQuotedReparses_refuted
