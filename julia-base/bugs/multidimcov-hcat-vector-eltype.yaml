id: multidimcov-hcat-vector-eltype
title: hcat's documented equivalence to cat omits value-dependent element type narrowing
priority: P3
kind: documentation
area: MultidimCov
files:
  - base/array.jl
  - base/abstractarray.jl
functions:
  - hcat(V::Vector{T}...) where T
summary: |
  hcat(Any[1], Any[2]) returns Matrix{Int64}, while cat(Any[1], Any[2]; dims=2)
  returns Matrix{Any}. Vectors sharing a union element type can also narrow to
  Int64. The docstring calls hcat equivalent to cat with dims=2 without stating
  this type difference, which affects later mutation of the result.
likelihood: |
  Code that assembles Vector{Any} or union-typed columns can receive a matrix
  that rejects later values accepted by its input columns. The reproducer's
  attempt to store a String throws MethodError.
maybe_intended: |
  Narrowing is intentional historical behavior. In #33919, changing hcat so
  it no longer narrowed abstract element types was called unintentional and
  marked for reversal. PR #64568 explicitly preserves the comprehension for
  abstract T for that reason. This report concerns the unqualified documentation
  equivalence, rather than asserting that preserving T is the settled policy.
reproducer: |
  a = hcat(Any[1], Any[2])
  b = cat(Any[1], Any[2]; dims=2)
  typeof(a), typeof(b)
  typeof(hcat(Union{Int,Float64}[1, 2], Union{Int,Float64}[3, 4]))
  a[1] = "x"
output:
  release: |
    hcat(Any[1], Any[2]) isa Matrix{Int64}
    cat(Any[1], Any[2]; dims=2) isa Matrix{Any}
    vcat(Any[1], Any[2]) isa Vector{Any}
    hcat of two Vector{Union{Int,Float64}} isa Matrix{Int64}
    a[1] = "x": MethodError
    REPRODUCED multidimcov-hcat-vector-eltype
  nightly: |
    hcat(Any[1], Any[2]) isa Matrix{Int64}
    cat(Any[1], Any[2]; dims=2) isa Matrix{Any}
    vcat(Any[1], Any[2]) isa Vector{Any}
    hcat of two Vector{Union{Int,Float64}} isa Matrix{Int64}
    a[1] = "x": MethodError
    REPRODUCED multidimcov-hcat-vector-eltype
reproduced:
  release: true
  nightly: true
expected: |
  Qualify the hcat/cat equivalence by documenting value-dependent narrowing
  for vectors with a shared abstract or union element type. Under literal type
  equivalence, the first result would instead be Matrix{Any}; the historical
  discussion shows that forcing this behavior would reverse an intentional
  policy. The reproducer catches the final assignment exception.
promised_by: |
  base/abstractarray.jl:2005-2008 at f755f49a9e41380d7da126b3c1db9fe7f83dd027:
  "    hcat(A...)

  Concatenate arrays or numbers horizontally. Equivalent to [`cat`](@ref)`(A...; dims=2)`,
  and to the syntax `[a b c]` or `[a;; b;; c]`."
  This text does not qualify the equivalence by result element type.
cause: |
  base/array.jl:2335-2343 handles vectors sharing T with the untyped comprehension
  [ V[j][i]::T for i=1:length(V[1]), j=1:length(V) ]. The ::T assertion checks
  values but does not prescribe the destination element type. The comprehension
  can narrow from the declared T to the types of the actual values. The general
  cat path preserves Any for this example instead.
possible_fix: |
  Document this element-type exception in hcat and include a comparison with
  cat(A...; dims=2). If the API policy is changed to require identical element
  types, use a typed destination; that behavior change needs to account for
  the intentional narrowing discussed in #33919.
