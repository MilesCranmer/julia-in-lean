  notes: |
    Issue #26004 is an existing duplicate: it gives the same union-typed
    narrowing and contrasts vcat. Its link to PR #19387 concerns earlier
    type-stabilizing concatenation work. PR #64568 explicitly preserves
    abstract-T narrowing and points to #33919; the comments on #33919 include
    a request to revert the change that stopped narrowing. No targeted
    documentation fix is known.
