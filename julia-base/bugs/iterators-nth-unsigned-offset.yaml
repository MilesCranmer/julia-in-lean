id: iterators-nth-unsigned-offset
title: "Iterators.nth(A, n::Unsigned) throws BoundsError for arrays with negative first indices"
priority: P2
kind: wrong-exception
area: Iterators
files: [base/iterators.jl]
functions: ["nth(::AbstractArray, n)"]
summary: |
  For an array with a negative first index, `nth(::AbstractArray, n)` throws
  `BoundsError` when `n` is an unsigned integer, even when `n` is in range.
  `Iterators.nth(Base.IdentityUnitRange(-2:2), UInt64(1))` and the corresponding
  `UInt128(1)` call both throw instead of returning `-2`.
likelihood: |
  Requires an array with a negative first index, such as
  `Base.IdentityUnitRange(-2:2)`, and an unsigned element number.
maybe_intended: |
  `n` is documented as an integer element number. For `A =
  Base.IdentityUnitRange(-2:2)`, both `Iterators.nth(A, UInt64(1))` and
  `Iterators.nth(A, UInt128(1))` should return `-2`.
reproducer: |
  Stored at repro/iterators-nth-unsigned-offset.jl. It calls `Iterators.nth`
  with `UInt64(1)` and `UInt128(1)` on `Base.IdentityUnitRange(-2:2)` and prints
  `REPRODUCED iterators-nth-unsigned-offset` if either call throws `BoundsError`.
  Run with `julia repro/iterators-nth-unsigned-offset.jl`.
output:
  release: |
    JULIA 1.13.2 COMMIT 45b6d15e34bbd2003a31acce0b1847b63dad029c
    expected first element: -2
    UInt64: BoundsError
    UInt128: BoundsError
    REPRODUCED iterators-nth-unsigned-offset
  nightly: |
    JULIA 1.15.0-DEV.unknown COMMIT f755f49a9e41380d7da126b3c1db9fe7f83dd027
    expected first element: -2
    UInt64: BoundsError
    UInt128: BoundsError
    REPRODUCED iterators-nth-unsigned-offset
reproduced: {release: true, nightly: true}
expected: |
  Both unsigned calls return the first element, `-2`.
promised_by: |
  The `nth(itr, n::Integer)` docstring at base/iterators.jl:1728-1731 says to
  get the n-th element and to throw `BoundsError` only when it does not exist.
  Here `n == 1` is in range and the first element is `-2`.
cause: |
  base/iterators.jl:1756 indexes with `itr[begin + n - 1]`. When `n` is
  unsigned and `begin` is negative, the expression uses unsigned arithmetic,
  wrapping the negative first index to a large positive index before lookup.
possible_fix: |
  Check the ordinal against the array length first, then calculate its array
  index without converting a negative first index to an unsigned value.
duplicates:
  issues: []
  prs: []
  queries:
    - "issues: Iterators.nth unsigned"
    - "issues: IdentityUnitRange nth"
    - "PRs: Iterators.nth offset"
lean:
  property: JuliaLean.Iterators.NthAnyIntegerType
  theorem: JuliaLean.Proofs.base.iterators.nthAnyIntegerType_refuted
