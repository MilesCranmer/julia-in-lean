reproduced: {release: true, nightly: true, master: true}
expected: |
  argloop(0) == 4: the loop body runs four times and each run adds 1 to x, as
  with --compile=min.
promised_by: |
  The semantics of the CodeInfo: the assignment x = x + 1 must be seen by the
  next iteration. The comment of compute_live_ins (Compiler/src/ssair/
  slot2ssa.jl:495-497) says it removes only blocks "where all uses are
  dominated by a def"; here the use is not dominated by any def on the path
  from the back edge.
cause: |
  Compiler/src/ssair/slot2ssa.jl:503-515: the merge loop maps def 0 (the
  argument def that scan_slot_def_use adds, line 39) to block_for_inst(cfg, 0),
  which is 1, and since 0 < every use it sets block_has_def for block 1 before
  the first use. A use in block 1 is then not pushed to bb_uses, so block 1 is
  not live-in. iterated_dominance_frontier with that liveness (lines 258-262)
  does not place the phi that the back edge needs. The initial renaming gives
  the slot Argument(n) (lines 660-666), and nothing updates it on the back
  edge. Master eb844b8ebd999935a31829e19823db70c711d05f has the same lines.
  Lean: JuliaLean.Proofs.Compiler.src.ssair.slot2ssa.constructSemAll_refuted,
  on a three-block input of the same shape.
possible_fix: |
  Treat def 0 as a def on the entry edge rather than in block 1: skip it in
  the merge loop (keep block 1 in def_bbs for the IDF), so that a use in
  block 1 before any real def makes block 1 live-in. Or make
  convert_to_ircode! (or the generated-function path) insert an empty first
  block when statement 1 is a jump target.
