id: compiler-slot2ssa-arg-entry-loop
title: "An argument assigned in a loop whose header is block 1 keeps its entry value (wrong result)"
priority: P3
kind: wrong-result
area: Compiler
files: [Compiler/src/ssair/slot2ssa.jl]
functions: ["compute_live_ins(cfg::CFG, defs::Vector{Int}, uses::Vector{Int})", "construct_ssa!(ci::CodeInfo, ir::IRCode, sv::OptimizationState, domtree::DomTree, defuses::Vector{SlotInfo}, 𝕃ₒ::AbstractLattice)"]
summary: |
  When block 1 is a loop header (a goto back to statement 1) and the loop
  assigns an argument, construct_ssa! puts no phi node for the argument in
  block 1. Every iteration then reads the argument's entry value. The cause is
  in compute_live_ins: it treats the argument's def (statement 0) as a def at
  the top of block 1, so a use in block 1 counts as covered by that def, even
  though the back edge reaches the use first. Block 1 is then not live-in, and
  the pruned iterated dominance frontier drops it.
likelihood: |
  Low for source code. Lowering copies an argument that the body assigns into
  a new slot at statement 1 (`x@_3 = x@_2`), so a loop back to statement 1
  never meets an assigned argument slot. A generator that returns a CodeInfo
  (the `Expr(:meta, :generated, gen)` mechanism that packages such as Cassette
  and IRTools use) can make this shape. Nothing documents that block 1 must
  have no predecessors: compute_basic_blocks gives it the virtual predecessor
  0 and adds real predecessors for jumps to statement 1
  (Compiler/src/ssair/ir.jl:106-146).
  Triage 2026-11-10 (was P2). Rerun 2026-11-10: REPRODUCED on pinned f755f49a9e, nightly 290d5bb5f5, 1.13.3 and upstream master 4c0e39dde6 (a 2026-11-09 build, output.master).
  The input breaks a lowering invariant. Commit bc7e002d13 (2016, "create an extra slot for
  arguments that get assigned") says "It simplifies later analysis to assume that arguments are
  not overwritten". Both lowerings keep it: with JuliaLowering on master 4c0e39dde6, a loop that
  assigns an argument starts with `x@_3 = x@_2`, and the function returns 4. So only a CodeInfo
  built by hand (a generator or a tool that edits CodeInfo) can reach this. But the invariant is
  not documented (devdocs/ast.md, the @generated docs) and nothing checks it (verify_ir does
  not), and the compiler half supports assigned arguments (def 0 in scan_slot_def_use). So it is a
  silent miscompile of IR that is accepted. P3: worth a verifier check or the compute_live_ins fix,
  not a user-facing bug.
maybe_intended: |
  The code may rely on lowering's argument copy without saying so. If that is
  the intended invariant, construct_ssa! (or the generated-function path)
  should check it, because breaking it gives wrong results without an error.
reproducer: |
  # A CodeInfo for: 1: x = x + 1; 2: %2 = cont(); 3: goto 5 if not %2;
  #                 4: goto 1; 5: return x
  # returned by a generator (see repro/compiler-slot2ssa-arg-entry-loop.jl)
  const CNT = Ref(0)
  cont() = (CNT[] += 1; CNT[] < 4)
  argloop(0)   # 1; 4 with --compile=min
