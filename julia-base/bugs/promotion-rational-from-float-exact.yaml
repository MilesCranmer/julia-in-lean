id: promotion-rational-from-float-exact
title: "Rational{Int32}(2f0^31) silently clamps to 2147483647//1 on master instead of throwing InexactError"
priority: P2
kind: missing-error
area: Promotion
files: [base/rational.jl]
functions: ["Rational{T}(::AbstractFloat)", "convert(::Type{Rational{T}}, ::AbstractFloat)"]
summary: |
  On master (after PR #61297), rationalize(Int32, 2f0^31, tol=0) returns the clamped
  fallback typemax(Int32)//1 = 2147483647//1, which rounds back to Float32(2^31) = 2f0^31.
  Rational{Int32}(2f0^31) therefore accepts 2147483647//1 instead of throwing InexactError
  on overflow (1.13.2 throws InexactError).
likelihood: |
  Triggered when converting a Float32 or Float16 value equal to 2^(bits-1) or 2^bits
  into a fixed-width Rational{T} whose typemax(T) rounds up to that float.
maybe_intended: |
  Nightly regression from PR #61297's semiconvergent clamping; open PR #63403 addresses the
  typemax clamping regression.
reproducer: |
  # Rational{Int32}(2f0^31) overflows Int32 and returns 2147483647//1 on nightly instead of throwing InexactError
  x = 2f0^31
  s = try Rational{Int32}(x) catch e; e end
  println("Rational{Int32}(2f0^31) = ", s)
  if s isa Rational && s != Int64(x)
      println("REPRODUCED promotion-rational-from-float-exact")
  end
output:
  release: |
    Rational{Int32}(2f0^31) = InexactError(:Rational, (Rational{Int32}, 2.1474836f9))
  nightly: |
    Rational{Int32}(2f0^31) = 2147483647//1
    REPRODUCED promotion-rational-from-float-exact
reproduced: {release: false, nightly: true}
expected: |
  Rational{Int32}(2f0^31) throws InexactError as in 1.13.2, since 2^31 = 2147483648 overflows Int32.
promised_by: |
  base/rational.jl:3-7: "Rational{T<:Integer} <: Real — Rational number type, with
  numerator and denominator of type T. Rationals are checked for overflow."
cause: |
  base/rational.jl:217-221: r = rationalize(T, x, tol=0) followed by
  x == convert(typeof(x), r) || throw(InexactError(...)). On master, rationalize clamps
  2f0^31 to typemax(Int32)//1 = 2147483647//1 (base/rational.jl:310-315), which rounds back
  to 2f0^31 in Float32 and passes the roundtrip check without throwing.
possible_fix: |
  Compare r == x exactly (or check x <= typemax(T)) before accepting r.
duplicates:
  issues:
    - {number: 63403, state: open, relation: related}
    - {number: 61297, state: merged, relation: related}
  queries: ["Rational float conversion inexact", "Rational{Int32} Float32 overflow", "rationalize tol=0 inexact", "rationalize", "Rational InexactError", "Rational Float32 constructor"]
lean:
  property: JuliaLean.Proofs.base.rational.Round4.from_float_exact
  theorem: JuliaLean.Proofs.base.rational.Round4.from_float_exact_refuted
