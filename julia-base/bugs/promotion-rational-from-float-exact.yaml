id: promotion-rational-from-float-exact
title: "Rational{T}(x::AbstractFloat) returns a rational that is not equal to x"
priority: P2
kind: missing-error
area: Promotion
files: [base/rational.jl]
functions: ["Rational{T}(::AbstractFloat)", "convert(::Type{Rational{T}}, ::AbstractFloat)"]
summary: |
  Rational{T}(x) accepts any result of rationalize(T, x, tol=0) that rounds back to
  x, so for narrow T it returns a different number: Rational{Int8}(0.1) is 1//10,
  which is not == 0.1. On master the check also accepts typemax(T)//1 for a float
  just past the range of T: Rational{Int32}(2f0^31) returns 2147483647//1 (1.13.2
  throws InexactError there).
likelihood: |
  Any convert to a Rational with a narrow component type from a non-dyadic-friendly
  float (0.1, 1/3, ...) silently changes the value. The typemax case needs a float
  equal to 2^(bits-1) or 2^bits, a plausible boundary value.
maybe_intended: |
  The behaviour is long-standing and deliberate in the sense that the check is
  x == convert(typeof(x), r), i.e. "rounds back to x". PR #63403, which fixes the
  master typemax regression, explicitly keeps accepting results that only round
  back to the float "as every release does". No docstring describes
  Rational{T}(::AbstractFloat), so this records the conversion-is-exact reading.
reproducer: |
  # Rational{T}(x::AbstractFloat) returns a value that is not equal to x instead of throwing InexactError
  function exact(x::AbstractFloat)   # the exact value of x, from its integer decomposition
      n, p, d = Base.decompose(x)
      p >= 0 ? big(n) * big(2)^p // d : big(n) // (d * big(2)^(-p))
  end
  r = Rational{Int8}(0.1)
  println("Rational{Int8}(0.1) = ", r, ", r == 0.1: ", r == 0.1, ", exact 0.1 = ", exact(0.1))
  s = try Rational{Int32}(2f0^31) catch e; e end
  println("Rational{Int32}(2f0^31) = ", s)
  bad1 = r != 0.1
  bad2 = s isa Rational && s != 2f0^31
  if bad1
      println("REPRODUCED promotion-rational-from-float-exact")
  end
output:
  release: |
    Rational{Int8}(0.1) = 1//10, r == 0.1: false, exact 0.1 = 3602879701896397//36028797018963968
    Rational{Int32}(2f0^31) = InexactError(:Rational, (Rational{Int32}, 2.1474836f9))
    REPRODUCED promotion-rational-from-float-exact
  nightly: |
    Rational{Int8}(0.1) = 1//10, r == 0.1: false, exact 0.1 = 3602879701896397//36028797018963968
    Rational{Int32}(2f0^31) = 2147483647//1
    REPRODUCED promotion-rational-from-float-exact
reproduced: {release: true, nightly: true}
expected: |
  Rational{Int8}(0.1) throws InexactError (0.1 is 3602879701896397//2^55, which
  has no Rational{Int8} representation); Rational{Int32}(2f0^31) throws
  InexactError as in 1.13.2.
promised_by: |
  Invariant of lossless conversion: convert(T, x) returns a value equal to x or
  throws. base/essentials.jl:428-430 (convert docstring) promises InexactError for
  Integer targets when x "is not representable by T"; Rational{T} is an exact type
  and the constructor already throws InexactError for other non-representable
  inputs (e.g. Rational{Int8}(1e300)).
cause: |
  base/rational.jl:217-221: r = rationalize(T, x, tol=0) followed by
  x == convert(typeof(x), r) || throw(InexactError(...)). rationalize returns the
  best approximation that fits in T (base/rational.jl:283-288,310-315), and the
  check compares after rounding r back to the float type, so any approximation
  that rounds to x passes. On master rationalize returns typemax(T)//1 for a value
  just past the range (after PR #61297), which also rounds back to x.
possible_fix: |
  Compare exactly: accept r only if r == x (the exact Rational/Float comparison at
  base/rational.jl:521-527), which makes both cases throw.
duplicates:
  issues:
    - {number: 63403, state: open, relation: related}
    - {number: 61297, state: merged, relation: related}
  queries: ["Rational float conversion inexact", "Rational{Int8} float InexactError", "rationalize tol=0 inexact", "rationalize", "Rational InexactError", "Rational Float32 constructor"]
lean:
  property: JuliaLean.Promotion.RationalOfFloatExact
  theorem: JuliaLean.Promotion.rationalOfFloatExact_refuted
