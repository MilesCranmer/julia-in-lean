  queries: ["tuple_tfunc Vararg Type", "tuple splat Type inference isa wrong", "Tuple Vararg Type DataType inference unsound", "tuple_tfunc Vararg", "splat Type tuple inference isa", "Vararg Type DataType tuple inference wrong", "prs: tuple_tfunc", "wave 2, issues and prs, unquoted words: tuple_tfunc Vararg Type DataType", "splat Vector Type tuple inferred", "Tuple Vararg Type{Int} isa wrong", "tuple_tfunc unsound", "tuple_tfunc", "tuple Type DataType inference", "tuple Type splat", "Type Vararg tuple"]
lean:
  property: JuliaLean.Proofs.Compiler.Tfuncs.TupleParamsHaveInstances
  theorem: JuliaLean.Proofs.Compiler.Tfuncs.tupleParamsHaveInstances_refuted
  notes: "Found by the soundness smoke test of difftest/compiler/tfuncs.jl. The Lean statement is about the parameters tuple_tfunc builds (no Type{T} parameter, bare or in a trailing Vararg, as the comment at Compiler/src/tfuncs.jl:2334-2337 requires); the counterexample is argtypes [Vararg{Type{Int64}}]. Soundness against the runtime is not refuted in Lean because building the result type runs the type-construction model's partial `while` loops."
