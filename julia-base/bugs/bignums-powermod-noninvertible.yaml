id: bignums-powermod-noninvertible
title: "powermod with a negative exponent throws DivideError for BigInt but DomainError for Int when no inverse exists"
priority: P2
kind: wrong-exception
area: BigNums
files: [base/gmp.jl, base/intfuncs.jl]
functions: ["powermod(::BigInt, ::BigInt, ::BigInt)", "powermod(::Integer, ::Integer, ::BigInt)"]
summary: |
  powermod(x, p, m) with p < 0 needs the inverse of x modulo m. When it does not
  exist (gcd(x, m) != 1, or m == 0), machine integers throw DomainError from invmod,
  but BigInt hands the negative exponent to GMP's mpz_powm, which raises a division
  by zero; the caller gets DivideError. Mixed calls with a BigInt modulus also take
  the GMP path.
likelihood: |
  Only on inputs that are already errors (non-invertible base with a negative
  exponent); the exception type differs between integer types.
maybe_intended: |
  The powermod docstring does not specify the exception. GMP documents that mpz_powm
  "raises a divide by zero" when the inverse does not exist.
reproducer: |
  function err(f)
      try
          return f()
      catch e
          return e
      end
  end
  a = err(() -> powermod(2, -1, 4))
  b = err(() -> powermod(big(2), -1, big(4)))
  c = err(() -> powermod(2, -1, big(4)))
  d = err(() -> powermod(big(3), -2, big(0)))
  e = err(() -> powermod(3, -2, 0))
  println("powermod(2, -1, 4)           -> ", typeof(a))
  println("powermod(big(2), -1, big(4)) -> ", typeof(b))
  println("powermod(2, -1, big(4))      -> ", typeof(c))
  println("powermod(big(3), -2, big(0)) -> ", typeof(d))
  println("powermod(3, -2, 0)           -> ", typeof(e))
  if a isa DomainError && b isa DivideError && c isa DivideError
      println("REPRODUCED bignums-powermod-noninvertible")
  end
output:
  release: |
    powermod(2, -1, 4)           -> DomainError
    powermod(big(2), -1, big(4)) -> DivideError
    powermod(2, -1, big(4))      -> DivideError
    powermod(big(3), -2, big(0)) -> DivideError
    powermod(3, -2, 0)           -> DomainError
    REPRODUCED bignums-powermod-noninvertible
  nightly: |
    powermod(2, -1, 4)           -> DomainError
    powermod(big(2), -1, big(4)) -> DivideError
    powermod(2, -1, big(4))      -> DivideError
    powermod(big(3), -2, big(0)) -> DivideError
    powermod(3, -2, 0)           -> DomainError
    REPRODUCED bignums-powermod-noninvertible
reproduced: {release: true, nightly: true}
expected: |
  DomainError, as invmod(big(2), big(4)) and powermod(2, -1, 4) throw.
promised_by: |
  Consistency between integer types: base/intfuncs.jl:524-541 defines negative
  exponents through invmod, whose docstring (base/intfuncs.jl:289-294) says it
  "will throw an error if m = 0, or if gcd(n,m) != 1"; invmod(::BigInt, ::BigInt)
  throws DomainError for both (base/gmp.jl:518-535).
cause: |
  base/gmp.jl:669-672 calls MPZ.powm(x, p, m) for any p. GMP's mpz_powm accepts a
  negative exponent only when the inverse exists and otherwise raises
  DIVIDE_BY_ZERO (SIGFPE), which Julia reports as DivideError.
possible_fix: |
  In powermod(::BigInt, ::BigInt, ::BigInt), handle p < 0 as
  powermod(invmod(x, m), -p, m), as the generic method does.
duplicates:
  issues:
    - {number: 15350, state: closed, relation: related}
  queries: ["powermod", "powermod BigInt", "powermod DivideError", "powermod BigInt negative", "invmod BigInt"]
lean:
  property: JuliaLean.BigNums.PowermodMatchesInt
  theorem: JuliaLean.BigNums.powermodMatchesInt_refuted
