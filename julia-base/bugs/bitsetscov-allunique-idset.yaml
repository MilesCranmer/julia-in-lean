id: bitsetscov-allunique-idset
title: "IdSet predicate shortcuts disagree with documented isequal comparisons"
priority: P2
kind: wrong-result
area: BitSetsCov
files: [base/set.jl, base/idset.jl]
functions: ["allunique(::Union{AbstractSet,AbstractDict})", "allequal(::Union{AbstractSet,AbstractDict})"]
summary: |
  Two separately allocated [1] vectors are distinct identity keys but have
  equal contents under isequal. An IdSet correctly retains both, yet the
  allunique and allequal shortcuts return true and false respectively.
  Applying the predicates to collect(s) gives false and true, as their
  isequal-based docstrings require. Upstream PR #64432 merged a fix on
  2026-11-01; this report describes the pinned source and the release and
  nightly builds tested.
likelihood: |
  A tiny identity set containing distinct mutable objects with equal contents
  is sufficient. Code inspecting such a collection receives a different
  answer depending on whether it first collects the elements into a vector.
maybe_intended: |
  IdSet deliberately uses === rather than isequal. Keeping both vectors is
  correct; the disputed behavior is the predicates' advertised comparison.
  PR #33632 introduced the broad allunique shortcut. PR #64432 narrows these
  shortcuts to containers for which the equality assumption is justified.
reproducer: |
  left, right = [1], [1]
  s = Base.IdSet{Vector{Int}}([left, right])
  @assert left !== right && isequal(left, right) && length(s) == 2
  @assert allunique(s) && !allunique(collect(s))
  @assert !allequal(s) && allequal(collect(s))
  println("REPRODUCED bitsetscov-allunique-idset")
output:
  release: |
    REPRODUCED bitsetscov-allunique-idset
  nightly: |
    REPRODUCED bitsetscov-allunique-idset
reproduced:
  release: true
  nightly: true
expected: |
  With the documented isequal comparison, allunique(s) should be false and
  allequal(s) should be true. IdSet should continue to retain both identity keys.
promised_by: |
  Julia commit f755f49a9e41380d7da126b3c1db9fe7f83dd027, base/set.jl:484:
  "Return `true` if all values from `itr` are distinct when compared with [`isequal`](@ref)."
  The same pinned file, base/set.jl:613:
  "Return `true` if all values from `itr` are equal when compared with [`isequal`](@ref)."
  Its base/idset.jl:7-8 explicitly says "`IdSet{T}()` constructs a set (see [`Set`](@ref)) using"
  followed by "`===` as equality with values of type `T`."
cause: |
  At the pinned commit, base/set.jl:544 returns true for every AbstractSet or
  AbstractDict without comparing elements. Line 658 reduces allequal to a
  length check. Identity-key uniqueness does not imply isequal distinctness.
possible_fix: |
  Use the restriction implemented by merged upstream PR #64432, retaining
  shortcuts only for the supported isequal-keyed containers and using the
  generic predicate methods for identity collections.
