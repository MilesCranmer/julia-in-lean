    - {number: 37280, state: closed, relation: related}
  queries:
    - "gh search issues 'findnext offset' --repo JuliaLang/julia --limit 100 --json number,title,state,url"
    - "gh search prs 'findnext offset' --repo JuliaLang/julia --limit 100 --json number,title,state,url"
    - "gh search issues 'byte search offset' --repo JuliaLang/julia --limit 100 --json number,title,state,url"
    - "gh search issues '_searchindex' --repo JuliaLang/julia --limit 100 --json number,title,state,url"
    - "gh search prs 'offset search' --repo JuliaLang/julia --limit 100 --json number,title,state,url"
  search_notes: |
    No matching issue is known. Issue #37280 introduced the public
    AbstractVector overload and explicitly discussed non-one-based indexing.
    It does not report the single-byte relative-index error reproduced here.
