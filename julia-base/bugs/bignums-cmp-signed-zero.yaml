id: bignums-cmp-signed-zero
title: "cmp(big(-0.0), 0.0) and cmp(big(-0.0), 0) return 0 although isless(big(-0.0), 0.0) is true"
priority: P2
kind: wrong-result
area: BigNums
files: [base/mpfr.jl]
functions: ["cmp(::BigFloat, ::CdoubleMax)", "cmp(::BigFloat, ::Integer)", "cmp(::CdoubleMax, ::BigFloat)", "cmp(::Integer, ::BigFloat)"]
summary: |
  The cmp methods between BigFloat and Float16/32/64 or integers call mpfr_cmp_d,
  mpfr_cmp_si, mpfr_cmp_ui or mpfr_cmp_z, which compare numerically and treat -0.0 and
  0.0 as equal. cmp(big(-0.0), 0.0), cmp(0.0, big(-0.0)) and cmp(big(-0.0), 0) all
  return 0, while isless(big(-0.0), 0.0) is true, cmp(-0.0, 0.0) == -1 and
  cmp(big(-0.0), big(0.0)) == -1.
likelihood: |
  Needs a negative-zero BigFloat compared with cmp against a Float64 or integer zero;
  negative zeros arise from ordinary arithmetic such as -1 * big(0.0).
maybe_intended: |
  The methods mirror ==, < and <= on the same pairs, which are numeric. The cmp
  docstring does not make that distinction.
reproducer: |
  x = big(-0.0)
  println("isless(big(-0.0), 0.0) = ", isless(x, 0.0), ", isless(big(-0.0), 0) = ", isless(x, 0))
  println("cmp(big(-0.0), 0.0) = ", cmp(x, 0.0), ", cmp(0.0, big(-0.0)) = ", cmp(0.0, x))
  println("cmp(big(-0.0), 0) = ", cmp(x, 0), ", cmp(big(-0.0), big(0)) = ", cmp(x, big(0)))
  println("cmp(-0.0, 0.0) = ", cmp(-0.0, 0.0), ", cmp(-0.0, 0) = ", cmp(-0.0, 0), ", cmp(big(-0.0), big(0.0)) = ", cmp(x, big(0.0)))
  if isless(x, 0.0) && cmp(x, 0.0) == 0 && cmp(x, 0) == 0 && cmp(-0.0, 0.0) == -1
      println("REPRODUCED bignums-cmp-signed-zero")
  end
output:
  release: |
    isless(big(-0.0), 0.0) = true, isless(big(-0.0), 0) = true
    cmp(big(-0.0), 0.0) = 0, cmp(0.0, big(-0.0)) = 0
    cmp(big(-0.0), 0) = 0, cmp(big(-0.0), big(0)) = 0
    cmp(-0.0, 0.0) = -1, cmp(-0.0, 0) = -1, cmp(big(-0.0), big(0.0)) = -1
    REPRODUCED bignums-cmp-signed-zero
  nightly: |
    isless(big(-0.0), 0.0) = true, isless(big(-0.0), 0) = true
    cmp(big(-0.0), 0.0) = 0, cmp(0.0, big(-0.0)) = 0
    cmp(big(-0.0), 0) = 0, cmp(big(-0.0), big(0)) = 0
    cmp(-0.0, 0.0) = -1, cmp(-0.0, 0) = -1, cmp(big(-0.0), big(0.0)) = -1
    REPRODUCED bignums-cmp-signed-zero
reproduced: {release: true, nightly: true}
expected: |
  cmp(big(-0.0), 0.0) == -1 and cmp(0.0, big(-0.0)) == 1, matching cmp(-0.0, 0.0),
  cmp(big(-0.0), big(0.0)) and isless; likewise cmp(big(-0.0), 0) == -1 as
  cmp(-0.0, 0) == -1.
promised_by: |
  base/operators.jl:508-511 (cmp docstring): "Return -1, 0, or 1 depending on whether x
  is less than, equal to, or greater than y, respectively. Uses the total order
  implemented by isless."
cause: |
  base/mpfr.jl:994-1014 define cmp(x::BigFloat, y) for BigInt, ClongMax, CulongMax,
  Integer and CdoubleMax through MPFR's numeric comparisons, which ignore the sign of
  zero; only NaN is special-cased. The BigFloat-BigFloat pair falls back to the
  isless-based generic cmp. Lines 995-1015 on 1.13.2.
possible_fix: |
  When both sides are zero, return cmp(signbit(y), signbit(x)) (as Int); or define
  these methods through isless as the generic fallback does.
duplicates:
  issues: []
  queries: ["BigFloat cmp", "BigFloat -0.0", "BigFloat signed zero", "cmp signed zero"]
lean:
  property: JuliaLean.BigNums.CmpBigFloatIsless
  theorem: JuliaLean.BigNums.cmpBigFloatIsless_refuted
