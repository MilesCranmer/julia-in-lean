id: regexunicode-replace-capture-generic-io
title: "replace(io, s, r => s\"\\1\") throws MethodError unless io is an IOBuffer"
priority: P1
kind: crash
area: RegexUnicode
files: [base/regex.jl]
functions: ["replace(::IO, ::AbstractString, ::Pair{Regex,SubstitutionString})", "Base._write_capture(::IO, ::Int, ::Any, ::Any, ::RegexAndMatchData)"]
summary: |
  replace(io, s, r => sub) with a SubstitutionString that references a capture group
  throws "MethodError: no method matching ensureroom" for every IO that is not an
  IOBuffer: IOContext, IOStream (files), devnull, and so also stdout. The same call
  without a group reference works.
likelihood: |
  Writing a regex substitution straight to a file, stdout or an IOContext is a natural
  use of the io argument the docstring advertises; any such call with \1 or \g<name>
  fails.
maybe_intended: ""
reproducer: |
  replace(IOContext(IOBuffer()), "abc", r"(b)" => s"<\1>")   # MethodError
  replace(devnull, "abc", r"(b)" => s"<\1>")                 # MethodError
  mktemp() do path, f
      replace(f, "abc", r"(b)" => s"<\1>")                   # MethodError
  end
output:
  release: |
    IOBuffer: ok
    IOContext(IOBuffer()): MethodError: no method matching ensureroom(::IOContext{IOBuffer}, ::Int64)
    The f
    devnull: MethodError: no method matching ensureroom(::Base.DevNull, ::Int64)
    The function
    IOStream: MethodError: no method matching ensureroom(::IOStream, ::Int64)
    The function `en
    without capture, IOContext: a<a<b>c
    REPRODUCED regexunicode-replace-capture-generic-io
  nightly: |
    IOBuffer: ok
    IOContext(IOBuffer()): MethodError: no method matching ensureroom(::IOContext{IOBuffer}, ::Int64)
    The f
    devnull: MethodError: no method matching ensureroom(::Base.DevNull, ::Int64)
    The function
    IOStream: MethodError: no method matching ensureroom(::IOStream, ::Int64)
    The function `en
    without capture, IOContext: a<a<b>c
    REPRODUCED regexunicode-replace-capture-generic-io
reproduced: {release: true, nightly: true}
expected: |
  "a<b>c" written to io, as for write(io, replace("abc", r"(b)" => s"<\1>")).
promised_by: |
  replace([io::IO], s::AbstractString, pat=>r, ...) docstring: "If the io::IO argument
  is supplied, the transformed string is instead written to io (returning io)"
  (base/strings/util.jl:1133-1150); the method accepts any io::IO (util.jl:1183-1184).
cause: |
  _write_capture(io::IO, ...) for RegexAndMatchData (base/regex.jl:654-664) assumes
  io is a GenericIOBuffer: it calls ensureroom(io, len+1) and writes through io.data,
  io.ptr and io.size.
possible_fix: |
  Write the capture with write(io, SubString(str, ...)) taken from the ovector, which
  works for every IO.
duplicates:
  issues: []
  queries:
    - "issues: replace SubstitutionString IOBuffer"
    - "issues: replace io regex capture"
    - "issues: replace IOContext"
    - "issues: _write_capture"
    - "prs: _write_capture"
    - "prs: replace io argument"
lean:
  property: JuliaLean.RegexUnicode.Subst.ReplaceCaptureGenericIO
  theorem: JuliaLean.RegexUnicode.Subst.replaceCaptureGenericIO_refuted
