  release: |                          # Julia 1.13.3 67ac47b9cd8 (installed release; ARCHITECTURE.md pins 1.13.2)
    widenconst(PartialTypeVar(T)) = TypeVar
    typeinf: PartialTypeVar ⊑ TypeVar = true, TypeVar ⊑ Union{Nothing, TypeVar} = true, PartialTypeVar ⊑ Union{Nothing, TypeVar} = false
    optimizer: PartialTypeVar ⊑ Any = false
    REPRODUCED compiler-tl-sqsub-widenconst-upper
  nightly: |                          # 1.15.0-DEV.304 290d5bb5f52e815284ce14493f6964147d2f2dc7
    widenconst(PartialTypeVar(T)) = TypeVar
    typeinf: PartialTypeVar ⊑ TypeVar = true, TypeVar ⊑ Union{Nothing, TypeVar} = true, PartialTypeVar ⊑ Union{Nothing, TypeVar} = false
    optimizer: PartialTypeVar ⊑ Any = false
    REPRODUCED compiler-tl-sqsub-widenconst-upper
reproduced: {release: true, nightly: true}
expected: |
  PartialTypeVar ⊑ T for every type T with TypeVar <: T.
promised_by: |
  widenconst "widens extended lattice element x to native Type representation"
  (Compiler/src/typelattice.jl:730-734), so an element is below every supertype of
  its widening; ⊑ is an order, so it is transitive.
cause: |
  Compiler/src/typelattice.jl:561-562 returns `b === TypeVar || a === b` instead
  of deferring a type b to `TypeVar <: b`.
possible_fix: |
  For a type b, return `TypeVar <: b` (or `⊑(widenlattice(lattice), TypeVar,
  b)`); keep `a === b` for a PartialTypeVar b.
