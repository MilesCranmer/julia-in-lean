      state: open
      relation: duplicate
  queries:
    - 'gh search issues --repo JuliaLang/julia findfirst range overflow'
    - 'gh search issues --repo JuliaLang/julia findfirst Int8'
    - 'gh search issues --repo JuliaLang/julia findlast range overflow'
    - 'gh search prs --repo JuliaLang/julia findfirst range overflow'
    - 'gh search prs --repo JuliaLang/julia findfirst Int8'
    - 'gh search prs --repo JuliaLang/julia findlast range overflow'
  notes: |
    Inspected #64122, which gives the same Int8 stepped range and -27 result.
    Inspected PR #63399, whose body identifies target-minus-start overflow in
    range findfirst and proposes unsigned-distance arithmetic. It remains open.
