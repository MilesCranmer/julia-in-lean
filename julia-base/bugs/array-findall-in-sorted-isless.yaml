      state: open
      relation: related
  queries:
    - 'gh search issues --repo JuliaLang/julia findall sorted isless'
    - 'gh search issues --repo JuliaLang/julia findall signed zero'
    - 'gh search issues --repo JuliaLang/julia _sortedfindin'
    - 'gh search prs --repo JuliaLang/julia findall sorted isless'
    - 'gh search prs --repo JuliaLang/julia findall signed zero'
    - 'gh search prs --repo JuliaLang/julia _sortedfindin'
  notes: |
    Issue #64153 is the existing report; it explicitly includes the sorted
    path using ordering comparisons instead of the supplied predicate. PR
    #46222 (_sortedfindin) proposes removing an unnecessary argument and
    allowing AbstractArrays, rather than fixing equality semantics. No fixing
    PR is known.
